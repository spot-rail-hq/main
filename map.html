        if (!currentMatches.length) return;
        e.preventDefault();
        highlightedIndex = highlightedIndex < currentMatches.length - 1 ? highlightedIndex + 1 : 0;
        applyHighlight();
        return;
      }
      if (e.key === 'ArrowUp') {
        if (!currentMatches.length) return;
        e.preventDefault();
        highlightedIndex = highlightedIndex > 0 ? highlightedIndex - 1 : currentMatches.length - 1;
        applyHighlight();
        return;
      }
      if (e.key === 'Enter' && highlightedIndex >= 0) {
        // A suggestion is actively highlighted — Enter selects IT, same as
        // a click, taking priority over this field's own separate Enter
        // listener (registered right after this call, elsewhere — the
        // top-match/focus-next fallback used when nothing is highlighted).
        // stopImmediatePropagation so that other listener doesn't also fire
        // for the same keypress.
        e.preventDefault();
        e.stopImmediatePropagation();
        pick(highlightedIndex);
      }
    });
    inputEl.addEventListener('blur', function () {
      setTimeout(closeDropdown, 120); // delay lets the mousedown above register first
    });
  }

  var stationPick = null;
  function submitStationPick(picked) {
    if (picked.lat != null && picked.lon != null) map.flyTo({ center: [picked.lon, picked.lat], zoom: 10, duration: 800 }); // was 11 — one level out
    selectStation(picked.name, stationIdOf(picked));
  }
  // Both of these dispatch on `mode`, CHECKED AT CALL TIME — wireAutocomplete
  // binds its onPick/searchFn callbacks once, at page load, and mode changes
  // constantly afterward, so a fixed function reference chosen once could
  // never track it. This is also the actual fix for the reported bug: the
  // live and historical datasets don't share an id namespace (station-list.json
  // CRS/ATCO ids vs. the historical index's wikidata QIDs), so a History-mode
  // search now literally cannot return or select a live-dataset record —
  // there's nothing to accidentally cross-wire, not just a guard against it.
  function searchStationTab(query, limit) {
    return mode === 'history' ? searchHistoricalStations(query, limit) : searchStations(query, limit);
  }
  function submitStationTabPick(picked) {
    if (mode === 'history') { selectHistoricalStationFromSearch(picked); return; }
    submitStationPick(picked);
  }
  wireAutocomplete(searchInput, document.getElementById('sb-ac-station'), function (picked) {
    stationPick = picked;
    if (picked) submitStationTabPick(picked);
  }, searchStationTab);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var picked = stationPick || searchStationTab(searchInput.value, 1)[0];
    if (picked) submitStationTabPick(picked);
  });

  var fromPick = null, toPick = null;
  // From/To runs over data/routing-graph.json, whose nodes come from the
  // CRS-keyed station-graph links — a tram, DLR or Underground stop has no node
  // in it and never will. They are therefore kept OUT OF THE PICKER entirely
  // rather than offered and then refused: computeFromToPath()'s
  // 'not-national-rail' reason still exists as the backstop for a deep link or a
  // saved pair, but it should never be how someone first learns this, and a
  // dropdown that lists a station you cannot choose is worse than one that
  // doesn't. The plain station search is UNCHANGED — non-CRS stations remain
  // fully searchable there, this narrowing applies only to the two journey
  // fields.
  function searchNationalRailStations(query, limit) {
    var want = limit || 7;
    // Over-fetch before filtering: searchStations() truncates to `limit` first,
    // so filtering afterwards would return short lists in dense areas where the
    // top matches are tram stops.
    return searchStations(query, want * 4).filter(function (s) { return !!s.crs; }).slice(0, want);
  }
  function trySubmitFromTo() {
    var f = fromPick || searchNationalRailStations(fromInput.value, 1)[0];
    var t = toPick || searchNationalRailStations(toInput.value, 1)[0];
    if (f && t) selectFromTo(f, t);
  }
  wireAutocomplete(fromInput, document.getElementById('sb-ac-from'), function (picked) {
    fromPick = picked;
    if (picked && toPick) trySubmitFromTo();
  }, searchNationalRailStations);
  wireAutocomplete(toInput, document.getElementById('sb-ac-to'), function (picked) {
    toPick = picked;
    if (picked && fromPick) trySubmitFromTo();
  }, searchNationalRailStations);
  fromInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') toInput.focus(); });
  toInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') trySubmitFromTo(); });

  // Operator search — same wireAutocomplete/pick-on-Enter pattern as Station
  // above, just backed by searchOperators and handed off to the existing
  // selectOperator() (Task 1's route/operator selection), not a map flyTo —
  // an operator isn't a single point on the map.
  var operatorPick = null;
  // Guard, not just the hidden-in-Live tab below: setMode() already treats
  // an 'operator' selection as Database-only (drops it if mode flips to
  // Live while one's active — see its dbOnly comment) but nothing stopped
  // one from being CREATED while already in Live, which is exactly how you
  // could search an operator from the Live tab and see the Database-style
  // detail card render there (2026-07-21 bugfix). This is the actual root
  // fix; hiding the tab in Live is the visible half of it.
  // Highlight + fly to an operator's network. Shared by the search pick and by
  // back/forward restore, so both behave identically — this used to be inline
  // in submitOperatorPick(), which is why a restored operator got its panel but
  // no map highlight and no camera move.
  //
  // Deliberately NOT folded into selectOperator() itself: that is also called
  // from clicking a route directly on the map, where the line is already under
  // the cursor and flying away and back would be a disorienting, unrequested
  // camera move; a region-chip click inside the detail panel has its own
  // curated flyTo too. Only "arrived here without knowing where the network is"
  // needs this.
  //
  // jumpTo (instant, no animation) to the standard "All UK" view first forces
  // broad tile loading regardless of where the camera was, so
  // flyToOperatorNetwork's tile query has something to find — the user sees ONE
  // animated move, not a jump-to-wrong-place-then-fly-to-right-place.
  function highlightAndFlyToOperator(code, mySeq) {
    if (!code || !map) return;
    // ASKED BEFORE THE JUMP, not after. If this operator has no track in the
    // tileset there is nothing to fly to, so the whole camera sequence is
    // skipped — no jump, no fly, no restore. The camera does not move at all;
    // the panel explains why instead. See operatorTilesetKeys().
    operatorTilesetKeys().then(function (keys) {
      if (mySeq !== selectionSeq) return; // superseded by a newer selection
      var highlightCode = code;
      if (keys && !keys[code]) {
        operatorNoTrackCode = code;
        rebuildSidebarContent();
        // A FOLDED operator (LN -> WMR) has no track of its own because OSM tags
        // those services under the parent brand — but the trains do run, and the
        // user asking for London Northwestern is entitled to see where.
        // Highlight the PARENT's network instead of leaving the map blank; the
        // notice in the panel names the parent so the substitution is never
        // silent. A genuine absence (HT) still shows nothing, which is honest —
        // there is no geometry anywhere to point at.
        //
        // GN/GX/TL/SN were in this list until 2026-08-05 and are not any more —
        // they carry their own segments now. See OPERATOR_FOLDED_INTO.
        //
        // ⚠ KNOWN GAP, flagged not fixed: GTR is now the mirror image of this
        // case. It has ZERO segments (all four sub-brands took them), so
        // selecting the parent falls through to the generic "route data isn't
        // available yet" notice — which is misleading, since its trains are all
        // over the map under four other names. Fixing it needs a ONE-TO-MANY
        // fold (GTR -> [SN, TL, GN, GX]) that this map cannot express: both
        // OPERATOR_FOLDED_INTO and highlightCode are single-valued.
        highlightCode = OPERATOR_FOLDED_INTO[code];
        if (!highlightCode || !keys[highlightCode]) return; // nothing to show — camera stays put
      } else {
        operatorNoTrackCode = null;
      }
      lockedOperatorHighlight = highlightCode;
      applyOperatorHighlightPaint();
      map.jumpTo({ center: mapInitCenter, zoom: mapInitZoom, padding: regionJumpFlyToPadding() });
      // Captured AFTER the jumpTo above, which is programmatic and so does not
      // itself count as a gesture — this is the baseline the retry loop
      // compares against.
      flyToOperatorNetwork(highlightCode, mySeq, 1, userCameraGestureSeq);
    });
  }
  function submitOperatorPick(picked) {
    // Heritage results take a different route entirely: there is no
    // operators-content.json code to select, no tilestats key to check, and the
    // flyTo target is the railway's own curated centre rather than a computed
    // network extent. Handled BEFORE the mode guard because a heritage pick
    // should work the same from either tab — selectHeritageRailway() switches
    // into Database itself, exactly as the line click path does.
    if (picked.heritageSlug) { submitHeritagePick(picked.heritageSlug); return; }
    if (mode !== 'database') return;
    selectOperator(picked.code);
    highlightAndFlyToOperator(picked.code, selectionSeq);
  }
  /**
   * Search-driven heritage selection. Now a thin wrapper: selectHeritageRailway()
   * owns the lock, the mode switch, the panel and the camera, so a search pick
   * and a click on the line itself land in exactly the same state. It used to
   * also force the heritage layer visible (the search had to win over a toggle
   * that could hide the result); heritage lines are always visible as of
   * 2026-08-03, so there is nothing left to enable.
   *
   * Railways with no map presence still select and still open their panel — the
   * panel carries the explanation (see heritageNoMapNoticeHtml) and
   * focusHeritageRailway() holds the camera rather than flying to blank map.
   */
  function submitHeritagePick(slug) {
    if (!heritageRailways[slug]) return;
    selectHeritageRailway(slug, true); // search: fly, same as an operator pick
  }
  wireAutocomplete(operatorInput, document.getElementById('sb-ac-operator'), function (picked) {
    operatorPick = picked;
    if (picked) submitOperatorPick(picked);
  }, searchOperators);
  operatorInput.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var picked = operatorPick || searchOperators(operatorInput.value, 1)[0];
    if (picked) submitOperatorPick(picked);
  });

  // ── Filters (client-side categories over incidents) ──────────────────────
  var FILTERS = ['All', 'Urgent', 'North', 'Midlands', 'South', 'Scotland', 'Wales', 'WCML', 'ECML', 'GWR', 'Heritage'];
  var ENTITY_FILTER_KEY = 'entity';

  function normalizeOpName(str) {
    return (str || '').toLowerCase().trim().replace(/\s+/g, ' ');
  }

  // Two operator display names are treated as the same operator if they're
  // equal after normalizing, or one contains the other (handles the raw OSM
  // data in stations-content.json carrying multiple aliases for the same
  // TOC, e.g. BHM lists "CrossCountry", "Cross Country" AND "Arriva
  // CrossCountry" as three separate strings for what the incidents feed
  // reports as a single operator name). This is approximate, not exact —
  // flagged in the PR summary, not silently assumed to be perfect.
  function operatorNamesMatch(a, b) {
    var na = normalizeOpName(a), nb = normalizeOpName(b);
    if (!na || !nb) return false;
    return na === nb || na.indexOf(nb) !== -1 || nb.indexOf(na) !== -1;
  }

  // Resolves the currently-selected station/route into { label, operators,
  // routeKeywords } for the entity filter chip (Task: incident filtering by
  // selected station/route), or null when nothing relevant is selected.
  // Mirrors sidebarSkeletonHtml()'s own selection precedence (route >
  // fromto > selectedStationCrs) so the chip always matches whatever the
  // sidebar is actually showing.
  function getSelectedEntityContext() {
    if (selection.type === 'route') {
      var r = routesContent[selection.id];
      var routeLabel = (r && r.name) || selection.fallbackName || selection.id;
      return {
        label: routeLabel,
        operators: (r && r.operator) ? [r.operator] : [],
        routeKeywords: [routeLabel],
      };
    }
    if (selection.type === 'fromto') {
      var ops = [];
      if (selection.directRouteId) {
        var route = routesContent[selection.directRouteId];
        if (route && route.operator) ops.push(route.operator);
      }
      [selection.fromCrs, selection.toCrs].forEach(function (crs) {
        var s = stationsContent[crs] || stationsContent[(crs || '').toUpperCase()];
        if (s && s.operators) ops = ops.concat(s.operators);
      });
      return {
        label: selection.fromCrs + '-' + selection.toCrs,
        operators: ops,
        routeKeywords: [selection.fromName, selection.toName].filter(Boolean),
      };
    }
    if (selectedStationId) {
      var st = selectedStationCrs ? stationsContent[selectedStationCrs.toUpperCase()] : null;
      return {
        label: selectedStationName || selectedStationCrs,
        operators: (st && st.operators) || [],
        routeKeywords: [],
      };
    }
    return null;
  }

  // Primary signal: incident.operators (from api/incidents.js) intersected
  // against the selected entity's known operators. Secondary/fallback
  // signal, only checked when the primary finds nothing: the entity's
  // name(s) as a substring of the incident's free-text routesAffected —
  // useful for a curated route whose name (e.g. "Cross-City Line") might
  // show up in the incident text even if operator matching misses it.
  function incidentMatchesEntity(n, ctx) {
    if (!ctx) return false;
    var incidentOps = n.operators || [];
    var ctxOps = ctx.operators || [];
    if (ctxOps.some(function (co) { return incidentOps.some(function (io) { return operatorNamesMatch(co, io); }); })) {
      return true;
    }
    if (ctx.routeKeywords && ctx.routeKeywords.length && n.routesAffected) {
      var text = n.routesAffected.toLowerCase();
      return ctx.routeKeywords.some(function (kw) { return kw && text.indexOf(kw.toLowerCase()) !== -1; });
    }
    return false;
  }

  function renderFilterRow(containerId, onSelect) {
    var el = document.getElementById(containerId);
    var entityCtx = getSelectedEntityContext();
    // The chip this points at just disappeared (selection cleared) while it
    // was the active filter — fall back to "All" rather than leaving the
    // news list silently stuck on a filter with no corresponding chip.
    if (!entityCtx && activeFilter === ENTITY_FILTER_KEY) activeFilter = 'all';
    // No dedicated clear ("x") on this chip — redundant with the sidebar's
    // own station/route header clear button, which already deselects the
    // entity entirely; the guard just above already falls back to "All"
    // the moment that happens, so nothing here needs its own clear control.
    var entityChipHtml = entityCtx ?
      ('<button class="filter-chip filter-chip-entity' + (activeFilter === ENTITY_FILTER_KEY ? ' active' : '') + '" data-filter="' + ENTITY_FILTER_KEY + '">' +
        escapeAttr(entityCtx.label) +
        '</button>') : '';
    el.innerHTML = entityChipHtml + FILTERS.map(function (f) {
      var key = f.toLowerCase();
      return '<button class="filter-chip' + (key === activeFilter ? ' active' : '') + '" data-filter="' + key + '">' + f + '</button>';
    }).join('');
    // The entity chip's max-width:160px is exactly the kind of container a
    // long station/route name can overflow — groupKey scoped to this
    // containerId so a from/to search's chip and any other filter row on
    // the page don't clobber each other's marquee.
    if (entityCtx) applyMarquee('filter-chip-entity-' + containerId, [el.querySelector('.filter-chip-entity')]);
    enableWheelToHorizontalScroll(el);
    enableDragToScroll(el);
    if (el.parentElement && el.parentElement.classList.contains('scroll-fade')) {
      wireScrollFade(el.parentElement, el);
    }
    var chips = el.querySelectorAll('.filter-chip');
    Array.prototype.forEach.call(chips, function (btn) {
      btn.addEventListener('click', function () {
        activeFilter = btn.dataset.filter;
        // onSelect() (renderNews) only re-renders the news list, not this
        // row, so the active highlight has to move here directly — otherwise
        // clicking a chip visibly does nothing when there happen to be no
        // incidents to re-filter (as now, with the incidents API stubbed).
        Array.prototype.forEach.call(chips, function (b) { b.classList.toggle('active', b === btn); });
        onSelect();
      });
    });
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Must stay byte-for-byte identical to database.html's fleetClassSlug() —
  // this is how a Fleet chip's data-class-id (operators-content.json's
  // fleet_classes[].id, e.g. "390" or "01/5") turns into the #fleet-{slug}
  // anchor database.html's Row() component renders (2026-07-21 investigation:
  // 70/82 ids match a rolling-stock row exactly today; the other 12 are real
  // content gaps — classes not yet in data/site-data.json — and just land on
  // an unmatched fragment, which is a harmless no-op, not an error).
  function fleetClassSlug(id) {
    return String(id).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  // Restyled to match departures.html's row conventions: a leading status
  // icon (colored by severity) instead of a plain dot, a trailing chevron,
  // and a visible per-item timestamp (n.timestamp — was already being
  // rendered, just less prominently).
  function newsItemsHtml() {
    var entityCtx = activeFilter === ENTITY_FILTER_KEY ? getSelectedEntityContext() : null;
    var filtered = incidents.filter(function (n) {
      if (activeFilter === 'all') return true;
      if (activeFilter === 'urgent') return n.severity >= 2;
      if (activeFilter === ENTITY_FILTER_KEY) return incidentMatchesEntity(n, entityCtx);
      // n.regions (api/incidents.js's TOC→region tagging) is the real
      // mechanism; n.region/n.line are legacy fields the live feed never
      // actually populates, kept only so this predicate degrades gracefully
      // if a future data source starts sending them directly.
      if ((n.regions || []).indexOf(activeFilter) !== -1) return true;
      return (n.region || '').toLowerCase() === activeFilter || (n.line || '').toLowerCase() === activeFilter;
    });
    if (!filtered.length) return '<div class="news-empty" data-anim-row>No live disruptions right now.</div>';
    var sorted = filtered.slice().sort(function (a, b) { return (b.severity || 0) - (a.severity || 0); });
    return sorted.map(function (n) {
      var urgent = n.severity >= 2;
      // Links out to the original source article when the underlying
      // incident carries an InfoLink (api/incidents.js now populates this
      // from the real Knowledgebase Incidents feed).
      var linkHtml = n.link ? '<a class="news-link" href="' + escapeAttr(n.link) + '" target="_blank" rel="noopener">Source →</a>' : '';
      // Back to one meta line (two made the list read too sparse) —
      // n.timestamp is "HH:MM · D MMM YYYY" (api/incidents.js), so the year
      // is still visible even on this single line for items dated far out.
      return '<div class="news-item' + (urgent ? ' urgent' : '') + '" data-anim-row>' +
        '<i class="ti ti-alert-triangle news-icon"></i>' +
        '<div><div class="news-title">' + n.summary + '</div>' +
        '<div class="news-meta"><span>' + (n.timestamp || '') + ' · ' + (n.region || n.toc || '') + '</span>' + linkHtml + '</div></div>' +
        '<i class="ti ti-chevron-right news-chevron"></i></div>';
    }).join('');
  }

  function renderNews() {
    // pollIncidents() below calls this unconditionally on a 60s interval —
    // this view (the live news block) isn't present for every sidebar
    // selection type (e.g. a curated route/operator detail view), so this
    // guard prevents a stale interval tick from throwing on a null element.
    var newsItemsEl = document.getElementById('news-items');
    if (!newsItemsEl) return;
    newsItemsEl.innerHTML = newsItemsHtml();
    var urgentCount = incidents.filter(function (n) { return n.severity >= 2; }).length;
    document.getElementById('rebook-cta').classList.toggle('show', urgentCount > 0);
    document.getElementById('sb-count').textContent = Math.min(incidents.length, 5) + ' of ' + incidents.length;
    var timeEl = document.getElementById('sb-updates-time');
    if (timeEl) timeEl.textContent = new Date().toTimeString().slice(0, 5);
  }

  function pollIncidents() {
    fetch('/api/incidents', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (data) {
      incidents = Array.isArray(data) ? data : [];
      renderNews();
    }).catch(function () { incidents = []; renderNews(); });
  }
  rebuildSidebarContent(); // initial, unanimated — #14 only fires on selection changes thereafter
  pollIncidents();
  setInterval(pollIncidents, 60000);

  // ── Saved routes (localStorage) — per-station star lives inline in the
  // selection row; the top-bar star (sb-saved-toggle) opens/closes the full
  // saved-stations list view below. ─────────────────────────────────────────
  var SAVED_KEY = 'srhq_saved_routes';
  function getSavedRoutes() {
    try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; } catch (e) { return []; }
  }
  function setSavedRoutes(list) {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(list)); } catch (e) {}
  }
  // Saved records were written as {name, crs, toc, addedAt} before non-CRS
  // stations existed. They are matched on `id` now, falling back to `crs` so a
  // user's existing localStorage keeps working untouched — a saved record
  // written last week must not silently stop matching. New records carry both.
  function savedIdOf(r) {
    return (r && (r.id || r.crs)) || null;
  }
  function isStarred(id) {
    if (!id) return false;
    return getSavedRoutes().some(function (r) { return savedIdOf(r) === id; });
  }

  function savedListRowsHtml() {
    var list = getSavedRoutes();
    if (!list.length) return '<div class="sv-empty" data-anim-row>No saved stations yet — tap the star on a station to save it.</div>';
    return list.map(function (r, i) {
      return '<div class="sv-item" data-anim-row data-idx="' + i + '" data-sid="' + escapeAttr(savedIdOf(r) || '') + '">' +
        '<span class="sv-name">' + r.name + '</span>' +
        '<span class="sv-sub">' + (r.toc || '') + '</span>' +
        '</div>';
    }).join('');
  }
  function wireSavedListRows() {
    var listEl = document.getElementById('sv-list');
    if (!listEl) return;
    Array.prototype.forEach.call(listEl.querySelectorAll('.sv-item'), function (row) {
      row.addEventListener('click', function () {
        var sid = row.dataset.sid;
        var feature = stationsData && stationsData.features.find(function (f) { return f.properties.sid === sid; });
        if (!feature) return;
        map.flyTo({ center: feature.geometry.coordinates, zoom: 10, duration: 800 }); // was 11 — one level out
        selectStation(feature.properties.name, feature.properties.sid);
      });
    });
  }

  function selectSavedView() {
    ++selectionSeq;
    selection = { type: 'saved' };
    renderSelectionChrome();
    expandSidebarIfCollapsed();
    animateSidebarTransition();
  }
  savedToggleBtn.addEventListener('click', function () {
    if (selection.type === 'saved') clearSelection();
    else selectSavedView();
  });

  starBtn.addEventListener('click', function () {
    if (!selectedStationId) return;
    var list = getSavedRoutes();
    var idx = list.findIndex(function (r) { return savedIdOf(r) === selectedStationId; });
    if (idx !== -1) {
      list.splice(idx, 1);
    } else {
      // stationsData's own features carry no operator info (station-list.json,
      // its source since the map-marker tiering pass, is just name/crs/lat/
      // lon) — stations-content.json's real, OSM-membership-verified
      // operators array is a strictly better source than the old marker
      // geojson's toc field ever was anyway (that only covered the curated
      // ~50; this covers ~2,600).
      var stationOperators = selectedStationCrs && stationsContent[selectedStationCrs] && stationsContent[selectedStationCrs].operators;
      var savedRow = stationRowById(selectedStationId);
      list.push({
        name: selectedStationName,
        id: selectedStationId,
        crs: selectedStationCrs,
        // A non-CRS stop has no stations-content.json entry and so no operators
        // array; its network is the meaningful equivalent for the saved-list
        // subtitle, and station-list.json now carries it.
        toc: (stationOperators && stationOperators[0]) || (savedRow && !savedRow.crs ? savedRow.network : '') || '',
        addedAt: new Date().toISOString(),
      });
    }
    setSavedRoutes(list);
    starBtn.classList.toggle('starred', isStarred(selectedStationId));
  });

  // ── Cookie consent (compact vanilla banner) ──────────────────────────────
  var COOKIE_KEY = 'srhq-cookie-consent.v1';
  (function initCookieConsent() {
    var stored = null;
    try { stored = localStorage.getItem(COOKIE_KEY); } catch (e) {}
    if (!stored) setTimeout(function () { document.getElementById('cookie-consent').classList.add('open'); }, 600);
  })();
  function persistCookieChoice(choice) {
    try { localStorage.setItem(COOKIE_KEY, JSON.stringify({ necessary: true, analytics: choice, marketing: choice, ts: new Date().toISOString() })); } catch (e) {}
    document.getElementById('cookie-consent').classList.remove('open');
  }
  document.getElementById('cc-accept').addEventListener('click', function () { persistCookieChoice(true); });
  document.getElementById('cc-reject').addEventListener('click', function () { persistCookieChoice(false); });

})();
</script>
</body>
</html>
