  } catch (e) {}

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    -webkit-appearance: none;
    appearance: none;
    border: none;
    background: none;
    cursor: pointer;
  }

  :root {
    --t: #40E0D0; --m: #F25CC1; --a: #F5B84B; --l: #B8F266;
    --ink: #9AA4B2; --ink-primary: #ffffff; --bg: #07090C; --sf: rgba(14,18,24,0.96);
    --br: rgba(64,224,208,0.14); --brh: rgba(64,224,208,0.28);
    --font-display: 'Archivo', system-ui, sans-serif;
    --font-body: 'Manrope', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --sidebar-w: 400px;
    --sidebar-gap: 10px;
    /* Sidebar now floats with its own left inset (--sidebar-gap) instead of
       sitting flush against the viewport edge, so this is left-inset +
       width + the gap before whatever sits beside it. */
    --sidebar-edge: calc(var(--sidebar-gap) + var(--sidebar-w) + var(--sidebar-gap));
    --nav-h: 72px;

    /* Canonical site-wide tokens (same names/values as departures.html's
       master nav) — used only by the .nav/.nav-drawer* rules below, ported
       verbatim so the header matches the rest of the site exactly. The
       map-specific vars above (--t, --sf, --br, etc.) remain the source of
       truth for the sidebar/map-control styling built in the Stage A-C pass. */
    --bg-rgb: 7,9,12; --surface: #0E1218; --surface-rgb: 14,18,24; --surface2: #141922;
    --ink-site: #E8ECF2; --ink-dim: #9AA4B2; --ink-mute: #6B7687; --line-rgb: 255,255,255;
    --color-accent-turquoise: #40E0D0; --color-accent-turquoise-rgb: 64,224,208;
    --color-accent-magenta: #F25CC1; --color-accent-magenta-rgb: 242,92,193;
    --color-accent-amber: #F5B84B; --color-accent-amber-rgb: 245,184,75;
    --color-accent-lime: #B8F266; --color-accent-lime-rgb: 184,242,102;
  }
  :root[data-theme="light"] {
    /* --t/--m/--a/--l are the short-form tokens the map's OWN CSS actually
       uses (dep-status colors, star, urgent news icon, rebook CTA) — only
       --t had a light-theme override before, so --m/--a/--l were silently
       falling back to :root's saturated dark-mode values on a light
       background, which is exactly why lime (and, less noticeably, magenta/
       amber) read as washed out. All four now match departures.html's
       canonical light-theme accent values exactly (also fixes --t, which
       was a slightly different turquoise, #0AABA0, than the rest of the
       site's #1A9E8F). */
    --t: #1A9E8F; --m: #C4237A; --a: #B8860B; --l: #4A7C00;
    --ink: #444444; --ink-primary: #07090C; --bg: #f0f0f0; --sf: rgba(255,255,255,0.95);
    --br: rgba(0,0,0,0.06); --brh: rgba(0,0,0,0.12);

    --bg-rgb: 242,244,247; --surface: #FFFFFF; --surface-rgb: 255,255,255; --surface2: #E8EBF0;
    --ink-site: #0C0F14; --ink-dim: #2D3748; --ink-mute: #4A5568; --line-rgb: 7,9,12;
    --color-accent-turquoise: #1A9E8F; --color-accent-turquoise-rgb: 26,158,143;
    --color-accent-magenta: #C4237A; --color-accent-magenta-rgb: 196,35,122;
    --color-accent-amber: #B8860B; --color-accent-amber-rgb: 184,134,11;
    --color-accent-lime: #4A7C00; --color-accent-lime-rgb: 74,124,0;
  }
  html, body { width: 100vw; height: 100vh; overflow: hidden; position: relative; background: var(--bg); }
  body { font-family: var(--font-body); color: var(--ink-primary); }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--brh); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  *:focus-visible { outline: 2px solid var(--t); outline-offset: 2px; }

  #map { position: absolute; inset: 0; background: var(--bg); }
  /* Carries .pill for its surface/border/blur, but deliberately overrides two of
     .pill's properties (2026-08-04): .pill is border-radius 99px, which on a
     two-line tooltip reads as a lozenge with the text crammed against the
     curves. A rounded RECTANGLE is the right shape here, with enough horizontal
     padding that the name is not touching the rounded corners. Overriding on the
     id rather than editing .pill, because .pill is shared with the floating
     header, the footer credits and the bottom hints — all of which should stay
     pills. */
  #station-hover-tip { position: absolute; z-index: 60; transform: translate(-50%, -100%) translateY(-8px);
    padding: 5px 16px; border-radius: 10px;
    font-size: 16px; font-weight: 500; color: var(--ink-primary); white-space: nowrap;
    pointer-events: none; display: none; }
  /* Two-line variant (2026-07-29, heritage dots). Only applied when
     showHoverTooltip() is given a subtitle — the single-line path stays a bare
     text node and is visually untouched, which matters because that path is
     shared by every station hover and every operator-line hover. nowrap is
     relaxed for this variant only: the title is still one line via its own
     nowrap, but the block needs to be two lines tall. */
  /* The two-line variant needs the same generous sides — it is the wider of the
     two and the one in the screenshot that prompted this. Slightly more top/
     bottom than the single-line case so the two lines sit centred in the box. */
  #station-hover-tip.has-subtitle { white-space: normal; text-align: center; padding: 7px 18px 6px; }
  #station-hover-tip .tip-title { white-space: nowrap; }
  #station-hover-tip .tip-subtitle { font-size: 12px; font-weight: 500; color: var(--ink); opacity: 0.85;
    white-space: nowrap; margin-top: 1px; }
  .maplibregl-ctrl-attrib { font-size: 11px !important; background: rgba(7,9,12,0.7) !important; color: var(--ink) !important; }
  .maplibregl-ctrl-attrib a { color: var(--ink) !important; }
  .maplibregl-popup-content { background: var(--sf) !important; color: var(--ink-primary); border: 0.5px solid var(--brh); border-radius: 8px; font-family: var(--font-body); font-size: 12px; padding: 6px 10px !important; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .maplibregl-popup-tip { border-top-color: var(--sf) !important; border-bottom-color: var(--sf) !important; }
  .maplibregl-popup-close-button { display: none; }

  .pill { background: var(--sf); border: 0.5px solid var(--brh); border-radius: 99px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; color: var(--ink); font-size: 16px; background: var(--sf); border: 0.5px solid var(--brh); }
  /* Hover only hints (border), it never recolors the icon — otherwise a
     toggled-OFF button (aria-pressed=false) still LOOKS "on" while hovered,
     which is exactly the confusion reported. Only aria-pressed=true (the
     actual on/off state) gets the full turquoise treatment, so hover can
     never visually impersonate it. */
  .icon-btn:hover { border-color: var(--t); }
  .icon-btn[aria-pressed="true"] { color: var(--t); border-color: var(--t); }
  /* Plain-language function tooltip on hover/focus (2026-07-21 feedback —
     icon-only controls aren't self-explanatory for non-technical users).
     Reads from data-tooltip rather than aria-label so wording can differ
     slightly (aria-label describes the control for screen readers, this is
     a short human-facing hint) without double-announcing the same string
     twice. Sits to the RIGHT of the button, opening into the open map
     canvas. Bugfix (2026-07-21): #control-cluster actually sits just right
     of the sidebar (left: var(--sidebar-edge)), NOT top-right as first
     assumed — a leftward tooltip landed back UNDER the sidebar itself,
     which has a higher z-index (70 vs. #control-cluster's 55), so it
     rendered completely hidden behind it. A generated ::after isn't exposed
     in the accessibility tree the way real DOM text would be — aria-label
     already covers the a11y name, this is purely a sighted-hover
     convenience layered on top. */
  .icon-btn::after {
    content: attr(data-tooltip);
    position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
    white-space: nowrap; font-family: var(--font-body); font-size: 12px; font-weight: 500;
    color: var(--ink-primary); background: var(--sf); border: 0.5px solid var(--brh); border-radius: 6px;
    padding: 4px 8px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease; z-index: 60;
  }
  .icon-btn:hover::after, .icon-btn:focus-visible::after { opacity: 1; }
  /* Smooths the needle's rotate() updates driven by the map's 'rotate' event
     (wireBearingIcon()) instead of snapping instantly on every drag frame. */
  #reset-bearing-icon { display: inline-block; transition: transform 0.2s ease; }
  .ghost-btn { display: inline-flex; align-items: center; justify-content: center; color: var(--ink); background: transparent; border: none; width: auto; height: auto; padding: 4px; }
  .ghost-btn:hover { color: var(--t); }
  .ghost-btn[aria-pressed="true"] { color: var(--t); }

  /* ── Master site header — ported verbatim (classes/vars) from departures.html
     so it's pixel/behaviour-identical to every other page. Persists above the
     map; floating panels below are offset by --nav-h to clear it. ────────── */
  .nav { position: sticky; top: 0; z-index: 100; }
  .nav::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: rgba(var(--bg-rgb),0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(var(--line-rgb),0.08);
  }
  .nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 32px; min-height: var(--nav-h);
    display: flex; align-items: center; justify-content: space-between; }
  .nav-controls { display: flex; align-items: center; gap: 10px; }
  .brandmark { display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 19px;
    letter-spacing: -0.6px; color: var(--ink-site); }
  .nav-links { display: flex; gap: 6px; }
  .nav-link { padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 500;
    color: var(--ink-site); border: 1px solid transparent; transition: background .15s; }
  .nav-link:hover { background: rgba(var(--line-rgb),0.06); }
  .nav-link.active { background: var(--color-accent-turquoise); color: #07090C; }
  .nav-link.active:hover { background: var(--color-accent-turquoise); }
  :root[data-theme="light"] .nav-link.active { color: #FFFFFF; }
  .nav-burger { display: none; padding: 0; background: transparent; border: 1px solid rgba(var(--line-rgb),0.08);
    border-radius: 10px; width: 40px; height: 40px; cursor: pointer;
    align-items: center; justify-content: center; color: var(--ink-site); }
  .nav-burger svg { display: block; }
  .site-theme-toggle { display: inline-flex; align-items: center; justify-content: center;
    padding: 0; background: transparent; border: 1px solid rgba(var(--line-rgb),0.08);
    border-radius: 10px; width: 40px; height: 40px; cursor: pointer; color: var(--ink-site); }
  .site-theme-toggle svg { display: block; }
  .site-theme-toggle .icon-moon { display: none; }
  :root[data-theme="light"] .site-theme-toggle .icon-sun { display: none; }
  :root[data-theme="light"] .site-theme-toggle .icon-moon { display: block; }
  .nav-scrim { position: fixed; inset: 0; background: rgba(var(--bg-rgb),0.6);
    z-index: 150; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .nav-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(80vw, 320px);
    background: var(--surface); z-index: 151; padding: 20px 22px; display: flex; flex-direction: column;
    transform: translateX(calc(100% + 1px)); transition: transform .25s ease; }
  body.nav-open { overflow: hidden; }
  body.nav-open .nav-scrim { opacity: 1; pointer-events: auto; }
  body.nav-open .nav-drawer { transform: translateX(0); box-shadow: -20px 0 60px rgba(0,0,0,0.5); border-left: 1px solid rgba(var(--line-rgb),0.08); }
  .nav-drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .nav-drawer-head .label { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--ink-mute); }
  .nav-drawer-close { background: transparent; border: none; cursor: pointer; color: var(--ink-dim);
    font-size: 24px; line-height: 1; padding: 4px; }
  .nav-drawer-links { display: flex; flex-direction: column; gap: 4px; }
  .nav-drawer-link { padding: 14px 16px; border-radius: 12px; font-size: 18px; font-weight: 500;
    color: var(--ink-site); text-decoration: none; border: 1px solid transparent;
    display: flex; align-items: center; justify-content: space-between; }
  .nav-drawer-link:hover { background: rgba(var(--line-rgb),0.04); }
  .nav-drawer-link.active { color: var(--color-accent-turquoise);
    background: rgba(var(--color-accent-turquoise-rgb),0.14);
    border-color: rgba(var(--color-accent-turquoise-rgb),0.44); }
  .nav-drawer-link .arr { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-mute); }
  .nav-drawer-link.active .arr { color: var(--color-accent-turquoise); }
  .nav-drawer-foot { margin-top: auto; padding-top: 24px; border-top: 1px solid rgba(var(--line-rgb),0.08);
    font-size: 13.5px; color: var(--ink-mute); line-height: 1.6; }
  .nav-drawer-foot .mono { font-family: 'JetBrains Mono', monospace; }
  @media (max-width: 900px) {
    .nav-links { display: none; }
    .nav-burger { display: inline-flex; }
  }
  @media (max-width: 560px) {
    .nav-inner { padding: 0 20px; }
  }

  /* Sized/shaped to match .nav-link — the site's standard rounded pill button
     (8px/14px padding, 13.5px text) — text-only, no icons. Active = turquoise
     for whichever mode is on, matching the site accent (not the old
     magenta-for-Live/turquoise-for-Database split). */
  .header-tab { display: flex; align-items: center; padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--ink); }
  .header-tab.live-on, .header-tab.db-on, .header-tab.history-on { background: var(--t); color: #07090C; }
  /* LIGHT THEME: the ACTIVE pill's label goes white (2026-07-27). The rule
     above sets a near-black label, which is right on dark theme's bright
     #40E0D0 pill (contrast 12.14) but wrong on light theme's much darker
     #1A9E8F pill, where near-black on dark teal is what was reported as "the
     tab labels render black". This is not a new treatment — .nav-link.active,
     the site-standard pill this control was explicitly built to match, has
     carried exactly this override since it was written; .header-tab simply
     copied the dark-theme rule and never got the light-theme sibling.
     INACTIVE tabs were already correct and are untouched: they use var(--ink),
     the same token .ghost-btn uses, so they already match the buttons beside
     them in both themes. */
  :root[data-theme="light"] .header-tab.live-on,
  :root[data-theme="light"] .header-tab.db-on,
  :root[data-theme="light"] .header-tab.history-on { color: #FFFFFF; }
  /* …and the INACTIVE labels, which is what "the tab labels render black"
     was actually about (2026-07-27, second attempt). The rule above works —
     verified by resolving the cascade rather than by eye: light+active wins at
     specificity 0,4,0 against the 0,2,0 base rule and resolves to #FFFFFF.
     But only ONE tab is active at a time; the other two fall through to
     .header-tab's own `color: var(--ink)`, which in light theme is #444444 —
     9.74:1 against the near-white sidebar, i.e. black-looking body text. Dark
     theme's equivalent is #9AA4B2 at 7.45:1, which reads as genuinely dimmed.
     So the two themes were not giving the same treatment at all.
     #6B7687 sits at 4.60:1 — unmistakably secondary next to the active pill,
     still above the 4.5 AA floor for 13.5px text.
     SCOPED TO THE TABS ON PURPOSE: --ink is shared by .ghost-btn and
     .sb-search-mode-tab in the same header, and those are 14px icons and
     uppercase 14px labels respectively, where the same hex does not read the
     same way. Widening this to the token is a design call, flagged for Aaron
     rather than taken here. */
  :root[data-theme="light"] .header-tab { color: #6B7687; }
  /* First-ever switch into History mode does a real one-time synchronous
     batch of map.addSource/addLayer calls (ensureHistoryLayers(), guarded by
     historyLayersEverAdded) — a few hundred ms on a slow device, unavoidable
     since MapLibre has to compile those layers regardless. This spinner is
     purely so that cost READS as "loading", not "frozen" — the click handler
     (tabHistory listener) adds .tab-loading synchronously, then defers the
     actual heavy call two rAFs later so the browser gets a real paint of this
     state first. currentColor, not a fixed hex, so it inherits whichever of
     the active/inactive text colors above is in play — the tab is already
     turquoise/history-on by the time this shows (setMode() flips that class
     before doing any of the heavy work), so in practice this only ever draws
     against the active-tab colors, but currentColor keeps it correct either
     way without a second rule. Reuses db-refresh-btn's own spin keyframe
     rather than declaring a second identical @keyframes rule. */
  .header-tab.tab-loading { padding-right: 24px; position: relative; }
  .header-tab.tab-loading::after { content: ''; position: absolute; right: 10px; top: 50%;
    width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%;
    border: 1.5px solid currentColor; border-top-color: transparent; opacity: 0.75;
    animation: db-refresh-spin 0.6s linear infinite; }
  /* Predecessor/successor chip with no content record behind it — rendered
     visibly disabled rather than suppressed, so a real historical relationship
     ("the LMS succeeded the Caledonian Railway") still shows even before that
     company has an entry. Suppressing it would hide a fact; this only hides
     the link. */
  .filter-chip.is-disabled { opacity: 0.45; cursor: default; border-style: dashed; }
  /* Honest labelling for inferred/unknown dates — deliberately quiet, but
     always present when the underlying precision is not "exact". */
  /* Horizontal padding matches .db-field's 16px so this lines up with the
     field labels it sits between, rather than against the sidebar edge — the
     same misalignment reported against the History station panel's SOURCE
     link (which was missing its .db-field wrapper). Only History uses this
     class, on the station and route panels; both were affected. */
  .db-precision-note { font-size: 13px; line-height: 1.5; color: var(--ink); opacity: 0.85; margin: 6px 0 0; padding: 0 16px; }

  /* ── "Jump to" bar + zoom/layers/location cluster ────────────────────────
     Independent floating siblings now (not nested — see the HTML comment).
     top is set here as a sane default/fallback; positionFloatingClusters()
     in JS overrides both with the *actual* measured position (region-jump
     right below the sidebar's real rendered height — which varies with
     content — and control-cluster right below region-jump's real height),
     recomputed live via ResizeObserver. A fixed CSS offset can't track a
     variable-height sidebar, which is why this used to drift out of place
     whenever the sidebar was shorter than its 35vh max. ─────────────────── */
  /* region-jump (outer) is a plain, non-scrolling positioned card — it just
     holds the fade overlays. #rj-scroll (inner) is the actual horizontally-
     scrolling flex row. Splitting them is what keeps the fade pinned to the
     edges instead of scrolling away with the chips (see the HTML comment).
     Padding used to live on #region-jump itself, wrapping the label AND the
     fade — that inset the fade 12px from the box's true edge, so it read as
     "floating" rather than flush with the rounded corner. Padding now lives
     on the two children instead (the label's own left inset, #rj-scroll's
     own right inset), so .scroll-fade spans edge-to-edge and its fade sits
     flush against the true left/right edge of the pill, while the chip
     content still gets breathing room via #rj-scroll's own padding. */
  /* overflow:hidden (matches #sidebar's own rounded box, which doesn't have
     this rough-edge problem) — without it, the fade's rectangular corners
     aren't clipped to the pill's border-radius curve, so they poke past it
     at the top-left/bottom-left, reading as a jagged edge instead of a
     smooth rounded corner. */
  #region-jump { position: absolute; top: calc(var(--nav-h) + 10px); left: 10px; z-index: 55;
    display: flex; align-items: center; padding: 8px 0; max-width: calc(100vw - 20px);
    background: var(--sf); border: 0.5px solid var(--brh); border-radius: 16px; overflow: hidden;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  /* flex:1 + min-width:0 is what actually lets #rj-scroll's overflow-x kick
     in here — without min-width:0, a flex item defaults to not shrinking
     below its content's intrinsic width, so it would just keep growing the
     whole bar instead of scrolling. */
  #region-jump .scroll-fade { flex: 1; min-width: 0; }
  /* Half the shared .scroll-fade width (16px) — scoped to just this bar so
     the sidebar's filter-row fade, which wasn't part of this complaint,
     stays as-is. Each fade edge also starts hidden (opacity:0) and is only
     switched on by wireScrollFade() in JS when there's actually something
     to scroll to in that direction — at rest (scrollLeft 0) there's nothing
     to the left of "All UK", so unconditionally showing the left fade there
     was what made it look like a hard seam cutting into that chip, not a
     positioning issue. */
  #region-jump .scroll-fade::before, #region-jump .scroll-fade::after { width: 8px; }
  .scroll-fade::before { opacity: 0; transition: opacity 0.15s ease; }
  .scroll-fade.show-fade-left::before { opacity: 1; }
  .scroll-fade::after { opacity: 0; transition: opacity 0.15s ease; }
  .scroll-fade.show-fade-right::after { opacity: 1; }
  /* Left/right padding both raised from 14px to 21px (+50%) — same amount
     added to each side, so the extra breathing room stays symmetric. */
  #rj-scroll { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 21px 0 0; }
  #rj-scroll::-webkit-scrollbar { display: none; }
  #region-jump .rj-label { font-family: var(--font-body); font-size: 16px; font-weight: 500; color: var(--ink-mute); padding: 0 0 0 21px; margin-right: 14px; flex-shrink: 0; }
  /* Used to be Live-only (display:none in Database mode) — 2026-07-22
     request extends it to Database too, jumping straight to a city's
     detailed network rather than only working from the whole-UK Live view.
     No layout conflict to guard against: Database mode's own extra chrome
     (the history slider + legend) is bottom-anchored, and the sidebar this
     bar sits beside on desktop is present in both modes already. */

  #control-cluster { position: absolute; top: calc(var(--nav-h) + 10px); left: 10px; z-index: 55; }
  .map-controls { display: flex; flex-direction: column; gap: 3px; }

  @media (min-width: 769px) {
    #region-jump { left: var(--sidebar-edge); max-width: calc(100vw - var(--sidebar-edge) - 20px); }
    #control-cluster { left: var(--sidebar-edge); }
  }
  /* Tablet/mobile: region-jump spans edge-to-edge like the sidebar above it
     (JS sets its top to sit right below the sidebar, with a gap); the icon
     cluster stays a compact, inset-left column below *that*. */
  @media (max-width: 768px) {
    #region-jump { left: 10px; right: 10px; max-width: none; }
  }

  /* ── Mode capsule (tablet/mobile only) ────────────────────────────────────
     Floating home for the same .sb-top-tabs buttons the desktop sidebar
     uses (relocateModeTabs() moves the real DOM node in here — no separate
     copy, so active/inactive state and setMode()/URL logic can't drift out
     of sync). Boxless (2026-08-07) — the shared background/border/blur card
     was dropped, since each tab already carries its own active-state pill
     background (.header-tab.db-on etc, var(--t)) — but that left the
     INACTIVE labels with nothing behind them at all, floating directly over
     the map with only a text-shadow for legibility, which read as unreadable
     against busy map tiles. Fixed (later the same day) by giving each
     INACTIVE tab its own solid pill background instead — same var(--sf)
     surface the removed shared card used, just scoped PER-BUTTON rather than
     one container behind all three, so a narrow single-tab viewport doesn't
     imply the other two are part of one connected shape. The scroll-FADE
     overlay stays dropped regardless: the gaps between pills are still
     transparent map, not a continuous surface, so a fade-to-var(--sf) at the
     scroll edges still has nothing to fade into. */
  #mode-capsule { display: none; position: absolute; left: 10px; right: 10px; z-index: 55; }
  #mode-capsule-scroll { display: flex; align-items: center; justify-content: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  #mode-capsule-scroll::-webkit-scrollbar { display: none; }
  #mode-capsule-scroll .header-tab:not(.db-on):not(.live-on):not(.history-on) {
    background: var(--sf); border: 0.5px solid var(--brh);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    /* Kept alongside the new background, not superseded by it — var(--sf) is
       rgba(14,18,24,0.96), not fully opaque, so the shadow is still doing
       real work against a bright basemap showing faintly through. */
    text-shadow: 0 1px 3px rgba(0,0,0,0.65);
  }
  @media (max-width: 768px) {
    /* left widened from 10px to clear #control-cluster (now top-aligned
       beside it instead of stacked below, per the mockup — see
       positionFloatingClusters()'s own comment) — 26px icon width + 10px
       base inset + a gap, so the tab row never starts underneath the icon
       column. */
    #mode-capsule { display: block; left: 46px; }
  }
  /* Mobile/tablet-portrait only: #mode-capsule and #control-cluster both need
     z-index ABOVE #sidebar's (70), not below it (55, their shared desktop
     default) — #sidebar is a tall bottom sheet here (up to 88vh at its
     'full' state, see SHEET_PCT), and its top edge can rise higher on screen
     than these two, so the sheet painted OVER them once it got tall enough,
     covering the mode tabs and making them untappable. Same class of bug as
     .icon-btn's hover tooltip (2026-07-21 comment on that rule).
     2026-08-07 RECURRENCE, root-caused by loading the live site directly and
     reading its rendered CSS: a same-specificity single-ID selector was
     placed HERE once before too, but as one combined rule
     `#mode-capsule, #control-cluster { z-index: 80; }` positioned BETWEEN the
     two base rules above — after #control-cluster's (so it won, correctly),
     but BEFORE #mode-capsule's own base rule (so the base rule's z-index:55,
     coming later, won instead). Confirmed live: getComputedStyle showed
     #control-cluster at 80 and #mode-capsule stuck at 55, on the SAME page
     load — not a stacking-context or viewport issue, a plain cascade-order
     mistake that happened to fix one of the two elements and silently leave
     the other broken. Fixed by moving this rule to after BOTH base rules
     (mode-capsule's is the later of the two) instead of between them, so it
     can never again depend on which element's base rule happens to sit where. */
  @media (max-width: 768px) {
    #mode-capsule, #control-cluster { z-index: 80; }
  }

  /* ── Map control consolidation (tablet/mobile only) ───────────────────────
     Desktop keeps all 7 buttons in their original DOM order and none of this
     applies — #controls-more-btn stays display:none there so nothing about
     the desktop stack changes. On mobile, zoom/layers/labels/heritage default
     hidden behind the toggle. Visual order (2026-08-07) is CSS `order` only,
     scoped to this media query — DOM order is untouched so desktop's own
     rendering (which ignores `order` here entirely, since this block never
     applies there) can't drift from it. my-location/reset-bearing first,
     controls-more-btn last regardless of expanded state — the show/hide
     rules just below key off #control-cluster.expanded + each button's own
     id, nothing positional, so reordering doesn't touch that logic at all. */
  #controls-more-btn { display: none; }
  @media (max-width: 768px) {
    #controls-more-btn { display: inline-flex; }
    #zoom-in, #zoom-out, #layers-btn, #labels-btn, #heritage-btn { display: none; }
    #control-cluster.expanded #zoom-in,
    #control-cluster.expanded #zoom-out,
    #control-cluster.expanded #layers-btn,
    #control-cluster.expanded #labels-btn,
    #control-cluster.expanded #heritage-btn { display: inline-flex; }
    #my-location { order: 1; }
    #reset-bearing { order: 2; }
    #zoom-in { order: 3; }
    #zoom-out { order: 4; }
    #layers-btn { order: 5; }
    #labels-btn { order: 6; }
    #heritage-btn { order: 7; }
    #controls-more-btn { order: 8; }
  }

  /* ── Cookie consent (compact) ─────────────────────────────────── */
  #cookie-consent { position: absolute; bottom: 10px; z-index: 90; width: min(280px, calc(100vw - 20px));
    left: 10px; padding: 12px; display: none; border-radius: 16px; }
  @media (min-width: 769px) { #cookie-consent { left: var(--sidebar-edge); } }
  #cookie-consent.open { display: block; }
  #cookie-consent p { font-size: 12px; line-height: 1.5; color: var(--ink); margin-bottom: 8px; }
  #cookie-consent .cc-row { display: flex; gap: 6px; }
  #cookie-consent button { font-size: 11px; padding: 5px 10px; border-radius: 6px; }
  #cookie-consent .cc-accept { background: var(--t); color: #07090C; font-weight: 600; }
  #cookie-consent .cc-reject { border: 0.5px solid var(--brh); color: var(--ink); }

  /* #mobile-search / the floating #search-pill that replaced it are both gone
     (2026-08-07) — the sidebar's own #sb-search-panel is now shown by default
     whenever nothing is selected (see renderSelectionChrome()), on mobile and
     desktop alike, so a dedicated "tap to reveal search" affordance has
     nothing left to do. #region-jump stays hidden on mobile regardless —
     mode-capsule takes its slot at this breakpoint, unrelated to search. */
  @media (max-width: 768px) {
    #region-jump { display: none; }
  }

  /* ── Sidebar (desktop) / bottom sheet (tablet+mobile) ────────────────────
     Persistent, non-modal — the map stays interactive alongside it. Always
     rendered (never fully hidden): default state is the live-news feed with
     the "All" filter, so the top chrome (mode tabs, search, theme toggle) and
     the bottom attribution strip are always reachable. ──────────────────── */
  #sidebar { position: absolute; z-index: 70; background: var(--sf); border: 0.5px solid var(--brh);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; flex-direction: column; overflow: hidden; }

  /* Floats with a gap on every side now (was flush against the viewport/nav
     edges) — matches the "Sidbar sample" reference. top uses the same
     calc(var(--nav-h) + var(--sidebar-gap)) formula #region-jump/
     #control-cluster already use, so their top edges line up automatically;
     --sidebar-edge (used by anything positioned "beside the sidebar") was
     widened by one more --sidebar-gap to account for this box's own left
     inset. Static position/behavior unchanged — spacing only. */
  @media (min-width: 769px) {
    #sidebar { top: calc(var(--nav-h) + var(--sidebar-gap)); left: var(--sidebar-gap); bottom: var(--sidebar-gap);
      width: var(--sidebar-w); border-radius: 16px; }
  }
  /* Bottom-anchored draggable sheet (2026-08-06) — implements the mobile
     layout CLAUDE.md always specified ("bottom sheet pinned to bottom of
     screen") but the code never actually built; the old rule below was a
     top-anchored, capped-height card instead. Edge-to-edge (no side gap,
     unlike the desktop column) with only the top corners rounded, matching
     the native bottom-sheet convention the drag handle/snap-states below
     imply. 45vh below is just the pre-JS/no-script fallback (matches the
     'half' state, see SHEET_PCT) — setSheetState() sets inline style.height
     as a JS-computed PIXEL value once JS runs (2026-08-07 — was 'vh' before,
     see setSheetState()'s own comment for why that was a real bug, not just
     a style preference), which wins over this either way. .sheet-dragging
     drops the transition during an active pointer drag so it tracks 1:1
     with no lag, re-enabled the moment the drag ends so a snap settles
     smoothly. */
  @media (max-width: 768px) {
    #sidebar { top: auto; bottom: 0; left: 0; right: 0;
      height: 45vh; max-height: 90vh; min-height: 10vh;
      border-radius: 16px 16px 0 0;
      transition: height 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
    #sidebar.sheet-dragging { transition: none; }
  }

  /* 2026-08-07: dropped the dedicated expand/collapse chevron (#sb-min-btn)
     that used to sit in this row — researched against Apple Maps/Google
     Maps' own bottom-sheet convention (NN/g's bottom-sheet guidelines and
     several iOS/Android implementation write-ups agree: a single grab handle
     is the whole affordance, doing double duty as the drag target AND the
     tap-to-cycle target; neither ships a second dedicated button next to it).
     wireSheet() already listens on the whole ROW, not just the thin bar
     (see its own comment), so a plain tap anywhere in this row still cycles
     sheet state exactly as the old button did — nothing was lost, just the
     redundant second target. This row is also now home to the back/forward/
     saved/search icons, reparented in from .sb-top-actions on mobile only
     (see relocateSheetTopActions()) — back/forward flow first, then the
     handle (centred via margin:auto on .sb-handle itself, not
     justify-content, so it stays visually centred regardless of how wide
     the two icon groups either side of it are), then saved/search. */
  .sb-handle-row { display: none; align-items: center; position: relative; padding: 8px 12px 4px; flex-shrink: 0; gap: 6px; touch-action: none; }
  @media (max-width: 768px) {
    /* min-height 44px (2026-08-07) — standard minimum touch-target size;
       the visible bar (.sb-handle) stays its original thin 2.5px, just
       centred in a taller invisible hit area. wireSheet() already listens
       on this whole row rather than just the thin bar, so this is purely
       about giving a touch somewhere to land, not a JS change. */
    .sb-handle-row { display: flex; min-height: 44px; }
  }
  .sb-handle { width: 28px; height: 2.5px; border-radius: 2px; background: rgba(154,164,178,0.3); margin: 0 auto; }

  /* Peek state (2026-08-06) — station name + short teaser only; everything
     else in the sheet (utility row, selection chrome, full content, footer
     attribution) hides until the sheet is dragged/tapped up to half or full.
     !important matches this file's existing convention for a state that must
     win regardless of another display rule's own specificity/source order
     (see body:not(.mode-database) #sb-mode-operator above) — .sb-selection
     and .hist-slider both already carry their own conditional display rules
     this needs to override unconditionally. */
  #sb-peek-summary { display: none; flex-direction: column; gap: 2px; padding: 0 16px 14px; flex-shrink: 0; }
  #sb-peek-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.3px; color: var(--ink-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sb-peek-teaser { font-family: var(--font-body); font-size: 13px; color: var(--ink); line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 768px) {
    /* #sb-search-btn used to be hidden here (redundant with #search-pill,
       which delegated to its click handler). The pill's gone (2026-08-07,
       see #region-jump's own comment) and the search panel is open by
       default whenever nothing's selected — but this icon is still the only
       way to reopen search WHILE something is selected (the panel auto-
       closes on selection, see renderSelectionChrome()), on mobile same as
       desktop, so it stays visible rather than silently losing that path. */
    #sidebar[data-sheet-state="peek"] .sb-top,
    #sidebar[data-sheet-state="peek"] .sb-hist-slider,
    #sidebar[data-sheet-state="peek"] .sb-selection,
    #sidebar[data-sheet-state="peek"] #sb-body,
    #sidebar[data-sheet-state="peek"] #sb-attribution { display: none !important; }
    #sidebar[data-sheet-state="peek"] #sb-peek-summary { display: flex; }
    /* 2026-08-07: with nothing selected, peek used to show just a redundant
       "Database"/"Live updates"/"History" title — redundant because the
       mode-capsule tabs floating above the sheet already say which mode is
       active. Per the mockup, show the search panel there instead (the ONLY
       thing left in .sb-top on mobile — .sb-top-upper is display:none there
       now, see its own rule, since both the mode-tabs and the back/forward/
       saved/search row that used to live in it are relocated elsewhere on
       mobile), same as at half/full height. #sb-peek-summary's title+teaser
       stays exactly as before for an ACTUAL selection — still useful there,
       this only touches the empty/resting case. */
    #sidebar[data-sheet-state="peek"]:not(.has-selection) .sb-top { display: block !important; }
    #sidebar[data-sheet-state="peek"]:not(.has-selection) #sb-peek-summary { display: none !important; }
  }

  .sb-top { flex-shrink: 0; border-bottom: 0.5px solid var(--br); }
  .sb-top-upper { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; gap: 6px; }
  .sb-top-tabs { display: flex; gap: 4px; }
  .sb-top-actions { display: flex; align-items: center; gap: 6px; }
  .sb-top-lower { padding: 0 16px 14px; }
  @media (max-width: 768px) {
    /* Same touch-action:none .sb-handle-row already carries (2026-08-07) —
       wireSheet() now listens for a press-and-drag on this whole header too
       (see its own comment), and without this a touch drag starting here
       would fight the browser's native scroll/pan gesture recognition
       instead of driving the sheet. Restored to normal on the actual text
       fields immediately below, since a blanket touch-action:none on an
       ancestor can suppress a descendant's own text-selection/cursor
       touch handling unless it opts back in explicitly. */
    .sb-top { touch-action: none; }
    .sb-search-field { touch-action: manipulation; }
    /* Both of .sb-top-upper's children are relocated away from it on mobile
       now — .sb-top-tabs into #mode-capsule (relocateModeTabs()) and
       .sb-top-actions's back/forward/saved/search into #sb-handle-row
       (relocateSheetTopActions()) — so on mobile this row is always empty.
       Left in flow it would just be dead padding between the handle row and
       the search panel; hidden here rather than left to render nothing. */
    .sb-top-upper { display: none; }
  }
  /* Search panel — hidden until the search icon is tapped. Tab toggle is
     mono/uppercase text (no pill background), matching Search_bar.png rather
     than the filter-chip pill style used elsewhere. */
  .sb-search-panel { display: none; margin-top: 10px; }
  .sb-search-panel.open { display: block; }
  .sb-search-modes { display: flex; align-items: center; gap: 20px; padding-bottom: 12px; }
  .sb-search-mode-tab { font-family: var(--font-body); font-size: 14px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; color: var(--ink); }
  /* Operator search only makes sense in Database mode (2026-07-21 bugfix) —
     an operator has no live/departures-style data of its own, and
     setMode()'s own dbOnly logic already treats an operator selection as
     Database-only. Hidden here rather than removed outright so it stays
     reachable where it's actually meaningful — see submitOperatorPick()'s
     mode guard for the other half of this fix (stops the selection from
     ever being created while Live, not just hides the button). */
  body:not(.mode-database) #sb-mode-operator, body:not(.mode-database) #sb-operator-field-wrap { display: none !important; }
  /* Destination (From/To) has no valid behaviour in History mode — there is
     no historical routing/pathfinding, only the live one, and this hides it
     rather than leaving it to silently render live departure-board/news
     chrome inside the History tab (a confirmed, separate bug from the
     Station tab's — not fixed here, this only removes the way in). Same
     pattern as the Operator-tab rule directly above: hidden, not removed,
     so it's reachable again the instant mode changes. setSearchMode()'s own
     Live-mode reset (search for "mode === 'live' && searchMode ===
     'operator'") has no History equivalent yet — if History is ever reached
     with 'fromto' as the active searchMode (e.g. via a restored URL/back-
     button rather than a tab click), the tab and its fields are hidden here
     but searchMode itself stays 'fromto' until something else changes it;
     not observed to cause a visible problem in testing, flagging rather
     than adding an unrequested reset for a path that may not be reachable
     in practice. */
  body.mode-history #sb-mode-fromto, body.mode-history #sb-fromto-row { display: none !important; }
  /* Explicit close for the search panel itself (2026-07-21 feedback) — the
     search icon in .sb-top-actions already toggles it open/closed, but a
     dedicated X on the mode-tabs row (far right, same treatment as
     #sb-clear-btn's ×) is a clearer, more discoverable "I'm done searching"
     affordance than expecting a user to re-find/re-click the same magnifying
     glass icon they used to open it. margin-left:auto pins it to the far
     right without disturbing the three tabs' own left-aligned flow. */
  #sb-search-close-btn { margin-left: auto; font-size: 20px; line-height: 1; padding: 2px 4px; }
  .sb-search-mode-tab.active { color: var(--t); }

  /* Rounded field + its autocomplete dropdown. Each field/dropdown pair sits
     in an .sb-ac-wrap so the dropdown can be positioned relative to just
     that input. */
  .sb-ac-wrap { position: relative; }
  .sb-ac-wrap + .sb-ac-wrap { margin-top: 10px; }
  .sb-search-field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 0.5px solid var(--brh);
    background: transparent; color: var(--ink-primary); font-size: 16px; }
  .sb-search-field::placeholder { color: var(--ink); }
  .sb-station-field { display: none; }
  .sb-station-field.open { display: block; }
  .sb-fromto-fields { display: none; flex-direction: column; }
  .sb-fromto-fields.open { display: flex; }

  .sb-ac-list { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5;
    max-height: 220px; overflow-y: auto; background: var(--sf); border: 0.5px solid var(--brh); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .sb-ac-list.open { display: block; }
  .sb-ac-list.dropup { top: auto; bottom: calc(100% + 4px); }
  .sb-ac-item { display: block; width: 100%; text-align: left; padding: 9px 14px; font-size: 15px; color: var(--ink-primary); }
  /* .active is the keyboard-highlighted suggestion (arrow keys) — mouse
     hover sets the exact same class via JS (see wireAutocomplete), so the
     two input methods always agree on one shared highlight rather than
     drifting out of sync with separate visual states. */
  .sb-ac-item.active, .sb-ac-item:hover { background: rgba(64,224,208,0.08); color: var(--t); }
  /* Muted second line inside a suggestion (heritage "No map location data").
     Block so it wraps under the name rather than widening the dropdown, and
     kept at var(--ink) so it reads as secondary even while the row is
     highlighted — the .active rule above recolours the row's own text, and an
     inheriting note would go turquoise with it and stop looking like a caveat. */
  .sb-ac-note { display: block; margin-top: 2px; font-size: 12px; color: var(--ink); }

  /* Selected station/route/network row — star sits inline between the name
     and the close (×) icon, replacing the old separate "Saved routes" list.
     Name size matches database.html's category section headers exactly
     (Archivo 20px/600/-0.5px — e.g. "Intercity & High Speed"). */
  .sb-selection { display: none; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 0.5px solid var(--br); flex-shrink: 0; }
  #sidebar.has-selection .sb-selection { display: flex; }
  .sb-selection-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  /* HISTORY MODE title — per the approved mockup this is a large heading that
     WRAPS (e.g. "Great Western Railway (Legacy)" over two lines) rather than the
     single-line ellipsised title the other tabs use, and the row top-aligns so
     the share/close buttons sit against the first line. Scoped to
     body.mode-history so Live and Database keep their existing treatment
     exactly. */
  body.mode-history .sb-selection { align-items: flex-start; padding-top: 18px; }
  /* SIZE NO LONGER OVERRIDDEN (2026-08-04). This carried font-size: 30px and
     letter-spacing: -0.8px against the base rule's 20px, so the same station
     read as a far larger heading in History than in Database — reported as
     inconsistent between tabs. Both now inherit the one size from
     .sb-selection-title above, which also means any future change to it moves
     all three tabs together instead of two.
     The WRAPPING behaviour is kept: History titles are often long company names
     ("Great Western Railway (Legacy)") that must not ellipsise. */
  body.mode-history .sb-selection-title { white-space: normal; overflow: visible; text-overflow: clip;
    line-height: 1.2; color: var(--ink-primary); }

  #sb-star-btn.starred { color: var(--a); }
  #sb-star-btn.starred i::before { content: "\f6a6"; } /* ti-star-filled — was "\ea78", which renders as ⌘ in this webfont */
  #sb-saved-toggle[aria-pressed="true"] i::before { content: "\f6a6"; }
  #sb-clear-btn { font-size: 20px; line-height: 1; padding: 2px 4px; }
  /* Brief "copied" confirmation flash on the share button (clipboard-copy
     fallback path only — the native share-sheet path has its own OS-level
     confirmation, this is never shown there). */
  #sb-share-btn.copied { color: var(--t); }

  /* overflow-x is explicit (not left as default "visible") on purpose: per
     the CSS overflow spec, an element with overflow-y set but overflow-x left
     as "visible" has its overflow-x computed as "auto" too — silently making
     this element itself a second, competing horizontal scroll container that
     can swallow the gesture before it ever reaches the nested .filter-row's
     own overflow-x:auto. That's almost certainly why the filter chips
     wouldn't scroll no matter what was tried on .filter-row itself. */
  #sb-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

  /* Departure format matches departures.html's table exactly: mono time/platform,
     14px body cells, plain-colour status text (no pill background), 11px
     uppercase mono column labels, alternating row background (var(--surface2),
     same token/value departures.html's .dep-table uses). */
  #sb-dep-board { display: none; border-bottom: 0.5px solid var(--br); padding: 12px 16px 14px; }
  /* Station/route name used to repeat here as .db-station — already shown
     right above in .sb-selection-title, so it was a plain duplicate. Removed
     in favour of a refresh icon in the same spot (force-refetches the board
     without re-triggering the selection/fade cycle — see
     refreshDepartureBoard()). */
  #sb-dep-board .db-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  /* Unscoped (was #sb-dep-board .db-label) so Database-mode content below can
     reuse the exact same mono/uppercase/grey section-label style instead of
     duplicating it under a new class name. Grey, not turquoise — turquoise
     is reserved for actual links (Google Map, Wikipedia source, etc). */
  .db-label { font-family: var(--font-mono); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink); }
  .db-refresh-btn { flex-shrink: 0; font-size: 15px; }
  .db-refresh-btn.spinning i { display: inline-block; animation: db-refresh-spin 0.6s linear infinite; }
  @keyframes db-refresh-spin { to { transform: rotate(360deg); } }

  /* ── Database-mode content (Task 3) ───────────────────────────────────────
     Reuses existing conventions throughout: .db-label above, .filter-chip
     for services/fleet chips, .sv-item/.sv-name/.sv-empty (already used for
     saved stations) for the stopping-stations and browse lists, and the
     same data-anim-row stagger every other sidebar view already uses. */
  .db-field { padding: 10px 16px; }
  .db-field .db-label { margin-bottom: 4px; }
  .db-value { font-size: 15px; color: var(--ink-primary); line-height: 1.5; }
  /* Managed by/Platforms/Station code/Year opened — always exactly these
     four, in this order, 2-per-row (row 1: Managed by, Platforms; row 2:
     Station code, Year opened), per the approved mockup. Each cell reuses
     the plain .db-field/.db-label/.db-value markup unchanged — only the
     grid wrapper is new — so they still pick up data-anim-row's stagger
     like every other field. */
  .db-field-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .db-photo { padding: 10px 16px; }
  .db-photo .db-label { margin-bottom: 4px; }
  /* .db-photo-frame mirrors database.html's TrainImage() component exactly
     (2026-07-17 — "check the locomotive no-image-available pattern first")
     — same border-radius/aspect-ratio/border/gradient-tint container, so a
     station panel and a rolling-stock card read as the same design system
     rather than two different photo treatments. */
  .db-photo-frame { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16/10;
    border: 1px solid rgba(var(--line-rgb),0.08);
    background: linear-gradient(135deg, rgba(var(--color-accent-turquoise-rgb),0.06), rgba(var(--line-rgb),0.02)); }
  .db-photo-frame img { width: 100%; height: 100%; display: block; object-fit: cover; }
  /* "no image available" — ported verbatim from database.html's TrainImage()
     placeholder state: same ink-mute/mono/11px/letterspacing-2/uppercase
     text treatment, same 45°-diagonal-stripe background tint. Rolling stock
     uses a per-category accent color for the stripe tint; stations have no
     equivalent category concept, so this always uses the site's primary
     turquoise accent instead. */
  .db-photo-placeholder { display: flex; align-items: center; justify-content: center; height: 100%;
    color: var(--ink-mute); font-family: var(--font-mono); font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    background-image: repeating-linear-gradient(45deg, rgba(var(--color-accent-turquoise-rgb),0.06) 0 10px, transparent 10px 20px); }
  /* Exact-attribution format (2026-07-16 station panel rework) — never a
     generic "Image via Wikipedia" line (that pattern lives in database.html
     for the fleet spotlight and was deliberately NOT reused here): always
     "{photographer/uploader} – {source} – {license}", e.g. "Richard Kelly
     from Manchester, England – Flickr – CC BY 2.0". See dbPhotoCreditHtml()
     — the three parts are rendered separately, from stations-content.json's
     photo.photographer/photo.source/photo.license, never from one free-typed
     attribution string, so a curator can't accidentally type a vaguer line.
     Absent entirely (not "Not available") when there's no photo at all —
     the placeholder box above already communicates that, a second "no
     credit" line under it would be redundant chrome.
     2026-07-19: briefly tried overlaying this on the image itself
     (database.html's TrainImage() treatment) — reverted per feedback, read
     as messy at this sidebar's narrower width. Back to its own line below
     the frame, still inside .db-photo's own box (so the gap down to the
     NEXT field — Location — is governed by .db-photo's own 10px bottom
     padding + Location's 10px top padding, the same 20px every other
     field-to-field gap uses, regardless of this margin-top). No underline
     on the link either, per the same feedback. */
  .db-photo-credit { font-size: 13px; color: var(--ink); margin-top: 4px; }
  .db-photo-credit a { color: var(--ink); text-decoration: none; }
  /* Leftmost link (Google Map, or Official website for operators/routes) +
     Wikipedia now render paired on one row at the BOTTOM of the panel
     (2026-07-17, per the approved mockup — was Google Map alone near the
     top, a leftover pre-Phase-D position; see dbBottomLinksHtml()).
     .db-links stays the shared flex-row container for both. gap dropped
     2026-07-19 (16px -> 8px either side of the new .db-link-sep pipe) now
     that the pipe itself is a visible glyph providing separation, not just
     whitespace. */
  .db-links { display: flex; align-items: center; gap: 8px; }
  .db-links a { font-family: var(--font-mono); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--t); }
  /* The " | " between the two link-row entries (2026-07-19, per the
     approved mockup) — dimmed ink, not turquoise, so it reads as a
     separator rather than a third (non-functional) link. */
  .db-link-sep { font-family: var(--font-mono); font-size: 13px; color: var(--ink-mute); }
  .db-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  /* Scoped override, not a base .filter-chip change — region-jump and news
     filter chips elsewhere keep their grey default; only station/operator
     detail-panel chips (services, fleet, regions) go white per the color
     pass, since here they're content, not a filter control. */
  .db-chip-row .filter-chip { color: var(--ink-primary); }
  /* Non-linked variant — used only for the settlement-article case (see
     dbWikipediaAttributionHtml()'s sourceType check): the matched article is
     about the town/village the station sits in, not a dedicated station
     page, so this deliberately does NOT link out or imply one exists. Sits
     inline in the same .db-links row as a real link would (hence no
     display:block/padding of its own any more — the row's .db-field
     wrapper provides that) — muted ink instead of turquoise link color is
     what visually marks it as non-interactive. */
  .db-links .db-source-plain { font-family: var(--font-mono); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink); }
  .db-empty { padding: 16px; }
  .db-empty .db-label { margin-bottom: 8px; }
  .db-empty p { font-size: 15px; color: var(--ink); line-height: 1.5; }
  /* Punchy one-line headline (Wikipedia-sourced, 8-12 words) — bolder and
     more prominent than .db-value, but kept within the sidebar's existing
     13px scale rather than borrowing index.html's much larger
     .spot-headline display size, which is sized for full landing-page
     cards, not this compact panel. */
  .db-headline { padding: 10px 16px 4px; font-size: 15px; font-weight: 600; color: var(--ink-primary); line-height: 1.4; }
  /* No horizontal padding: this <ul> sits INSIDE .db-field, which already
     supplies the 16px gutter. Carrying its own 16px too pushed franchise names
     to 32px while every other field value sat at 16px, so the Franchises block
     read as indented relative to Parent company / Stations operated etc. */
  .db-franchise-list { padding: 2px 0 10px; margin: 0; list-style: none; }
  .db-franchise-list li { padding: 6px 0; }
  .db-franchise-list li:first-child { padding-top: 0; }
  .db-franchise-name { display: block; font-size: 15px; color: var(--ink-primary); font-weight: 500; }
  .db-franchise-dates { display: block; font-size: 13px; color: var(--ink); margin-top: 2px; }
  /* Notable-features list (2026-07-16) — was a single ";"-joined .db-value
     line, unreadable once a station has 7-12 facts (e.g. London Victoria).
     Bulleted list, same visual weight/pattern as .db-franchise-list. */
  .db-notable-list { padding: 2px 16px 10px; list-style: none; }
  .db-notable-list li { position: relative; padding: 4px 0 4px 14px; font-size: 15px; color: var(--ink-primary); line-height: 1.5; }
  .db-notable-list li::before { content: ''; position: absolute; left: 0; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: var(--t); }
  .db-hint { padding: 24px 20px; font-size: 15px; color: var(--ink); text-align: center; line-height: 1.6; }
  .dep-cols { display: flex; align-items: center; gap: 10px; padding: 6px 0 4px; font-family: var(--font-mono);
    font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink); border-bottom: 0.5px solid var(--br); }
  .dep-cols span:nth-child(1) { width: 52px; flex-shrink: 0; }
  .dep-cols span:nth-child(2) { flex: 1; }
  .dep-cols span:nth-child(3) { width: 50px; flex-shrink: 0; }
  .dep-cols span:nth-child(4) { width: 64px; flex-shrink: 0; }
  .dep-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; margin: 0 -4px; font-size: 16px; border-bottom: 0.5px solid rgba(64,224,208,0.06); }
  .dep-row:nth-child(even) { background: var(--surface2); }
  .dep-time { font-family: var(--font-mono); font-size: 16px; width: 52px; flex-shrink: 0; }
  .dep-dest { font-size: 16px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep-plat { font-family: var(--font-mono); width: 50px; flex-shrink: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep-status { font-size: 16px; width: 64px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep-status.on-time { color: var(--l); }
  .dep-status.delayed { color: var(--a); }
  .dep-status.cancelled { color: var(--m); }
  .dep-status.scheduled { color: var(--ink); }
  .dep-empty { font-size: 15px; color: var(--ink); padding: 6px 0; }
  /* ── Marquee (shared utility, see applyMarquee() in JS) ────────────────────
     Generalised from the departure board (2026-08-05) — same mechanism now
     used anywhere a station/route/operator name can overflow its container:
     the sidebar selection title, "stations along this path"/saved/stopping-
     station list rows, the selected-entity filter chip, and the departure
     board cells this started on. applyMarquee() only touches an element
     whose text actually overflows (measured post-render, scrollWidth vs
     clientWidth); an element that fits is left alone — plain ellipsis-
     truncated text, exactly as if this feature didn't exist for it.
     Two back-to-back copies of the text in .marquee-track, translated
     exactly -50% — since both copies are pixel-identical, -50% always lands
     the second copy exactly where the first started, so the loop can
     restart at 0% with no visible seam, regardless of how long the text is
     (no per-element distance to compute). transform-only animation, so this
     never triggers layout — the container's height/width are untouched,
     just like the ellipsis case it replaces.

     Hold-scroll-hold, not a continuous crawl: static at the start (so a
     reader who just glanced over actually gets to read it before it moves),
     then a linear scroll, then static once it's back at the visual start
     (the -50% point, which — same duplicate-copy trick — is pixel-identical
     to 0%) before looping. The hold/scroll split is a % of the total
     duration and that % depends on each element's own scroll distance,
     which @keyframes can't take from a CSS custom property (keyframe
     selectors must be static percentages) — so applyMarquee() writes a
     small, uniquely-named @keyframes rule per marqueeing element instead of
     reusing one shared one. --marquee-name/-duration are custom properties,
     not animation set directly inline, so the prefers-reduced-motion
     override below (same specificity, later in the stylesheet) still wins
     when it applies. */
  .marquee-el { text-overflow: clip; }
  .marquee-track {
    display: inline-flex; white-space: nowrap;
    animation-name: var(--marquee-name, marquee-scroll-fallback);
    animation-duration: var(--marquee-duration, 8s);
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .marquee-track .marquee-text { padding-right: 28px; }
  /* Only reached if a track's --marquee-name custom property is somehow
     unset — applyMarquee() always sets a real per-element rule, so this is
     a safety net, not the normal path. */
  @keyframes marquee-scroll-fallback { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* Readable, not a moving target: hovering (mouse) or focusing (keyboard —
     applyMarquee() gives a marqueeing element tabindex="0" precisely so
     this is reachable) freezes it in place. */
  .marquee-el:hover .marquee-track, .marquee-el:focus .marquee-track { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) {
    /* Belt-and-braces: applyMarquee() already checks this and skips building
       the marquee structure at all when it's set, leaving plain ellipsis-
       truncated text instead — this rule only matters if that check is ever
       bypassed (e.g. the media query changes after render). */
    .marquee-track { animation: none; }
  }
  body.mode-database #sb-dep-board { display: none !important; }

  /* Sticks the "Live updates" label + filters to the top of the scroll area so
     it stays visually separated from departure rows scrolling away above it.
     Styled like the other mono/uppercase section labels (db-label, saved-label). */
  .sb-sticky { position: sticky; top: 0; z-index: 2; background: var(--sf); }
  .sb-sticky-title-row { display: none; align-items: baseline; justify-content: space-between; padding: 12px 16px 0; }
  #sidebar.has-selection .sb-sticky-title-row { display: flex; }
  .sb-sticky-title { font-family: var(--font-mono); font-size: 13.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--t); }
  .sb-sticky-time { font-family: var(--font-mono); font-size: 13.5px; color: var(--ink); }
  /* No mask-image fade here (unlike an earlier version) — it's a known
     WebKit/Safari quirk that mask-image on an overflow:auto/scroll container
     can silently break its scrollability, which is exactly what was
     happening: #region-jump (no mask) scrolled fine, this row (masked)
     didn't, on both desktop and mobile Safari. */
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { font-size: 15px; padding: 6px 13px; border-radius: 99px; border: 0.5px solid var(--br); color: var(--ink); white-space: nowrap; flex-shrink: 0;
    transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease; }
  .filter-chip.active { background: rgba(64,224,208,0.1); border-color: var(--t); color: var(--t); }
  /* Hover fill (2026-07-19) — every chip built on this base class (region-
     jump map chips, Live Updates filter chips, the entity chip, Services
     chips, Main/Other Regions chips, fleet chips) fades in the same
     turquoise-wash "filled" look on hover that the entity chip's own .active
     state already uses (see the reference screenshot: the solid-looking
     "Manchester Piccadilly" chip on the Live Updates page) — smoothed by
     the transition above instead of an instant color snap. Deliberately on
     the shared base class rather than duplicated per chip type, so "any
     other similar clickable box chip" gets this for free too. */
  .filter-chip:hover { background: rgba(64,224,208,0.22); border-color: var(--t); color: var(--t); }
  /* Entity filter chip (selected station/route) — sits left of "All",
     permanently turquoise-tinted (not just on .active) so it reads as
     distinct from the plain region chips even when it isn't the active
     filter, per the "visually highlighted/distinct" requirement. No
     dedicated clear ("x") — redundant with the sidebar's own station/route
     header clear button, which already deselects the entity entirely. */
  .filter-chip-entity { font-weight: 600; max-width: 160px; overflow: hidden;
    text-overflow: ellipsis; background: rgba(64,224,208,0.14); border-color: var(--brh); color: var(--t); }
  .filter-chip-entity.active { background: rgba(64,224,208,0.22); border-color: var(--t); }

  /* Edge-fade hint for horizontally-scrollable rows — deliberately built as
     pointer-events:none overlay pseudo-elements, NOT mask-image, since
     mask-image is exactly what broke scrolling on this row before. These
     sit on top of the row only (each element scopes its own fade — nothing
     bleeds into the sidebar/card around it) and can never intercept a click
     or drag no matter how they're layered. */
  .scroll-fade { position: relative; }
  .scroll-fade::before, .scroll-fade::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 16px; z-index: 3; pointer-events: none; }
  .scroll-fade::before { left: 0; background: linear-gradient(to right, var(--sf), transparent); }
  .scroll-fade::after { right: 0; background: linear-gradient(to left, var(--sf), transparent); }

  .news-item { padding: 10px 16px; border-bottom: 0.5px solid rgba(64,224,208,0.06); display: flex; align-items: flex-start; gap: 8px; }
  .news-item.urgent { background: rgba(242,92,193,0.05); }
  .news-item i.news-icon { font-size: 17px; margin-top: 1px; flex-shrink: 0; }
  .news-item.urgent i.news-icon { color: var(--m); }
  .news-item:not(.urgent) i.news-icon { color: var(--t); }
  .news-title { font-size: 16px; line-height: 1.4; flex: 1; }
  .news-item.urgent .news-title { color: var(--ink-primary); }
  .news-item:not(.urgent) .news-title { color: #ccc; }
  :root[data-theme="light"] .news-item:not(.urgent) .news-title { color: #333333; }
  .news-meta { font-size: 13.5px; color: var(--ink); margin-top: 3px; display: flex; gap: 8px; align-items: center; }
  .news-link { color: var(--t); }
  .news-link:hover { text-decoration: underline; }
  .news-chevron { font-size: 15px; color: var(--ink); margin-top: 2px; flex-shrink: 0; }
  .news-empty { padding: 14px 16px; font-size: 15px; color: var(--ink); text-align: center; }

  .rebook-cta { display: none; padding: 10px 16px; background: rgba(242,92,193,0.07); font-size: 15px; color: var(--m); }
  .rebook-cta.show { display: block; }

  .sb-footer-inline { flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding: 10px 16px; font-size: 13.5px; color: var(--ink); }

  /* Saved-stations view — toggled via the star icon next to search, top of
     the sidebar; shows everything favorited via srhq_saved_routes. Reuses the
     same 14px/alternating-row convention as the departures table. */
  .sv-list { padding: 4px 0; }
  .sv-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 16px; border-bottom: 0.5px solid rgba(64,224,208,0.06); cursor: pointer; }
  .sv-item:nth-child(even) { background: var(--surface2); }
  .sv-item:hover { color: var(--t); }
  .sv-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sv-sub { font-size: 13.5px; color: var(--ink); flex-shrink: 0; }
  .sv-empty { padding: 16px; font-size: 15px; color: var(--ink); text-align: center; }

  /* Persistent bottom strip — copyright/data attribution, never scrolls away
     and never disappears (map-tile/data-source attribution requirement).
     Now expandable: collapsed shows MANDATORY credits, expanded adds COURTESY
     ones. Content is built at runtime from data/attribution.json. */
  #sb-attribution { flex-shrink: 0; border-top: 0.5px solid var(--br); font-size: 12px; color: var(--ink); text-align: left;
    position: relative; background: var(--sf); }
  /* Top-edge fade so sidebar content scrolls UNDER the bar rather than butting
     against it. Reuses the same gradient-overlay approach as .scroll-fade
     (a pseudo-element over the content, not mask-image on a scroll container —
     see .scroll-fade's own comment for the WebKit reason that matters). */
  #sb-attribution::before { content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 14px;
    background: linear-gradient(to top, var(--sf), transparent); pointer-events: none; }
  .sb-attrib-toggle { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    background: transparent; border: none; color: var(--ink); cursor: pointer; text-align: left;
    font-family: inherit; font-size: inherit; box-sizing: border-box; }
  .sb-attrib-summary { flex: 1; min-width: 0; line-height: 1.45; }
  .sb-attrib-chev { flex-shrink: 0; font-size: 13.5px; transition: transform 0.2s; }
  .sb-attrib-toggle[aria-expanded="true"] .sb-attrib-chev { transform: rotate(180deg); }
  /* Padding flipped with the DOM order — the body now sits ABOVE the toggle,
     so its breathing room belongs on top rather than underneath. */
  .sb-attrib-body { padding: 10px 16px 0; line-height: 1.5; max-height: 40vh; overflow-y: auto; }
  .sb-attrib-row { margin-bottom: 6px; }
  .sb-attrib-src { color: var(--ink-primary); }
  .sb-attrib-lic { color: var(--ink); }
  .sb-attrib-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink); }

  /* Universal "i" icon trigger, floating bottom-right corner (2026-08-07
     mobile-only; extended to desktop/tablet 2026-08-12, then made the
     floating-corner PLACEMENT itself universal too, same day, per direct
     request — was still a full-width bordered bar with the icon at its
     left edge on desktop until then). The button's CLICK behaviour still
     branches in JS on window.innerWidth (see wireAttributionBar()),
     completely independently of this display/position: narrow/portrait
     widths open #attrib-sheet (full-height takeover — there's no room for
     an inline expand without covering the content), desktop and horizontal
     tablet keep the inline expand, anchored under the icon, sized to
     content (max-height: 40vh, scrollable) rather than the full sidebar
     height.
     position:absolute pulls #sb-attribution out of #sidebar's flex column
     entirely, so #sb-body's flex:1 reclaims the vertical space the bar used
     to reserve, and the icon sits pinned over the content area's bottom-
     right corner instead of spanning the sidebar's full width. #sidebar
     (already position:absolute) is the containing block. right/bottom are
     deliberately the SAME value (4px) — equal distance to both edges, per
     direct request. No background/border of its own needed — #sidebar
     already has a solid var(--sf) surface behind it, unlike the mode-
     capsule tabs above which float directly over the map. The peek-state
     hide rule (#sidebar[data-sheet-state="peek"] #sb-attribution, mobile-
     only) still applies unchanged; display:none wins regardless of
     position. */
  .sb-attrib-summary, .sb-attrib-chev { display: none; }
  .sb-attrib-info-icon { display: block; font-size: 15px; }
  #sb-attribution { position: absolute; right: 4px; bottom: 4px; left: auto; top: auto;
    width: auto; border-top: none; background: transparent; z-index: 5; }
  #sb-attribution::before { content: none; } /* no longer a bar sitting below scrolling content — nothing to fade under */
  .sb-attrib-toggle { width: auto; padding: 10px; justify-content: center; }

  /* ── Attribution full-sheet (tablet/mobile only) ──────────────────────────
     Simple full-screen takeover — NOT the draggable sheet, no shared code
     with wireSheet(). z-index 200 is deliberately above everything else on
     the page including the site nav (z-index 100) — a "full-height slide-up
     panel" should cover the nav too, not sit under it. */
  #attrib-sheet { display: none; position: fixed; inset: 0; z-index: 200;
    background: var(--bg); flex-direction: column; }
  #attrib-sheet.open { display: flex; }
  .attrib-sheet-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    border-bottom: 0.5px solid var(--br); flex-shrink: 0; }
  .attrib-sheet-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--ink-primary); }
  .attrib-sheet-body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  /* #sb-attrib-body is reparented in here on open — its own CSS (max-height:
     40vh, meant for the small inline-expand case) would otherwise cap it
     inside a container that's supposed to use the full available height. */
  .attrib-sheet-body .sb-attrib-body { max-height: none; overflow-y: visible; padding: 12px 0 0; }

  /* ── History-mode year slider (two instances, one state) ────────────────
     Only the sidebar instance remains (#sb-history-slider); the map-canvas one
     was removed. .hist-slider is kept as the shared class so the styling stays
     where it is and a second placement could be reintroduced without a rewrite.
     Hidden unless body.mode-history, so nothing here leaks into Live or
     Database. */
  .hist-slider { display: none; }
  body.mode-history .hist-slider { display: block; }
  .sb-hist-slider { flex-shrink: 0; padding: 10px 16px 8px; border-bottom: 0.5px solid var(--br); }

  .hs-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  /* Same size as the Live / Database / History tab labels (13.5px), per direct
     feedback that the first draft's 28px read as oversized next to them. */
  /* REVERTED to 13.5px (2026-08-04). The site-wide font uplift took this to
     15px, which pushed "TODAY" past the 46px min-width and wrapped it onto a
     second line. This label sits in a fixed-width slot next to the Jump-to
     field, so it is one of the few places where bigger is worse — excluded from
     the uplift deliberately rather than by oversight. */
  .hs-year { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; letter-spacing: 0;
    color: var(--t); flex-shrink: 0; min-width: 46px; }
  .hs-jump-wrap { position: relative; margin-left: auto; }
  .hs-jump { width: 92px; padding: 5px 22px 5px 9px; border-radius: 8px; border: 0.5px solid var(--br);
    background: var(--bg); color: var(--ink-primary);
    /* 13px, NOT the 15px body size. The uplift took this 11 -> 13, then 13 -> 15
       on the theory that an input should not read smaller than the prose beside
       it — but at 15px the field visibly outweighs the "Jump to" row it sits in,
       so it went back to 13. It holds a 4-digit year in a 92px box; it does not
       need to match prose. */
    font-family: inherit; font-size: 13px; box-sizing: border-box; }
  .hs-jump:focus { outline: none; border-color: var(--brh); }
  .hs-jump.invalid { border-color: var(--m); }

  /* Track. .hs-span is the ACTIVE SPAN INDICATOR — a band showing the open
     entity's map-coverage range. Purely visual: it never gates the range
     input's own min/max, so dragging and jumping outside it stay unrestricted. */
  .hs-track-wrap { position: relative; }
  .hs-span { position: absolute; top: 7.5px; height: 3px; border-radius: 2px;
    background: rgba(64,224,208,0.28); pointer-events: none; }
  .hs-range { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent;
    cursor: pointer; --fill: 100%; margin: 0; position: relative; }
  .hs-range::-webkit-slider-runnable-track { height: 3px; border-radius: 2px;
    background: linear-gradient(to right, var(--t) var(--fill), var(--br) var(--fill)); }
  .hs-range::-moz-range-track { height: 3px; border-radius: 2px; background: var(--br); }
  .hs-range::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--t); }
  .hs-range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--t); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--t); margin-top: -6.5px; cursor: pointer; }
  .hs-range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
    background: var(--t); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--t); cursor: pointer; }

  /* Ticks are absolutely positioned by percentage so they line up with the
     track rather than being evenly spaced. The first and last sit ON the track
     ends, where a centred label would clip outside the box — see
     .hs-tick.edge-first/.edge-last for the anchoring fix. */
  .hs-ticks { position: relative; height: 19px; margin-top: 4px; transition: height 0.15s ease; }
  /* Grows only when a label actually had to stagger, so the common case keeps
     its single-row height. */
  .hs-ticks.two-row { height: 34px; }
  .hs-tick.row-2 { top: 16px; }
  /* 13.5px, matching .hs-year and the tab labels — these are axis furniture, not
     body copy, and the tick row is the one place on the slider where width is
     genuinely scarce. See the label change in renderTicks() for the other half
     of this fix. */
  .hs-tick { position: absolute; transform: translateX(-50%); font-size: 13.5px; color: var(--ink);
    background: transparent; border: none; padding: 0; cursor: pointer; font-family: inherit;
    white-space: nowrap; }
  .hs-tick:hover, .hs-tick.on { color: var(--t); }
  /* Temporarily suppressed tick label — see HIDDEN_TICK_LABEL_YEARS. Same
     visibility:hidden the pruner already uses for a label that fits nowhere,
     so the year keeps its true position in the DOM and nothing else shifts. */
  .hs-tick.label-hidden { visibility: hidden; }
  .hs-tick.edge-first { transform: none; left: 0 !important; }
  .hs-tick.edge-last { transform: none; left: auto !important; right: 0; }
  /* Tick labels are 13px to match the panel/news-feed text scale rather than
     the 9-10px disclaimer scale they started at. At that size 1825 and 1845 —
     only 20 years apart on a ~200-year track — genuinely DO collide, so
     overlapping labels are pruned at render time by measuring the real laid-out
     boxes (pruneOverlappingTicks), not by guessing at a font metric. Positions
     stay strictly proportional to the year either way. */

  /* FIXED HEIGHT, deliberately (2026-08-04). The blurb changes on every slider
     step and its length varies a lot — the shortest real entry is 12 words
     (1880), the longest is 67 (1889, which is the enforced maximum). Letting the
     box size to its content made everything below it jump on every drag.
     RESIZED 190px -> 290px on 2026-08-04 when the station lines landed, then
     290px -> 380px later the same day when the site-wide font uplift took this
     box from 13px/12px to 15px/13.5px. Every re-size has had the same cause:
