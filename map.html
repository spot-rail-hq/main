    ids.push('operator-lines-active');
    GLOW_RINGS.forEach(function (ring, i) { ids.push('operator-lines-hover-glow-' + i); });
    STATION_TIERS.forEach(function (t) {
      ids.push('stations-circle-' + t.id, 'stations-circle-' + t.id + '-hit',
        'stations-hover-glow-' + t.id, 'stations-label-' + t.id);
    });
    // Must mirror setHistoryLayerVisibility()'s hide list exactly — see the
    // selected-station overlay comment there.
    ids.push(SELECTED_STATIONS_LAYER_ID, SELECTED_STATIONS_GLOW_LAYER_ID);
    // The path line is the ONE deliberate asymmetry, and it has to be: unlike
    // every other layer here, visibility:'none' on ROUTE_LAYER_ID is also how
    // clearRoutePolyline() says "there is no route to show". A blanket restore
    // would resurrect a route the user had already cleared. So it is restored
    // only when a selection that owns a path is actually live.
    // activeFromToPath() rather than selection.type === 'fromto' directly
    // (Section 5) — a route locked-visible behind a station panel must
    // come back too, not just a live from/to panel.
    if (selection.type === 'route' || activeFromToPath()) {
      ids.push(ROUTE_LAYER_ID, ROUTE_HIT_LAYER_ID);
    }
    ids.forEach(function (id) {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'visible');
    });
    // A heritage re-apply used to run here (and, before that, a dot-visibility
    // one), because the four heritage tiers ARE in `ids` via ROUTE_TIERS and the
    // blanket restore would otherwise trample a user toggle. Gone 2026-08-03:
    // heritage lines are permanently visible, so the blanket restore is simply
    // correct for them and there is no preference left to put back.
  }

  // Full-colour operator paint for the modern band inside History mode.
  function applyHistoryModernPaint() {
    if (!map || !operatorColorsData) return;
    var theme = currentTheme();
    var lookup = buildOperatorColorLookup(theme);
    var match = ['match', ['get', 'operators']];
    Object.keys(lookup).forEach(function (k) { match.push(k, lookup[k]); });
    match.push(MULTI_OPERATOR_NEUTRAL[theme]);
    ROUTE_TIERS.forEach(function (t) {
      var id = 'operator-lines-' + t.id;
      if (map.getLayer(id)) map.setPaintProperty(id, 'line-color', match);
    });
  }

  // ── Year highlight (sidebar) ─────────────────────────────────────────────
  // Reads the reviewed-only notableYears map. Not every year has an entry —
  // the section COLLAPSES cleanly when there is none rather than showing an
  // empty box.
  function renderYearHighlight() {
    var el = document.getElementById('hs-highlight');
    if (!el) return;
    // THE "TODAY" ENTRY IS NOT KEYED BY YEAR, on purpose. The last snap point is
    // historyMaxYear(), i.e. whatever year it is now — so storing this under
    // "2026" would silently stop rendering at 00:00 on 1 January 2027, with
    // nothing to indicate why. It lives under the literal key `today` instead
    // and is matched positionally, so it follows the slider's end stop forever.
    // The tick already labels that position "Today" rather than the year for the
    // same reason (see renderTicks).
    //
    // NO YEAR PREFIX IN THIS BOX (2026-08-04). It used to open with a
    // .hs-highlight-year chip repeating the year — which #hs-year-sidebar
    // already shows, large, directly above the slider track. Worse, the chip and
    // the body had no separator of their own, so the "today" entry rendered as
    // "TodayExplore 200 years…". The year is stated once, above the track, and
    // this box carries body text only.
    var atToday = historyYear === historyMaxYear();
    var entry = atToday ? (notableYears.today || notableYears[String(historyYear)])
                        : notableYears[String(historyYear)];
    // SUPPLEMENTARY, NOT ALTERNATIVE. The station lines sit alongside a
    // hand-written headline when the year has both, and either can appear
    // without the other — so the box now shows whenever EITHER exists, and only
    // collapses when there is genuinely nothing for this year (2 of 202 years:
    // 1827 and 1829).
    var events = yearEvents[String(historyYear)];
    var stationHtml = events ? yearEventLinesHtml(events) : '';
    var hasBlurb = !!(entry && entry.blurb);
    if (!hasBlurb && !stationHtml) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    // Body text only — see the no-year-prefix note above. The wrapper is emitted
    // ONLY when there is a headline: the separator between headline and station
    // lines is a CSS adjacent-sibling rule, so an empty wrapper on a
    // station-only year would draw a rule above the first station line with
    // nothing above it.
    var html = hasBlurb ? '<div class="hs-highlight-main">' + escapeAttr(entry.blurb) + '</div>' : '';
    // Writes into the BODY, not the container — the container also holds the
    // collapse control, which must survive a re-render.
    var body = document.getElementById('hs-highlight-body');
    (body || el).innerHTML = html + stationHtml;
    // Re-wired on every render because innerHTML replaces the buttons wholesale.
    wireYearEventLinks(body || el);
    syncHighlightCollapse();
  }
  /**
   * Collapse control for the blurb panel. Same pattern as the attribution
   * footer: body first, control last, so the chevron stays in the bottom-right
   * corner in both states and one spot toggles it both ways.
   *
   * COLLAPSED STATE KEEPS A ONE-LINE SUMMARY rather than vanishing, so it is
   * obvious there is content to bring back. The summary is the year label plus
   * a short count of what is in there — enough to tell an empty year from a
   * dense one at a glance.
   */
  var highlightCollapsed = false;
  function highlightSummaryText() {
    var atToday = historyYear === historyMaxYear();
    var label = atToday && notableYears.today ? 'Today' : String(historyYear);
    var ev = yearEvents[String(historyYear)] || {};
    var bits = [];
    if ((notableYears[atToday ? 'today' : String(historyYear)] || {}).blurb) bits.push('note');
    var st = (ev.stations && (ev.stations.opened || ev.stations.closed)) ? 'stations' : null;
    var ln = (ev.lines && (ev.lines.opened || ev.lines.closed)) ? 'lines' : null;
    if (st) bits.push(st);
    if (ln) bits.push(ln);
    return label + (bits.length ? ' · ' + bits.join(', ') : '');
  }
  function syncHighlightCollapse() {
    var wrap = document.getElementById('hs-highlight');
    var body = document.getElementById('hs-highlight-body');
    var btn = document.getElementById('hs-highlight-toggle');
    var lbl = document.getElementById('hs-highlight-toggle-label');
    if (!wrap || !body || !btn) return;
    body.hidden = highlightCollapsed;
    wrap.classList.toggle('is-collapsed', highlightCollapsed);
    btn.setAttribute('aria-expanded', String(!highlightCollapsed));
    btn.setAttribute('aria-label', highlightCollapsed ? 'Expand year details' : 'Collapse year details');
    // The label only appears while collapsed — expanded, the content speaks for
    // itself and a duplicate year line would just repeat #hs-year-sidebar.
    if (lbl) lbl.textContent = highlightCollapsed ? highlightSummaryText() : '';
  }
  (function wireHighlightCollapse() {
    var btn = document.getElementById('hs-highlight-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      highlightCollapsed = !highlightCollapsed;
      syncHighlightCollapse();
    });
  })();
  /**
   * "Stations opened: A, B, C and 346 more" — four possible lines per year
   * (stations opened/closed, lines opened/closed), each omitted entirely when
   * that year has none.
   *
   * `more` is absent from the data whenever everything fits in the named list,
   * so there is no "and 0 more" case to guard here — the build script drops the
   * key rather than writing a zero.
   *
   * NAMES RENDER AS BUTTONS. Every item arrives from the build with what a click
   * needs already resolved (crs where the station still exists, lon/lat always,
   * the year span) so nothing has to be looked up at click time. The item index
   * is carried in data- attributes and the real object is fetched back out of
   * yearEvents on click, rather than serialising the object into the DOM.
   */
  function yearEventLinesHtml(events) {
    var out = '';
    [
      ['stations', 'opened', 'Stations opened'],
      ['stations', 'closed', 'Stations closed'],
      ['lines', 'opened', 'Lines opened'],
      ['lines', 'closed', 'Lines closed'],
    ].forEach(function (row) {
      var group = events[row[0]];
      var v = group && group[row[1]];
      if (!v || !v.items || !v.items.length) return;
      var parts = v.items.map(function (item, i) {
        return '<button type="button" class="hs-event-link" data-ev-cat="' + row[0] +
          '" data-ev-kind="' + row[1] + '" data-ev-i="' + i + '">' + escapeAttr(item.name) + '</button>';
      });
      var tail = v.more ? ' and ' + v.more + ' more' : '';
      out += '<div class="hs-highlight-stations"><span class="hs-stations-label">' +
        row[2] + ':</span> ' + parts.join(', ') + escapeAttr(tail) + '</div>';
    });
    return out;
  }
  /**
   * Click dispatch for the generated event links.
   *
   * MODE DECIDES WHICH SELECTION FUNCTION IS CORRECT, and getting this wrong
   * would break History in a way that is easy to miss:
   *   - IN HISTORY, a station goes to selectHistoricalStation() and a line to
   *     selectHistoricalLine(). Both are `historyOnly` selection types, so they
   *     cannot eject the user (setMode()'s drop rule keeps them, and neither
   *     function calls setMode at all). Using the live selectStation() here
   *     instead WOULD break it without touching mode: sidebarSkeletonHtml()
   *     tests `selectedStationId` BEFORE its `mode === 'history'` branch, so a
   *     live station selection renders the Live departures panel inside the
   *     History tab. Same class of problem as the heritage eject, different
   *     mechanism.
   *   - OUTSIDE HISTORY, a station with a CRS resolves to the live row and goes
   *     to selectStation(), matching a marker click exactly. One without a CRS
   *     is a closed station with no modern marker to select, so the camera move
   *     is all there is. A historical LINE has no representation outside History
   *     either (its layers are hidden), so it is also camera-only.
   *
   * boundsFitPadding(0) — WITH the argument. A bare call returns NaN padding and
   * freezes the map camera permanently; see that function's own note.
   */
  function wireYearEventLinks(el) {
    Array.prototype.forEach.call(el.querySelectorAll('.hs-event-link'), function (btn) {
      btn.addEventListener('click', function () {
        var y = yearEvents[String(historyYear)];
        var group = y && y[btn.dataset.evCat];
        var list = group && group[btn.dataset.evKind];
        var item = list && list.items && list.items[Number(btn.dataset.evI)];
        if (!item) return;
        var coords = (typeof item.lon === 'number' && typeof item.lat === 'number') ? [item.lon, item.lat] : null;
        var props = { name: item.name, start_year: item.start_year, end_year: (item.end_year === undefined ? null : item.end_year) };

        if (mode === 'history') {
          if (btn.dataset.evCat === 'lines') selectHistoricalLine(props);
          else selectHistoricalStation(props, coords);
        } else if (btn.dataset.evCat === 'stations' && item.crs) {
          // Same CRS -> canonical id resolution restoreStateFromUrl() uses, so a
          // link and a ?station= link land in identical state.
          var row = getStationList().filter(function (s) { return s.crs === item.crs; })[0];
          var id = row ? stationIdOf(row) : item.crs;
          selectStation(stationNameForId(id), id);
        }
        if (coords && map) map.flyTo({ center: coords, zoom: 12, padding: boundsFitPadding(0) }); // was 13 — one level out
      });
    });
  }

  function renderHistoryLegend() { /* legend lives in Database mode; no-op hook for era-colors load */ }

  // ── Attribution bar ──────────────────────────────────────────────────────
  // Built ENTIRELY from data/attribution.json — no attribution string is
  // hardcoded anywhere in this file, so adding a source to that manifest
  // updates the bar with no code change. That is the whole reason the
  // manifest exists rather than a block of markup.
  //
  // Collapsed shows every MANDATORY credit (the licence legally requires it).
  // COURTESY credits — CC0 sources like OpenHistoricalMap and Wikidata, which
  // waive attribution — live in the expanded state only. A UI short on space
  // may collapse courtesy credits; it may never collapse mandatory ones.
  var attributionManifest = null;
  loadJsonContent('/data/attribution.json', function (d) {
    attributionManifest = d;
    renderAttributionBar();
  });

  function renderAttributionBar() {
    var summaryEl = document.getElementById('sb-attrib-summary');
    var bodyEl = document.getElementById('sb-attrib-body');
    if (!summaryEl || !bodyEl) return;
    var sources = (attributionManifest && attributionManifest.sources) || [];
    if (!sources.length) return; // keep the static pre-JS fallback text
    // COLLAPSED BAR is just the word "Attribution" (2026-08-05 request —
    // was every MANDATORY credit joined together, e.g. all six sources
    // unconditionally measured 336 characters, about five wrapped lines and
    // ~86px of permanent sidebar chrome, visibly squeezing the Live tab's
    // 50/50 departure/news panes on a short viewport). Minimising permanent
    // footprint (mobile especially, now that the sidebar has several
    // stacked sections) won out over crediting sources before the user
    // expands to read them — worth flagging plainly: every source is still
    // listed, mandatory and courtesy alike, in the EXPANDED body below,
    // completely unconditionally (nothing has ever been scope-filtered
    // there — see its own comment) — the credits themselves haven't
    // changed, only that reaching them now always needs the one tap the
    // expanded state already guaranteed. If that one tap needs to not be
    // needed for legal reasons, that's a real, separate call to make, not
    // something to assume either way here.
    summaryEl.textContent = 'Attribution';
    function rowHtml(s) {
      var lic = s.licence_url
        ? '<a class="db-link" href="' + escapeAttr(s.licence_url) + '" target="_blank" rel="noopener">' + escapeAttr(s.licence_label || s.licence_code || '') + '</a>'
        : escapeAttr(s.licence_label || s.licence_code || '');
      return '<div class="sb-attrib-row">' +
        '<span class="sb-attrib-src">' + escapeAttr(s.attribution_string) + '</span><br>' +
        '<span class="sb-attrib-lic">' + lic + '</span> ' +
        '<span class="sb-attrib-tag">' + escapeAttr(s.attribution === 'MANDATORY' ? 'required' : 'courtesy') + '</span>' +
        '</div>';
    }
    var mandatory = sources.filter(function (s) { return s.attribution === 'MANDATORY'; });
    var courtesy = sources.filter(function (s) { return s.attribution !== 'MANDATORY'; });
    bodyEl.innerHTML = mandatory.concat(courtesy).map(rowHtml).join('');
  }

  (function wireAttributionBar() {
    var toggle = document.getElementById('sb-attrib-toggle');
    var body = document.getElementById('sb-attrib-body');
    if (!toggle || !body) return;
    // #sb-attrib-body's static home — first child of #sb-attribution, before
    // the toggle button (see the BODY-FIRST-TOGGLE-LAST comment on the HTML)
    // — captured once so the mobile full-sheet path (below) can reparent it
    // out on open and put it back exactly where it started on close, the
    // same convention .sb-top-tabs/relocateModeTabs() already uses.
    var bodyHomeParent = body.parentNode;
    var bodyHomeNextSibling = body.nextSibling;
    var attribSheetEl = document.getElementById('attrib-sheet');
    var attribSheetBodyEl = document.getElementById('attrib-sheet-body');

    function openAttributionSheet() {
      renderAttributionBar(); // refresh — the inline path always re-renders on open too, see below
      body.hidden = false; // the inline path's own hidden/shown state doesn't apply once this is in the full sheet
      attribSheetBodyEl.appendChild(body);
      attribSheetEl.classList.add('open');
    }
    function closeAttributionSheet() {
      attribSheetEl.classList.remove('open');
      body.hidden = true;
      bodyHomeParent.insertBefore(body, bodyHomeNextSibling);
    }
    document.getElementById('attrib-sheet-close').addEventListener('click', closeAttributionSheet);

    toggle.addEventListener('click', function () {
      // Mobile/tablet-portrait (2026-08-07): full-sheet instead of the
      // inline expand below — desktop's own behaviour is otherwise
      // completely untouched.
      if (window.innerWidth <= 768) { openAttributionSheet(); return; }
      var open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      body.hidden = open;
      // The expanded list already contains every source, INCLUDING the ones the
      // collapsed summary names. Showing both stacked them on top of each other
      // — the first row's source line ran into the summary and read as clipped
      // text. Collapse the summary to a short label while expanded.
      var summary = document.getElementById('sb-attrib-summary');
      if (summary) {
        summary.classList.toggle('is-collapsed-label', !open);
        if (!open) summary.textContent = 'Data sources';
        else renderAttributionBar();
      }
    });
  })();

  // ── Slider-follow rules ──────────────────────────────────────────────────
  // Applied ONLY when an entity is OPENED — never on a year change, so
  // dragging or jumping can never re-trigger them and yank the user back.
  //
  //   RULE 1  slider year already inside the span -> DO NOT MOVE. The user's
  //           position is valid; moving it would destroy their place.
  //   RULE 2  outside the span -> move to the START of the MAP-COVERAGE
  //           RANGE, so the entity's network is actually visible.
  //   RULE 3  no span determinable -> DO NOT MOVE. Never guess.
  //
  // The range used is always MAP-COVERAGE (derived from our own tiles), never
  // `founded` and never `dates_of_operation`. GWR (Legacy) was incorporated
  // in 1833 but its first line opened in 1838 — following the founding year
  // would land the user on an empty map.
  // `range` is the MAP-COVERAGE range. `operatedFrom` is optional: the
  // operator's own DATES OF OPERATION start year, used only to stop Rule 2
  // landing on a year the company did not exist in — see below.
  // `opts.snapTo` (2026-08-13, opt-in, DEFAULT UNCHANGED): every existing
  // caller (selectHistoricalOperator, selectHistoricalLine, and a plain
  // selectHistoricalStation map click) depends on RULE 2 landing on the
  // START of the range, so that stays the default with no third argument at
  // all — same as before this change, byte-for-byte.
  //
  // opts.snapTo === 'nearest' (2026-08-14, replaces an earlier 'end'/'none'
  // pair — removed, nothing calls them any more, see the History search
  // rule rewrite): the caller has ALREADY computed the exact landing year
  // via historicalStationSnapYear() and passes it as opts.targetYear (or
  // null/undefined for "no snap needed"). This BYPASSES RULE 1 below
  // entirely rather than layering on top of it, because RULE 1 only knows
  // the OVERALL first-to-last span (`lo`/`hi`) and cannot see gaps between
  // periods — a multi-period station can have a real closure gap inside
  // that span that RULE 1 would wrongly wave through as "already open".
  // The nearest-open-year rule needs true per-period membership, which only
  // historicalStationSnapYear() computes; this mode just executes its
  // answer.
  //
  // Returns true iff a snap actually happened, so a caller can decide
  // whether to show a "slider moved" notice. Existing callers ignore the
  // return value — a new true/false result on a function that used to
  // return undefined cannot break anything that never checked it.
  function applySliderFollow(range, operatedFrom, opts) {
    opts = opts || {};
    if (!range) { activeSpanRange = null; syncSliderInstances(); return false; } // RULE 3
    var max = historyMaxYear();
    var lo = range.first_year;
    var hi = range.last_year === null ? max : range.last_year;
    // ACTIVE SPAN starts at the SAME max(coverage, first operation) the landing
    // uses, not at raw map coverage. Approved 2026-07-26: a band starting at
    // raw coverage makes the same false claim the landing bug did, just
    // visually — GWR's coverage starts 1825 because two 1825-dated "Porthcawl
    // Branch Line" features are named after the company that later absorbed
    // them, eight years before GWR ran a train. Cost accepted: those two
    // features sit outside the displayed band. The band is still purely
    // visual and never gates dragging or the Jump-to field.
    var spanFrom = lo;
    if (typeof operatedFrom === 'number' && operatedFrom > spanFrom && operatedFrom <= hi) spanFrom = operatedFrom;
    activeSpanRange = { first_year: spanFrom, last_year: range.last_year };

    if (opts.snapTo === 'nearest') {
      if (opts.targetYear === null || opts.targetYear === undefined) { syncSliderInstances(); return false; }
      setHistoryYear(opts.targetYear, { source: 'follow' });
      syncSliderInstances();
      return true;
    }

    if (historyYear >= lo && historyYear <= hi) { syncSliderInstances(); return false; } // RULE 1

    // RULE 2 — land on max(map-coverage start, dates-of-operation start).
    //
    // Map coverage alone is not enough for a PRE-1923 operator. The coverage
    // figure is clamped to its era band, and the pre1923 band's lower bound is
    // just the slider minimum, so every pre-grouping company clamps to 1825
    // regardless of when it actually existed. That sent someone opening GWR
    // (Legacy) to 1825 — five years before the Liverpool and Manchester
    // Railway, eight before GWR was even incorporated — which asserts
    // something false about the company. It is not Rule 2 working literally;
    // it is the clamp's floor leaking into the answer.
    //
    // Taking the later of the two guarantees BOTH that the operator existed at
    // the landing year AND that there is map data to show there. GWR lands on
    // 1838 (Paddington-Maidenhead) instead: sparse, but correctly sparse, with
    // the active-span band showing there is more to see further right.
    //
    // Where dates_of_operation is not populated this falls through to raw map
    // coverage exactly as before — a founding year is never guessed.
    setHistoryYear(spanFrom, { source: 'follow' });
    syncSliderInstances();
    return true;
  }

  // MAP-COVERAGE RANGE for a historical operator, precomputed at build time by
  // scripts/build-historical-operator-coverage.mjs. Precomputed rather than
  // queried per panel-open because querySourceFeatures() only sees tiles
  // loaded for the CURRENT viewport — the answer would change with where the
  // user happened to be panned, which is a correctness problem, not just a
  // slow one.
  function coverageForHistoricalOperator(slug) {
    var rec = historicalOperators[slug];
    if (!rec) return null;
    var best = null;
    (rec.tile_matches || []).forEach(function (m) {
      var cov = operatorCoverage[m];
      if (!cov) return;
      if (!best) { best = { first_year: cov.first_year, last_year: cov.last_year }; return; }
      best.first_year = Math.min(best.first_year, cov.first_year);
      if (best.last_year !== null) {
        best.last_year = cov.last_year === null ? null : Math.max(best.last_year, cov.last_year);
      }
    });
    return best;
  }

  // ── History-mode entity panels ───────────────────────────────────────────
  // Navigation within History mode STAYS in History mode — none of these ever
  // calls setMode('database').
  function selectHistoricalOperator(slug, fallbackName) {
    ++selectionSeq;
    selection = { type: 'histop', slug: slug, fallbackName: fallbackName || slug };
    clearHistoryLock(); // same "moved on to another kind of selection" rule as selectHistoricalStation()
    renderSelectionChrome();
    expandSidebarIfCollapsed();
    animateSidebarTransition();
    setSelectedStationPoints([]);
    var rec = historicalOperators[slug];
    // first_operation_year, NOT `founded`. Renamed from dates_of_operation.start
    // precisely because the old name invited the founding year to be put here —
    // which is what happened, and what sent GWR's landing to 1825/1833 instead
    // of 1838. See the field's own note in data/historical-operators.json.
    var operatedFrom = rec && typeof rec.first_operation_year === 'number' ? rec.first_operation_year : null;
    applySliderFollow(coverageForHistoricalOperator(slug), operatedFrom);
    pushHistoryForCurrentState();
  }

  function selectHistoricalLine(props) {
    ++selectionSeq;
    selection = { type: 'histline', line: props, fallbackName: props.name || UNNAMED_LINE_LABEL };
    renderSelectionChrome();
    expandSidebarIfCollapsed();
    animateSidebarTransition();
    setSelectedStationPoints([]);
    // A line's own lifespan IS its map-coverage range — it is one feature, so
    // there is nothing to aggregate.
    var end = (props.end_year === undefined || props.end_year === null) ? null : props.end_year;
    applySliderFollow(props.start_year !== undefined ? { first_year: props.start_year, last_year: end } : null);
    pushHistoryForCurrentState();
  }

  // Renders a predecessor/successor group. THE NIL-vs-UNRECORDED DISTINCTION
  // IS LOAD-BEARING: a company that genuinely had no predecessor (GWR (Legacy)
  // was an original 1833 incorporation) is a different fact from one we simply
  // have no data for, and rendering both as "None" asserts something false.
  function histRelationHtml(label, group) {
    if (!group) return dbFieldHtml(label, '<span class="db-value">Unrecorded</span>');
    // "NIL" verbatim, per both the brief and the approved mockup. It reads as
    // a recorded fact ("we checked; there was none") in a way "None" does not,
    // which is the whole point of distinguishing it from Unrecorded.
    if (group.state === 'nil') return dbFieldHtml(label, 'NIL');
    if (group.state !== 'known' || !(group.entities || []).length) {
      return dbFieldHtml(label, 'Unrecorded');
    }
    // A chip only becomes clickable when the target actually has a content
    // record. CHOSEN: render it VISIBLY DISABLED rather than suppressing it —
    // suppressing would silently hide a real historical fact (the LMS did
    // succeed the Caledonian Railway) just because we have not written that
    // company's entry yet, which is a worse lie than showing an unclickable
    // name. Disabled chips also make the 2C content backlog visible in the UI.
    var chips = group.entities.map(function (e) {
      var hasRecord = e.key && historicalOperators[e.key];
      if (hasRecord) {
        return '<button type="button" class="filter-chip hist-rel-chip" data-histop="' + escapeAttr(e.key) + '">' +
          escapeAttr(e.display_name) + '</button>';
      }
      return '<span class="filter-chip hist-rel-chip is-disabled" aria-disabled="true" title="No database entry yet">' +
        escapeAttr(e.display_name) + '</span>';
    }).join('');
    return '<div class="db-field" data-anim-row><div class="db-label">' + label +
      '</div><div class="db-chip-row">' + chips + '</div></div>';
  }

  function histDatesOfOperationHtml(rec) {
    var from = rec.first_operation_year;
    if (from === undefined || from === null) return dbFieldHtml('Dates of operation', 'Unrecorded');
    var to = rec.last_operation_year;
    // The LABEL stays "Dates of operation" — that is the standard term in rail
    // literature and in Wikipedia rail-company infoboxes. Only the underlying
    // FIELD names changed, to first/last_operation_year, so that whoever
    // populates them cannot mistake them for incorporation dates.
    return dbFieldHtml('Dates of operation', from + '–' + (to === null || to === undefined ? 'present' : to));
  }

  function historicalOperatorSkeletonHtml() {
    var rec = historicalOperators[selection.slug];
    if (!rec) return dbComingSoonHtml(selection.fallbackName);
    var html = '';
    html += dbHeadlineHtml(rec.description);
    html += dbFieldHtml('Founded', rec.founded ? String(rec.founded) : 'Unrecorded');
    html += histDatesOfOperationHtml(rec);
    html += dbFieldHtml('Headquarters', rec.headquarters || 'Unrecorded');
    html += histRelationHtml('Predecessor', rec.predecessor);
    html += histRelationHtml('Successor', rec.successor);
    // NOTE: no "On this map" / map-coverage field here. It is neither in the
    // brief's field list nor in the mockup, and the slider's active-span band
    // already conveys the same range visually — a second, numeric copy of it
    // would be redundant panel weight.
    html += notableFeaturesHtml(rec.notable_features);
    if (rec.source_url) {
      // Labelled by the source it actually points at (the mockup shows
      // "WIKIPEDIA"), not a generic "Source" — the reader can tell what they
      // are about to open.
      var srcLabel = /wikipedia\.org/.test(rec.source_url) ? 'Wikipedia' : 'Source';
      // The .db-field WRAPPER is what carries the panel's 10px/16px field
      // padding — .db-links itself is only a flex row and has no padding of its
      // own. Both History panels emitted a bare .db-links here, so the link sat
      // hard against the sidebar's left edge while every label above it
      // (Founded, Headquarters, …) was indented. The Database tab's own link
      // row has always used this wrapper; History was the outlier.
      html += '<div class="db-field" data-anim-row><div class="db-links"><a class="db-link" href="' + escapeAttr(rec.source_url) +
        '" target="_blank" rel="noopener">' + srcLabel + '</a></div></div>';
    }
    // NOTE: no fleet chips, no region chips, no departure elements. History
    // operator panels are history-focused regardless of whether the operator
    // is historical or modern — that is a deliberate difference from the
    // Database tab's operator view, not an omission.
    return html || dbComingSoonHtml(rec.display_name);
  }

  function histPrecisionNoteHtml(startPrecision, endPrecision) {
    var notes = [];
    if (startPrecision === 'inferred') notes.push('Opening year inferred from the line it sits on — a verified date is welcome.');
    if (startPrecision === 'unknown') notes.push('Opening year unknown.');
    if (endPrecision === 'inferred') notes.push('Closing year inferred — a verified date is welcome.');
    if (endPrecision === 'unknown') notes.push('No closure recorded; this may mean still open, or simply unrecorded.');
    if (!notes.length) return '';
    return '<p class="db-precision-note" data-anim-row>' + notes.map(escapeAttr).join(' ') + '</p>';
  }

  function historicalLineSkeletonHtml() {
    var p = selection.line || {};
    var html = '';
    var band = eraBandForYear(historyYear);
    var company = p[BAND_PROPERTY[band]] || null;
    html += dbFieldHtml('Name', p.name || UNNAMED_LINE_LABEL);
    html += dbFieldHtml('On this map',
      (p.start_year !== undefined ? p.start_year : '?') + '–' +
      (p.end_year === undefined || p.end_year === null ? 'present' : p.end_year));
    // A line with NO company attribution (~88.7% of the Big Four band, ~64%
    // of pre-1923) degrades to "Unrecorded" here rather than opening an empty
    // operator panel.
    if (company) {
      var slug = historicalOperatorByMatch[company];
      html += slug
        ? '<div class="db-field" data-anim-row><div class="db-label">Operator</div><div class="db-chip-row">' +
            '<button type="button" class="filter-chip hist-rel-chip" data-histop="' + escapeAttr(slug) + '">' +
            escapeAttr(company) + '</button></div></div>'
        : dbFieldHtml('Operator', escapeAttr(company));
    } else {
      html += dbFieldHtml('Operator', 'Unrecorded for this period');
    }
    html += histPrecisionNoteHtml(p.start_precision, p.end_precision);
    if (p.license === 'CC-BY-4.0') {
      html += '<p class="db-precision-note" data-anim-row>Linework reproduced with the permission of the National Library of Scotland (CC BY).</p>';
    }
    return html;
  }

  // Bottom link row for a History station panel: GOOGLE MAP | WIKIPEDIA.
  //
  // LAT/LON, NEVER A PLACE ID — deliberately different from dbBottomLinksHtml()
  // (2026-07-27). Closed stations have no Google Place ID and never will, and a
  // panel whose link silently changes shape depending on whether the station
  // survives would be inconsistent for no reader-visible reason. Coordinates
  // come from the clicked feature's own geometry, so open and closed stations
  // are treated identically.
  //
  // "WIKIPEDIA", not "Source": verified across the whole dataset, all 8,884
  // historical stations carry a `source` of the form "wikipedia:<article
  // title>" — there are no other prefixes — so the generic label was hiding
  // information the reader could have had. The prefix is still CHECKED rather
  // than assumed, because the URL below is constructed from it: a future
  // non-Wikipedia source would otherwise be given a wrong link under a wrong
  // label instead of simply being omitted.
  function historyStationLinksHtml(props, coords) {
    var parts = [];
    if (coords && coords.length === 2) {
      parts.push('<a href="https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(coords[1] + ',' + coords[0]) + '" target="_blank" rel="noopener">Google Map</a>');
    }
    var src = String(props.source || '');
    if (/^wikipedia:/.test(src)) {
      parts.push('<a href="https://en.wikipedia.org/wiki/' +
        escapeAttr(src.replace(/^wikipedia:/, '').replace(/ /g, '_')) +
        '" target="_blank" rel="noopener">Wikipedia</a>');
    }
    if (!parts.length) return '';
    return '<div class="db-field" data-anim-row><div class="db-links">' +
      parts.join('<span class="db-link-sep">|</span>') + '</div></div>';
  }

  // Station panel in History mode — shows the FULL open/closed history, not
  // just the current period. 965 stations have more than one.
  //
  // STILL-OPEN STATIONS ALSO GET THE DATABASE REFERENCE CONTENT (2026-07-27).
  // The 2,565 historical stations that carry a `crs` are the same stations the
  // Database tab documents, joined on the same code, so there is no reason for
  // History to show a thinner panel for them. What it must NOT show is
  // anything live: no departure board, no live updates. Tonight's departures
  // next to a slider resting on 1891 is incoherent, and that is also what the
  // old behaviour accidentally produced (see addStationsLayer()'s note on the
  // ghost live markers). stationDatabaseSkeletonHtml() is REUSED rather than
  // forked — it holds no live content of its own, so it needed only an opts
  // argument to render a station other than the live selection.
  //
  // Closed-only stations (no crs) keep exactly the layout they had.
  // The mode flag is never touched by any of this: History stays History, and
  // the slider stays on screen and usable.
  // "Moved to 1964 · Tyldesley operated 1846–1964." — set only by
  // selectHistoricalStation() when opts.snapToOpen actually moved the slider
  // (Section 4). Reads `selection.snapNotice` directly rather than taking it
  // as a parameter, same pattern fromToSkeletonHtml() already uses for
  // selection.fromToPath — every OTHER selection type sets a fresh
  // `selection` object with no snapNotice key at all, so this can only ever
  // render for the histstation selection that actually produced it.
  //
  // States the year moved TO plus the station's whole operating range,
  // rather than asserting a second, different "closure year" — this data
  // model has one end_year per period, not a separate "last year trains
  // ran" vs. "official closure date" (which can genuinely differ by one in
  // real-world closure records; an earlier draft of this notice implied
  // that distinction and this dataset cannot support it). "–present" when
  // the final period is still open — reachable here even though a snap only
  // fires when a target year exists, because the STATION can still be
  // currently open while the SNAP moved to years before either its
  // reopening or its first opening (e.g. a slider sitting inside an early
  // closure gap of a station that's open again today).
  function historicalSnapNoticeHtml() {
    var n = selection.snapNotice;
    if (!n) return '';
    var range = n.firstYear + '–' + (n.stillOpen ? 'present' : n.lastYear);
    return '<div class="db-hint hist-snap-notice" data-anim-row>Moved to ' + n.toYear + ' · ' +
      escapeAttr(n.name) + ' operated ' + range + '.</div>';
  }

  function historicalStationSkeletonHtml(props, coords) {
    var html = historicalSnapNoticeHtml();
    var periods = [];
    try { periods = JSON.parse(props.periods || '[]'); } catch (e) { periods = []; }
    if (!periods.length && props.p1_start !== undefined) {
      periods = [{ start_year: props.p1_start, end_year: props.p1_end === undefined ? null : props.p1_end }];
    }
    if (periods.length) {
      html += '<div class="db-field" data-anim-row><div class="db-label">Open periods</div><div class="db-value">' +
        periods.map(function (p) {
          return p.start_year + '–' + (p.end_year === null || p.end_year === undefined ? 'present' : p.end_year);
        }).join('<br>') + '</div></div>';
    }
    html += histPrecisionNoteHtml(props.start_precision, props.end_precision);
    // "Still open" was removed here on 2026-07-27 (approved). It only ever
    // rendered when `crs` was present, and for all 2,565 such stations the
    // last open period already ends in "present" — so it restated the Open
    // periods row directly above it and could never say "No". The Database
    // reference block below now states the same fact far more richly. Do not
    // reintroduce it: "is this station still open" is answered by the period
    // list, and by whether that block renders at all.
    var crs = props.crs ? String(props.crs).toUpperCase() : null;
    if (crs && stationsContent[crs]) {
      html += stationDatabaseSkeletonHtml({ crs: crs, name: props.name, omitBottomLinks: true });
    }
    html += historyStationLinksHtml(props, coords);
    return html;
  }

  function wireHistoryPanel() {
    Array.prototype.forEach.call(contentBlock.querySelectorAll('.hist-rel-chip[data-histop]'), function (btn) {
      btn.addEventListener('click', function () {
        // Predecessor/successor navigation STAYS in History mode and applies
        // the slider-follow rules, including when it crosses the 1994
        // source-switch (a BR panel's modern successor is a legitimate jump).
        var slug = btn.dataset.histop;
        selectHistoricalOperator(slug, (historicalOperators[slug] || {}).display_name);
      });
    });
  }

  // A station/line's span, read from the flattened p1_start/p1_end...p5_end
  // scalars (`periods` is a JSON STRING in the tiles, not pre-parsed — this
  // reads the same flattened shape the search index also uses, see
  // build-historical-search-index.mjs). `first` is the first period's start;
  // `last` is the LAST period's end IF the station is not currently open;
  // `sawOpen` is true iff the final period found has no end year at all
  // (still open today). Extracted 2026-08-13 from selectHistoricalStation()'s
  // own inline loop — same logic, now also shared by the History search path
  // below (years label + snap target), so both read a multi-period station's
  // span identically rather than two copies drifting apart.
  function historicalPeriodSpan(props) {
    var first = props.p1_start, last = null, sawOpen = false;
    for (var i = 1; i <= 5; i++) {
      if (props['p' + i + '_start'] === undefined) break;
      if (props['p' + i + '_end'] === undefined) sawOpen = true;
      else last = props['p' + i + '_end'];
    }
    return { first: first, last: last, sawOpen: sawOpen };
  }

  // Snap target for the History station-SEARCH rule (2026-08-14 — REPLACES
  // an earlier "snap to the last year open, no snap if still open" rule
  // wholesale, not a patch on it: that rule treated "still open" as a dead
  // end with nothing to snap to, which was wrong whenever the slider sat
  // BEFORE the station existed at all — a station that opened in 1990
  // selected from 1850 needs to snap FORWARD to 1990, not stay put).
  //
  // Returns null if `year` already falls inside one of the station's real
  // open periods (including a still-open final period) — no snap needed.
  // Otherwise returns the NEAREST year it was actually open:
  //   - before the first opening -> forward to that period's start.
  //   - after the final closure (only possible if the final period has
  //     actually closed) -> back to that period's end.
  //   - inside a genuine gap between two periods -> whichever boundary is
  //     nearer; on an EXACT tie, the LATER period's start (never the
  //     earlier period's end) — checked against the real dataset: 806
  //     stations have a real (>=2yr) gap between two periods, and 486 of
  //     those have an even-length gap, so the exact-tie case is common, not
  //     a rare edge — e.g. Baldragon (periods 1831-1917 and 1919-1955): a
  //     2-year gap, year 1918 is equidistant from both 1917 and 1919,
  //     resolves to 1919.
  //
  // NOT NECESSARILY A SHORT HOP: gaps are sometimes very long — Mills Hill
  // closed 1842 and reopened 1985, a 143-year gap. A slider sitting mid-gap
  // (e.g. 1913) still resolves to "nearest" (1842, 71 years off, vs 1985,
  // 72 years off) even though neither year is meaningfully close to 1913.
  // "Nearest" is what was specified; flagging that for a handful of
  // long-gap stations it can read as an arbitrary pick rather than a
  // helpful one.
  function historicalStationSnapYear(props, year) {
    var periods = [];
    for (var i = 1; i <= 5; i++) {
      var s = props['p' + i + '_start'];
      if (s === undefined) break;
      var e = props['p' + i + '_end'];
      periods.push({ start: s, end: e === undefined ? null : e });
    }
    if (!periods.length) return null;

    for (var j = 0; j < periods.length; j++) {
      var p = periods[j];
      if (year >= p.start && (p.end === null || year <= p.end)) return null; // inside an open period
    }

    if (year < periods[0].start) return periods[0].start; // before the first opening
    var lastPeriod = periods[periods.length - 1];
    if (lastPeriod.end !== null && year > lastPeriod.end) return lastPeriod.end; // after the final closure

    // Otherwise it's a genuine gap between two consecutive periods.
    for (var k = 0; k < periods.length - 1; k++) {
      var endOfThis = periods[k].end, startOfNext = periods[k + 1].start;
      if (endOfThis !== null && year > endOfThis && year < startOfNext) {
        var distBack = year - endOfThis, distForward = startOfNext - year;
        return (distForward <= distBack) ? startOfNext : endOfThis; // tie -> later period's start
      }
    }
    return null; // defensive — unreachable given the checks above
  }

  // `coords` is the clicked feature's own [lon, lat] — the historical station
  // properties carry no coordinates of their own, and the panel's Google Map
  // link needs them (see historyStationLinksHtml). Not restored from the URL
  // because histstation is not a serialised selection type; if that ever
  // changes, the link degrades to Wikipedia-only rather than breaking.
  //
  // `opts.snapToOpen` (2026-08-14, opt-in): used only by the History search
  // path (selectHistoricalStationFromSearch) to snap to the nearest year the
  // station was actually open — see historicalStationSnapYear() — instead
  // of applySliderFollow()'s default start-of-range landing (see that
  // function's own header for why the default cannot change). A plain map
  // click never passes this: clicking a marker only ever picks a station
  // the year filter is CURRENTLY showing, so historyYear is already
  // guaranteed inside its range regardless of which rule would apply — this
  // option is unreachable from a click in practice, not just unused by it.
  function selectHistoricalStation(props, coords, opts) {
    opts = opts || {};
    ++selectionSeq;
    selection = { type: 'histstation', station: props, stationCoords: coords || null, fallbackName: props.name || 'Station' };
    // Moving on to a DIFFERENT kind of selection releases the segment lock —
    // the same rule selectStation() follows in the other tabs, where it calls
    // clearOperatorHighlight() for exactly this reason.
    clearHistoryLock();
    renderSelectionChrome();
    expandSidebarIfCollapsed();
    animateSidebarTransition();
    // WAS setSelectedStationPoints([]) — an empty array, which cleared the
    // overlay instead of placing a marker, so a History station click got no
    // solid-fill transition and no radar-ping ring while Live and Database both
    // did. `coords` was already being received and stored on the selection; it
    // simply was not passed on. Same call shape as selectStation(), so both
    // tabs drive the one animation rather than History growing its own.
    setSelectedStationPoints(coords ? [{ lon: coords[0], lat: coords[1] }] : []);
    var span = historicalPeriodSpan(props);
    var range = span.first !== undefined ? { first_year: span.first, last_year: span.sawOpen ? null : span.last } : null;
    var targetYear = opts.snapToOpen ? historicalStationSnapYear(props, historyYear) : null;
    var didSnap = applySliderFollow(range, undefined, opts.snapToOpen ? { snapTo: 'nearest', targetYear: targetYear } : undefined);
    // Visible notice (Section 2 rewrite) — only ever set when a search-driven
    // snap actually moved the slider; every other path (a plain click, or a
    // search pick that needed no snap) clears it, so a stale notice from a
    // previous selection can never survive onto this one. Carries the whole
    // operating range (not just the year moved to) so the panel can state
    // "operated 1846–1964" rather than implying a second, different year the
    // single-end_year-per-period data model doesn't actually have.
    selection.snapNotice = (opts.snapToOpen && didSnap)
      ? { toYear: targetYear, name: props.name, firstYear: span.first, lastYear: span.last, stillOpen: span.sawOpen }
      : null;
    pushHistoryForCurrentState();
  }

  // Entry point for a History-mode Station-tab search pick (see
  // searchStationTab() below). `entry` is one of searchHistoricalStations()'s
  // result objects — already shaped exactly like selectHistoricalStation()'s
  // own `props` argument (same p1_start/p1_end...p5_end flattened fields, a
  // `name`), so it's handed straight through as `props` with no lookup or
  // conversion. `entry.coords` is [lon, lat], same order selectHistoricalStation
  // itself expects. The only new thing here is the camera move: a map click
  // never needs one (the user is already looking at whatever they clicked),
  // but a search pick can jump anywhere on the map, same as submitStationPick()
  // does for the live Station tab — same zoom/duration, for a consistent feel
  // between the two tabs' "picked from search" moment.
  function selectHistoricalStationFromSearch(entry) {
    if (entry.coords) map.flyTo({ center: entry.coords, zoom: 10, duration: 800 });
    selectHistoricalStation(entry, entry.coords, { snapToOpen: true });
  }

  // Map interaction inside History mode. Registered once, and every handler
  // no-ops unless mode === 'history', so these cannot interfere with Live or
  // Database click behaviour.
  // ── History hover: per-segment highlight + tooltip ───────────────────────
  // PER-SEGMENT, not per-operator. Live mode highlights an operator's whole
  // network on hover, but that is impossible here: ~36% of pre-1923 and Big
  // Four features have no operator attributed at all, so for most of the map
  // there is no network to highlight. Per-segment is the only behaviour that
  // works across every band.
  // ONE string for an unnamed line, used by the hover tooltip, the sidebar
  // title and the panel's own Name field (2026-07-27). Those three used to
  // disagree — the tooltip showed nothing at all, the title said "Railway
  // line" and the field said "Unnamed line". The earlier decision to suppress
  // the tooltip entirely is reversed now that it has been seen on screen: a
  // segment that reacts to hover but shows no tooltip reads as broken, not as
  // missing data.
  var UNNAMED_LINE_LABEL = 'Unnamed railway line';
  function historyHoverLabel(props) {
    // The operator shown is the one for the CURRENT BAND only — never a
    // fallback to another band's attribution, which would silently claim e.g.
    // a Big Four company for a year it did not run the line.
    var band = eraBandForYear(historyYear);
    var company = BAND_PROPERTY[band] ? props[BAND_PROPERTY[band]] : null;
    // An unnamed line still gets a tooltip — see UNNAMED_LINE_LABEL. The
    // operator, when one IS attributed for this band, keeps its place in front
    // of it exactly as before.
    var name = props.name || UNNAMED_LINE_LABEL;
    // No operator attributed: show the line name ALONE. No "unknown", no empty
    // operator row — an absent attribution is not a fact worth a line of UI.
    return company ? company + ': ' + name : name;
  }

  // 2026-07-27: was applyHistoryHoverPaint(), driven by a single
  // hoveredHistoryFeature. It now takes a SET — locked and hovered are
  // independent states that can both be on at once, so hovering another route
  // while one is locked still previews that other route. That is the Database
  // tab's behaviour (see applyOperatorHighlightPaint()'s locked/hovered pair)
  // and the whole reason the filter can no longer key on one value.
  //
  // LOCKED AND HOVERED LOOK IDENTICAL, deliberately. Database does not
  // distinguish them either — there, each simply takes its own operator's real
  // colour, and when the same operator is both, it is one colour. History has
  // no per-segment operator colour to draw on (~36% of pre-1923 and Big Four
  // features have no operator attributed at all), so both states share the one
  // accent highlight. Inventing a separate locked colour here would be a
  // History-only affordance the rest of the site does not have.
  function historyHighlightSources() {
    var out = [];
    if (lockedHistoryFeature) out.push(lockedHistoryFeature);
    if (hoveredHistoryFeature && hoveredHistoryFeature !== lockedHistoryFeature) out.push(hoveredHistoryFeature);
    return out;
  }
  function applyHistoryHighlightPaint() {
    if (!map || !map.getLayer(HIST_GLOW_PREFIX + '0')) return;
    var active = historyHighlightSources();
    if (!active.length) {
      // Still filtered to nothing by default, so the other ~11,000 features
      // never pay for a blurred line — unchanged from the hover-only version.
      GLOW_RINGS.forEach(function (ring, i) {
        if (map.getLayer(HIST_GLOW_PREFIX + i)) map.setFilter(HIST_GLOW_PREFIX + i, NO_HISTORY_FEATURE_FILTER);
      });
      return;
    }
    // `source` ("ohm:way/{id}") is the only per-feature unique identifier in
    // the tiles, so it doubles as the highlight key. promoteId/feature-state
    // would be the usual route, but the glow needs a FILTER anyway (to keep the
    // other features off the blur render path entirely), and filtering on a
    // property avoids depending on a promoted id this source does not declare.
    // `in` over a literal, not `==` — at most two keys, so the linear scan the
    // `in` expression does is irrelevant here.
    //
    // The YEAR filter is folded in so a highlighted segment that the slider has
    // just moved out of range of stops glowing immediately.
    var filter = ['all', historyLineYearFilter(), ['in', ['get', 'source'], ['literal', active]]];
    // 2026-07-27: was a flat UI accent (--t turquoise) for every band. Each
    // band now highlights in ITS OWN colour family — a brighter Rail Blue for
    // BR, a brighter version of the company's own livery inside the Big Four,
    // and near-white/near-black for the two neutral bands, where a merely
    // lighter grey would not register as a highlight at all against a grey
    // network. Values and their measured separations live in
    // data/era-colors.json; nothing is hardcoded here.
    //
    // A per-feature MATCH, not one flat colour, for the same reason
    // applyHistoryPaint() uses one: locked and hovered can be two different
    // segments belonging to two different Big Four companies at once, and a
    // single colour would paint one of them with the other's highlight.
    var color = eraHighlightExpression(eraBandForYear(historyYear));
    GLOW_RINGS.forEach(function (ring, i) {
      var id = HIST_GLOW_PREFIX + i;
      if (!map.getLayer(id)) return;
      map.setFilter(id, filter);
      map.setPaintProperty(id, 'line-color', color);
    });
  }
  // Same shape as applyHistoryPaint()'s base-colour expression, reading the
  // highlight values instead. `modern` never reaches here — at 1994+ the
  // historical lines and their hit layer are hidden, so nothing is hoverable.
  function eraHighlightExpression(band) {
    var bandData = eraColors[band] || {};
    if (!bandData.companies) return eraHighlightColorFor(band, null);
    var prop = BAND_PROPERTY[band];
    var match = ['match', ['coalesce', ['get', prop], '']];
    Object.keys(bandData.companies).forEach(function (name) {
      match.push(name, eraHighlightColorFor(band, name));
    });
    match.push(eraHighlightColorFor(band, null));
    return match;
  }

  function clearHistoryHover() {
    if (hoveredHistoryFeature === null) return;
    hoveredHistoryFeature = null;
    applyHistoryHighlightPaint();
    hideHoverTooltip();
  }
  // Clears ONLY the lock. The open sidebar panel is deliberately left alone —
  // see the click handler in wireHistoryMapInteraction() for the reasoning.
  function clearHistoryLock() {
    if (lockedHistoryFeature === null) return;
    lockedHistoryFeature = null;
    lockedHistoryFeatureSpan = null;
    applyHistoryHighlightPaint();
  }

  // Station hover is a FILTER swap on the two overlay layers, not a
  // feature-state write — same reason as the line highlight above (no promoted
  // id on this source). The year filter is folded in so a slider move while
  // the pointer is stationary cannot leave a hover dot on a station that no
  // longer exists in the current year.
  function applyHistoryStationHoverFilter() {
    if (!map) return;
    var f = hoveredHistoryStation === null

      clearHistoryHover();

    // lockedOperatorHighlight never closes its panel), and this file already
    // treats these panels as reference material rather than a view of the map

    // outside the entity's own span. Closing the sidebar on a stray click into
    // empty sea would be the surprising behaviour, not the useful one.
    // FLAGGED for Aaron rather than assumed — a one-line change if he wants
    // the opposite.
    map.on('click', HIST_LINE_HIT_LAYER, function (e) {

      // (18px) invisible strip, so it always also overlaps whichever station

    var dbAndHistory = selection.type === 'heritage' || selection.type === 'operator';

    // 'histstation' was missing here (2026-07-27) — the other two history

    if (mode === 'live' && selection.type === 'none' && selectedStationCrs) {
