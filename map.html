     the content got taller, not the estimate got better.

     ⚠ 380px IS SIZED FOR 1863, WHICH IS NOT THE YEAR YOU WOULD GUESS. The
     obvious candidates are the ones with the longest headlines (1871, 1889,
     both ~340px), but the tallest year is the one where all FOUR event rows are
     populated with long names at once — 1863 at ~359px, whose "lines closed"
     row alone runs to 3 lines (Hagger Leases Branch / South Moor Colliery
     Waggonway / Dundee and Perth Railway). Sizing against the longest headline
     instead would overflow it by ~20px. If a future data refresh adds names,
     re-run the model rather than eyeballing the prose.

     ⚠ THIS BUYS STABILITY AT A REAL COST, and the cost is flagged rather than
     hidden: only 25 of the 202 reachable years carry a headline, while every
     one of them carries station lines, so the MEDIAN year renders at ~193px and
     leaves ~187px of empty box. Only 15 years exceed the old 290px, and the
     75th percentile is still only ~217px. Trimming does not fix it —
     the content genuinely varies ~3x. The alternatives, if the dead space ever
     outweighs the stability: size to the 90th percentile (~260px) and let the
     15 dense years scroll, or drop the fixed height entirely.

     THIS IS A CHARACTER-WIDTH MODEL, NOT A MEASUREMENT — there is no browser in
     the build environment, so the real wrapped height is unverified. The model
     was calibrated against a screenshot of 1871 and reproduces its line breaks
     exactly (5 headline lines / 2 / 2 / 3 / 1) and its box height to within
     ~2%, so the 380px carries roughly one row-line of headroom over 1863.
     overflow-y is auto specifically so that being short fails safe: the box
     scrolls rather than pushing the content below it. Worth one visual check
     against 1863, which is the tallest real case.

     TOP-ALIGNED, not centred: a short entry centred inside a tall fixed box
     moves its own first line down, which is the same jumpiness the fixed height
     is meant to remove — it just moves the jump inside the box instead of below
     it. Top alignment keeps the first line at a constant y for every year. */
  .hs-highlight { margin-top: 10px; padding: 9px 11px; border-radius: 10px;
    background: rgba(64,224,208,0.05); border: 0.5px solid var(--br); line-height: 1.5; font-size: 15px; color: var(--ink);
    min-height: 380px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
    overflow-y: auto; }
  /* A year with NO entry at all still collapses the box entirely. This rule used
     to matter a lot — before the auto station lines it fired on ~190 of the 202
     reachable years, and reserving that much empty bordered box would have been
     worse than the shift it prevents. It now fires on NONE of them: every year
     the slider can actually reach (HISTORY_MIN_YEAR 1825 to the current year)
     has at least one station or line event. Kept as a genuine guard, not as
     live behaviour — the data could thin out, and a year with nothing should
     still not draw an empty 380px box. */
  .hs-highlight[hidden] { display: none; }
  /* COLLAPSE CONTROL — same shape as .sb-attrib-toggle, and deliberately so:
     two collapsibles in one sidebar that behaved differently would be worse
     than either. Control last in the DOM, so it stays bottom-right in both
     states (see the markup comment). */
  .hs-highlight-body { width: 100%; }
  .hs-highlight-toggle { width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 0 0 6px; background: transparent; border: none; cursor: pointer; color: var(--ink);
    font-family: inherit; font-size: 13.5px; box-sizing: border-box; text-align: left; }
  .hs-highlight-toggle-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-family: var(--font-mono); letter-spacing: 0.04em; color: var(--ink); }
  .hs-highlight-chev { flex-shrink: 0; font-size: 13.5px; transition: transform 0.2s; margin-left: auto; }
  /* ARROW DIRECTION: base icon is chevron-UP, shown while EXPANDED (click it to
     collapse — the panel closes upward). Rotated 180deg to point DOWN while
     collapsed (click to expand — the panel opens downward). It points the way
     the panel will move. */
  .hs-highlight-toggle[aria-expanded="false"] .hs-highlight-chev { transform: rotate(180deg); }
  /* Collapsed: the fixed min-height is released, so the panel shrinks to the
     single control row instead of leaving ~290px of empty box — which is the
     entire point of being able to collapse it on a short screen. */
  .hs-highlight.is-collapsed { min-height: 0; }
  /* .hs-highlight-year removed 2026-08-04 with the year prefix it styled — the
     year is shown once, by #hs-year-sidebar above the slider track. */
  /* Auto-generated station open/close lines. Visually subordinate to the
     hand-written headline above them — dimmer, slightly smaller — because they
     are derived data rather than editorial, and a reader should be able to tell
     the two apart at a glance. */
  .hs-highlight-stations { margin-top: 4px; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
  /* The hairline sits ONLY between a headline and the first station line, as an
     adjacent-sibling rule. A year with station lines and no headline emits no
     .hs-highlight-main at all (see renderYearHighlight), so it correctly gets no
     rule above its first line rather than one floating at the top of the box. */
  .hs-highlight-main + .hs-highlight-stations { margin-top: 7px; padding-top: 7px;
    border-top: 0.5px solid var(--br); }
  .hs-stations-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ink-mute); margin-right: 5px; }
  /* Generated event names are real buttons, so they need the font resets — a
     <button> inherits neither family nor size, which is the exact bug CLAUDE.md
     calls out. Styled as inline text rather than a control: the line should read
     as a sentence that happens to be clickable, not as a row of chips. */
  .hs-event-link { font-family: inherit; font-size: inherit; box-sizing: border-box;
    display: inline; padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
    color: var(--ink); text-decoration: underline; text-decoration-color: var(--br);
    text-underline-offset: 2px; }
  .hs-event-link:hover, .hs-event-link:focus-visible { color: var(--t); text-decoration-color: var(--t); }

  /* Clear (×) inside a text field — shared by every search input and the
     Jump-to field. Hidden unless the field has text (JS toggles [hidden]) so
     empty fields stay clean. */
  .field-clear { position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; line-height: 14px; text-align: center; border-radius: 50%;
    background: transparent; border: none; color: var(--ink); cursor: pointer;
    font-family: inherit; font-size: 15px; box-sizing: border-box; padding: 0; }
  .field-clear:hover { color: var(--ink-primary); }

  @media (max-width: 768px) {
    /* Bigger touch target on the thumb — the default 16px is hard to grab
       without catching the map underneath. touch-action on the range stops the
       browser handing a horizontal drag to the map's own pan gesture. */
    .hs-range { height: 26px; touch-action: pan-y; }
    .hs-range::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -9.5px; }
    .hs-range::-moz-range-thumb { width: 22px; height: 22px; }
    .hs-ticks { height: 18px; }
    .hs-ticks.two-row { height: 32px; }
    .hs-tick.row-2 { top: 15px; }
    .hs-tick { font-size: 13.5px; }
  }

  /* Sidebar content block — swapped as a unit on every selection change
     (station tap, search, from/to submit, clear). Whole-block opacity is
     animated on the container itself; [data-anim-row] children get their own
     staggered fade+rise entrance, both driven from JS (transition/opacity/
     transform are set inline per-cycle since rows are freshly re-mounted,
     not persistent nodes with toggled classes). */
  .sb-content-block { display: flex; flex-direction: column; }
  /* Live tab — hard 50/50 split between departures and the news feed
     (2026-07-21 feedback: one continuous scroll felt cluttered/busy).
     .sb-content-block gets a definite height ONLY in Live mode — Database
     mode's content (station/operator/route detail, saved list) never
     contains .sb-dep-pane/.sb-news-pane, so this scoping is what keeps its
     original single-continuous-scroll-inside-#sb-body behavior intact;
     without the :not(.mode-database) guard, capping .sb-content-block's
     height here would clip that content instead of leaving it scrollable,
     since #sb-body itself would no longer see an overflow to scroll (its
     child would no longer report a natural size taller than it). */
  body:not(.mode-database) .sb-content-block { height: 100%; }
  /* flex: 1 1 50% on BOTH panes — equal grow AND equal shrink from an equal
     50% basis — is what makes the split exactly 50/50 regardless of actual
     content amount (a short departure list still gets the full 50% height,
     empty space and all, per instruction) rather than sizing to content.
     min-height: 0 is required on a flex item for its own overflow-y:auto to
     actually clip/scroll instead of the item just growing to fit content. */
  .sb-dep-pane, .sb-news-pane { flex: 1 1 50%; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .sb-news-pane { border-top: 0.5px solid var(--br); }

  /* The map LEGEND (National Rail / Metro/LRT / Heritage / Closed) was removed
     on 2026-07-27, together with the Database-mode panel that held it and its
     collapse toggle. It dated from the original four-colour map: routes are now
     coloured per operator, and hovering or clicking one names it directly, so a
     four-category key described something the map no longer draws — misleading
     rather than merely redundant.
     Everything that existed only to serve it went with it: #db-legend and its
     mobile override, .hp-head / .hp-title / #hp-toggle, .legend-items /
     .legend-item / .legend-line and its .closed and .heritage pattern variants,
     and the wireDbLegend() IIFE. The --heritage :root token went too — the
     legend swatch was its only reader; the map takes heritage's colour straight
     from data/operator-colors.json. (.hp-body / .hp-era had already been
     removed earlier as orphans of the year slider that used to share this
     panel.)
     KNOWN GAP, accepted and recorded rather than worked around: two things the
     legend carried are line PATTERNS, not colours, so hover cannot explain them
     — Closed (dashed) and Heritage (dotted). Flagged for a future map UI pass;
     deliberately not replaced here. */

</style>
</head>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
<script>
(function () {
  'use strict';

  // ── Railway vector tiles (Prompt 3 — replaces the old OpenRailwayMap raster
  // overlay) ─────────────────────────────────────────────────────────────
  // Served from R2's r2.dev testing subdomain — rate-limited, dev-only.
  // Swap for a custom domain (e.g. tiles.srhq.uk) before production launch.
  var PMTILES_URL = 'https://pub-f3c70a3d45aa443d81dab5db7f762d2a.r2.dev/gb-railways.pmtiles';
  // Phase 5 — operator-colored rail lines. Built via tile-generation/
  // build-operator-tiles.sh from scripts/output/line-segments.json (the
  // Phase 2 segment graph); see LINE-COLORING-RUNBOOK.md for the full
  // pipeline. Same R2 bucket/CORS setup as gb-railways.pmtiles above.
  var OPERATOR_TILES_URL = 'https://pub-f3c70a3d45aa443d81dab5db7f762d2a.r2.dev/operators.pmtiles';
  var pmtilesProtocolRegistered = false;
  function ensurePmtilesProtocol() {
    if (pmtilesProtocolRegistered || typeof pmtiles === 'undefined') return;
    maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
    pmtilesProtocolRegistered = true;
  }

  // ── Which operators actually HAVE track in the tileset ────────────────────
  // Read from the PMTiles archive's own metadata, NOT by querying rendered
  // features. tippecanoe writes a `tilestats` block listing every distinct
  // value of each attribute (capped at 100 values per attribute); `operators`
  // has 54 distinct values, so the list is COMPLETE rather than truncated —
  // verified against the built archive. That makes this an exact answer to
  // "does this operator have any segments at all", available from one small
  // range request at load time, with no tiles rendered and no camera movement.
  //
  // Why it matters: a search for an operator with no track (XR before the
  // 2026-07-28 relabel; GN/GX/TL/LN, whose services are tagged in OSM under a
  // parent company; HT, genuinely absent) used to jump the camera to the whole-
  // UK view to force tile loading, then find nothing and stop — stranding the
  // user at a zoom they never asked for and giving no reason. Knowing the
  // answer BEFORE that jump means the failing case now moves the camera zero
  // times, rather than moving it and moving back.
  var operatorTilesetKeysPromise = null;
  function operatorTilesetKeys() {
    if (operatorTilesetKeysPromise) return operatorTilesetKeysPromise;
    operatorTilesetKeysPromise = (function () {
      if (typeof pmtiles === 'undefined' || !pmtiles.PMTiles) return Promise.resolve(null);
      try {
        return new pmtiles.PMTiles(OPERATOR_TILES_URL).getMetadata().then(function (meta) {
          var ts = meta && meta.tilestats;
          if (typeof ts === 'string') { try { ts = JSON.parse(ts); } catch (e) { return null; } }
          if (!ts || !ts.layers) return null;
          for (var i = 0; i < ts.layers.length; i++) {
            var attrs = ts.layers[i].attributes || [];
            for (var j = 0; j < attrs.length; j++) {
              if (attrs[j].attribute !== 'operators') continue;
              var vals = attrs[j].values || [];
              // If tippecanoe truncated the list (distinct count > values
              // listed), it is no longer authoritative for ABSENCE — a key
              // missing from a truncated list may still have track. Return null
              // so callers fall back to the old behaviour rather than wrongly
              // reporting "no route data".
              if (attrs[j].count && attrs[j].count > vals.length) return null;
              var set = {};
              vals.forEach(function (v) { set[v] = true; });
              return set;
            }
          }
          return null;
        }).catch(function () { return null; });
      } catch (e) { return Promise.resolve(null); }
    })();
    return operatorTilesetKeysPromise;
  }
  // Warmed at startup so the first operator search doesn't pay for the round
  // trip. Failure is silent and non-blocking — callers treat null as "unknown"
  // and keep the previous behaviour.
  operatorTilesetKeys();

  // Operators whose services ARE on the map, but tagged in OSM under a parent
  // company rather than their own brand, so they have no key of their own. This
  // is not an error and the panel says so by name. See CLAUDE.md's note on the
  // "Greater Thameslink Railway" finding for why OSM tags them this way.
  //
  // GN/GX/TL/SN REMOVED 2026-08-05 — they are no longer folded. The four GTR
  // sub-brands now carry their own segments (SN 509, TL 290, GN 88, GX 45) and
  // their own colours, split out of the parent by route-relation name prefix and
  // operator tag (scripts/split-subbrand-segments.mjs). Leaving them here would
  // have been actively wrong in two places: the panel would claim they have no
  // track of their own, and the highlight would redirect to GTR — which now has
  // ZERO segments, so selecting Southern would have highlighted nothing at all.
  //
  // LN stays: London Northwestern really does still have no track of its own.
  // Its OSM relations exist and carry an `LNWR:` name prefix, so the same split
  // would work — that is queued, not done.
  var OPERATOR_FOLDED_INTO = {
    LN: 'WMR',
  };
  // Set only by submitOperatorPick(), once the metadata above has CONFIRMED the
  // operator has no track — never while that lookup is in flight, so a slow
  // fetch cannot flash a false negative. Cleared by selectOperator() on every
  // new selection, so the notice can never outlive the operator it describes.
  // Declared here beside OPERATOR_FOLDED_INTO rather than next to its writer,
  // so neither reader has to rely on `var` hoisting across the file.
  var operatorNoTrackCode = null;

  var stationsData = null;   // parsed /data/stations.geojson, ids assigned
  var stationInteractionsWired = false;
  var operatorLineInteractionsWired = false;
  var bearingIconWired = false;
  // Same one-time-binding contract as the three above. ensureHistoryLayers()
  // now re-runs on every theme toggle (setStyle wipes runtime layers), so the
  // map.on() handlers inside it MUST be guarded or each toggle would stack
  // another set — which is precisely the progressive slowdown reported.
  var historyInteractionsWired = false;
  // Whether History layers have ever been added. Used to keep them LAZY: a
  // user who never opens History should not pay for the historical tileset,
  // but once they have, addMapLayers() must restore it on every style rebuild.
  var historyLayersEverAdded = false;
  // ── Reverse color-reveal (Phase 2, 2026-07-21) ────────────────────────────
  // lockedOperatorHighlight persists across mouseleave (click/tap, or a
  // Regions chip click); hoveredOperatorHighlight is the transient desktop
  // hover-only signal, cleared on mouseleave. Both can be active
  // simultaneously and are colored independently (2026-07-22 — see
  // applyOperatorHighlightPaint()'s comment) rather than locked always
  // winning, so hovering a different route while one is locked previews it
  // too instead of doing nothing.
  var lockedOperatorHighlight = null;
  var hoveredOperatorHighlight = null;
  // ── Heritage highlight state (2026-08-03) ────────────────────────────────
  // DELIBERATELY SEPARATE VARIABLES, not a tag on lockedOperatorHighlight.
  //
  // The two cannot share one slot, because they are not the same kind of key.
  // lockedOperatorHighlight holds an `operators` tag value and every filter
  // built from it is ['in', ['get', 'operators'], …]. EVERY heritage segment in
  // the tileset carries the identical operators value 'Heritage', so that key
  // cannot name one railway — per-railway selection has to filter on
  // `heritage_slug` instead (confirmed present in operators.pmtiles: 169
  // distinct values alongside heritage_type/heritage_type_secondary). Two
  // different property names means two different filter shapes, so one scalar
  // could not express both even if the semantics allowed it.
  //
  // The semantics don't allow it either: the spec requires a national lock to
  // be "completely unaffected by any heritage highlight state", i.e. the two
  // coexist. A single tagged variable would make them mutually exclusive.
  //
  // So applyOperatorHighlightPaint() below was generalised from "at most two
  // active operators" to "a list of active groups", each group carrying its own
  // filter condition and colour. That is an extension of the existing paint
  // path, not a second one — hover, click-lock, region chips, search picks and
  // now heritage all still resolve through that one function.
  var heritageHighlightAll = false;  // #heritage-btn — every heritage railway lit at once
  var lockedHeritageSlug = null;     // a single railway, locked by clicking its line
  var hoveredHeritageSlug = null;    // transient desktop hover, cleared on mouseleave
  var initialCameraVerified = false; // see verifyInitialCameraPosition() below
  // ── User-gesture counter (2026-07-27) ────────────────────────────────────
  // Bumped ONLY by camera moves the user started themselves. MapLibre attaches
  // the triggering DOM event as `originalEvent` on movestart/zoomstart for real
  // gestures (wheel, drag, pinch, keyboard) and omits it for programmatic
  // flyTo/easeTo/jumpTo — that is the documented discriminator, and it is what
  // stops the watchdog below reacting to its own corrections.
  //
  // Exists because two things in this file move the camera on a TIMER, several
  // seconds after the event that scheduled them, and neither had any way to
  // tell "the camera drifted / the tiles finally loaded" from "the user is
  // scrolling right now". Both are read below; see their own comments.
  var userCameraGestureSeq = 0;
  function noteUserCameraGesture(e) { if (e && e.originalEvent) userCameraGestureSeq++; }

  // A real, if intermittent, MapLibre race confirmed via headless testing
  // (2026-07-15): shortly after map creation, the camera occasionally
  // settles away from the constructor's own center/zoom (e.g. observed
  // drifting from the intended [-2.5,54.5]/z5.5 to [-3.25,55.67]/z4.89 with
  // no code anywhere requesting that position) — root cause not fully
  // pinned down (suspected: the remote Stadia style JSON loads
  // asynchronously and something in that path re-triggers a transform
  // recalculation), but NOT a tile-loading or tippecanoe-feature-dropping
  // issue as first suspected. Consequence: a drifted zoom can land below
  // operators.pmtiles' minzoom (5), so the ENTIRE base rail-line layer
  // renders nothing — this is what the original "no track lines on the
  // Live map" bug report was actually seeing, and it silently persisted
  // through the Phase 5 rendering rebuild since Phase 5 never touched
  // camera/viewport code. Fix: re-assert the known-good literal
  // mapInitCenter/mapInitZoom (NOT getCenter()/getZoom(), which could
  // already reflect the drift) a few times over the first few seconds after
  // load, since testing showed the drift isn't perfectly synchronous either.
  //
  // 2026-07-27 — THE SNAP-BACK BUG. This is a jumpTo (instant, uninterruptible)
  // on a 500ms timer for the first ~3 seconds after load, and its "has the
  // camera moved?" test was a bare distance check: anything more than 0.3 zoom
  // levels or 0.3 degrees from the initial view counted as drift. A user
  // scroll-zooming in those first seconds trips that on every tick and gets
  // yanked back to z5.5 — which is exactly the reported "jumps back to the
  // previous zoom level", and why COASTING made it worse: an inertial scroll
  // stays in motion across several 500ms ticks where discrete clicks usually
  // land between them.
  // The watchdog cannot tell drift from intent by looking at the camera alone,
  // so it now asks who moved it. One real user gesture retires it for good:
  // past that point the user owns the camera, and a stale anti-drift
  // correction is strictly worse than the drift it was guarding against.
  function verifyInitialCameraPosition(attempt) {
    attempt = attempt || 1;
    if (initialCameraVerified || !map) return;
    if (userCameraGestureSeq > 0) { initialCameraVerified = true; return; }
    var z = map.getZoom(), c = map.getCenter();
    var drifted = Math.abs(z - mapInitZoom) > 0.3 || Math.abs(c.lng - mapInitCenter[0]) > 0.3 || Math.abs(c.lat - mapInitCenter[1]) > 0.3;
    if (drifted) map.jumpTo({ center: mapInitCenter, zoom: mapInitZoom });
    if (attempt >= 6) { initialCameraVerified = true; return; }
    setTimeout(function () { verifyInitialCameraPosition(attempt + 1); }, 500);
  }
  var incidents = [];
  var activeFilter = 'all';
  var mode = 'database';
  // Hidden by default (2026-07-21 feedback — the base rail network reads as
  // "busy" and competes with the operator-colored routes users actually
  // interact with) — still toggleable back on via #layers-btn, just an
  // opt-in now instead of opt-out. Scope unchanged: still railway-lines/
  // railway-lines-closed only, not the operator-colored layers.
  var ormVisible = false;
  var currentStadiaKey = '';

  // ── Station list (autocomplete + map markers) ─────────────────────────────
  // /station-list.json is the full UK station list — [{name, crs, lat, lon}],
  // ~2,637 entries, already the site's client-side stand-in for the NaPTAN
  // data living in Postgres (see stations-content.json's own _notes: "Lat/
  // lon/tiploc already live in Postgres — don't duplicate here"; there's no
  // live DB query from the client anywhere in this app, per CLAUDE.md's
  // API-key rule, so this static export IS how that data reaches the map).
  // Was autocomplete-only; now also the source for the full station-marker
  // layer below (previously only /data/stations.geojson's 53-station
  // curated subset ever got a marker at all). Loaded once up front and
  // cached; stored as a promise too so the marker-building code below can
  // wait on the exact same fetch instead of firing a second request.
  var stationList = [];
  var stationListPromise = fetch('/station-list.json').then(function (r) {
    if (!r.ok) throw new Error('station-list.json missing');
    return r.json();
  }).then(function (data) {
    stationList = Array.isArray(data) ? data : [];
    return stationList;
  }).catch(function (e) {
    console.warn('station-list.json unavailable — autocomplete falls back to loaded map markers/stub', e);
    return [];
  });

  // Small hardcoded fallback so autocomplete is testable even before
  // station-list.json AND stations.geojson have loaded (first paint).
  var STATION_STUB = [
    { name: 'London Paddington', crs: 'PAD', lat: 51.5154, lon: -0.1755 },
    { name: 'London Kings Cross', crs: 'KGX', lat: 51.5308, lon: -0.1238 },
    { name: 'Manchester Piccadilly', crs: 'MAN', lat: 53.4773, lon: -2.2309 },
    { name: 'Birmingham New Street', crs: 'BHM', lat: 52.4778, lon: -1.8998 },
    { name: 'Leeds', crs: 'LDS', lat: 53.7960, lon: -1.5488 },
    { name: 'Edinburgh Waverley', crs: 'EDB', lat: 55.9522, lon: -3.1900 },
    { name: 'Glasgow Central', crs: 'GLC', lat: 55.8586, lon: -4.2579 },
    { name: 'Bristol Temple Meads', crs: 'BRI', lat: 51.4495, lon: -2.5813 },
    { name: 'Liverpool Lime Street', crs: 'LIV', lat: 53.4075, lon: -2.9779 },
    { name: 'Cardiff Central', crs: 'CDF', lat: 51.4761, lon: -3.1793 },
  ];
  function getStationList() {
    if (stationList.length) return stationList;
    if (stationsData) {
      return stationsData.features.map(function (f) {
        return { name: f.properties.name, crs: f.properties.crs, lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] };
      });
    }
    return STATION_STUB;
  }

  // ── Lazy JSON fetch (2026-08-13) ──────────────────────────────────────────
  // Every fetch above (station-list.json included) is EAGER — a module-level
  // `var xPromise = fetch(...)` fired unconditionally near page load. This
  // factory is the first thing in this file that ISN'T: it defers the actual
  // network request until something calls the function it returns, and
  // memoizes the PROMISE (not just a "started" boolean) so a second call
  // made WHILE THE FIRST FETCH IS STILL IN FLIGHT — e.g. entering History
  // mode and immediately typing a search query — returns that same pending
  // promise instead of firing a duplicate request or racing it. Once
  // resolved (or failed — see `fallback`), every later call resolves
  // immediately from the cached promise.
  //
  // Written as a small reusable factory rather than inlined once, on
  // request: a broader lazy-loading pass across the site is planned
  // separately, and whatever it defers next should be able to reuse this
  // exact shape rather than reinventing it. Nothing else in this file has
  // been converted to it in this pass — only the one new fetch below uses
  // it, deliberately, per instruction not to touch any existing eager fetch.
  //
  // `fallback` on failure (never a rejected promise) matches how every OTHER
  // JSON fetch in this file already degrades — e.g. station-list.json's own
  // .catch() above resolves to `[]` rather than throwing, so callers never
  // need their own try/catch for "the data just isn't there yet/ever".
  function lazyJsonFetch(url, fallback) {
    var promise = null;
    return function () {

    // feature-state; both long since replaced by applyOperatorHighlightPaint(),
    // see its own comment; the single-layer version was replaced by this
    // multi-ring one on 2026-07-22, see GLOW_RINGS' comment for why). Each
    // ring's own line-blur is untested at real ~10,628-feature-SOURCE scale
    // in an actual browser (no browser in this environment) — though since
    // every ring is filtered down to a couple of features at a time, not
    // the full source, this isn't expected to cost meaningful frame rate.
    GLOW_RINGS.forEach(function (ring, i) {
      if (map.getLayer('operator-lines-hover-glow-' + i)) return;
      map.addLayer({
        id: 'operator-lines-hover-glow-' + i, type: 'line', source: 'operator-vector', 'source-layer': 'operators',
        // Filtered down to (usually) zero features until applyOperatorHighlightPaint()
        // sets a real filter below — see that function's comment for why
        // this is filtered rather than just left at opacity 0 like before:
        // it also keeps this off the render path entirely for the ~10,628
        // un-highlighted features rather than paying for a blurred line on
        // all of them at zero opacity.
        filter: NO_OPERATOR_FILTER,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': MULTI_OPERATOR_NEUTRAL[currentTheme()], // placeholder until applyOperatorHighlightPaint() runs below
          'line-width': operatorLineWidthExpression(ring.widthMultiplier),
          'line-blur': ring.blurPx,
          'line-offset': operatorLineOffsetExpression(),
          'line-opacity': ring.opacity, // fixed per ring for its whole lifetime — only filter/color change dynamically, see applyOperatorHighlightPaint()
          // MapLibre paint properties animate by default (~300ms) on every
          // setPaintProperty() call unless a layer opts out — since
          // applyOperatorHighlightPaint() calls setPaintProperty('line-color',
          // ...) on every hover change, that default transition meant hovering
          // a NEW route visibly cross-faded FROM whatever was previously
          // shown (the last locked/hovered route's color) TO the new one,
          // reading as "briefly shows the old route's color first" (2026-07-22
          // bug report). Zero-duration transition makes color changes
          // instant instead.
          'line-color-transition': { duration: 0 },
        },
      });
    });
    // One grey layer PER route tier (trunk/regional/hyperlocal — see
    // ROUTE_TIERS's comment) instead of a single always-visible
    // 'operator-lines' layer, so each category gets its own minzoom.
    // Filtered by routeTierFilterById, which starts as "trunk shows
    // everything, regional/hyperlocal show nothing" until
    // computeRouteTierFilters() (called from the operator-colors.json
    // loader, and again below in case that already resolved before this
    // first run) replaces it with the real category split.
    ROUTE_TIERS.forEach(function (t) {
      var basePaint = {
        'line-color': rc.railwayMain, // always flat grey now — see applyOperatorHighlightPaint()'s comment
        'line-width': operatorLineWidthExpression(ROUTE_BASE_WIDTH_MULTIPLIER),
        'line-offset': operatorLineOffsetExpression(),
      };
      // Only the heritage tier declares one — see ROUTE_TIERS. The dash rides
      // on the layer, so heritage reads as dotted in its resting grey state
      // AND wherever it is coloured (History's modern band paints these same
      // tier layers), not only when highlighted.
      if (t.dash) basePaint['line-dasharray'] = t.dash;
      // The LINE half of the dot->line cross-fade, heritage bands only. Safe to
      // set here because line-opacity is otherwise UNUSED on these tier layers:
      // the reverse colour-reveal works entirely through line-color (flat grey
      // resting, swapped per-operator) plus the separate 'operator-lines-active'
      // overlay, and never touches opacity. So this composes with the highlight
      // mechanism rather than fighting it — applyOperatorHighlightPaint() will
      // keep setting line-color on this layer and the fade rides underneath.
      if (t.lineOpacity) basePaint['line-opacity'] = t.lineOpacity;
      addLayerOnce({
        id: 'operator-lines-' + t.id, type: 'line', source: 'operator-vector', 'source-layer': 'operators',
        filter: routeTierFilterById[t.id],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: basePaint,
      }, t.minzoom);
    });
    // Crisp, real-color line for whichever operator(s) are active, filtered
    // down to just those features and added AFTER every 'operator-lines-*'
    // tier layer so it always draws on top of every grey feature regardless
    // of tile order — see applyOperatorHighlightPaint()'s comment for the
    // junction-coverage bug this fixes. Deliberately NOT split by route
    // tier like the grey layers above (no minzoom of its own) — once a
    // highlight is locked, keeping it visible across the whole zoom range
    // reads as "show me where this route goes," not a bug; only its own
    // grey/context layer disappearing below its tier's minzoom is tier-
    // gated. Same offset as the base layers, but its OWN (3x) width — see
    // ROUTE_ACTIVE_WIDTH_MULTIPLIER's comment — only line-color (and the
    // filter) are ever touched afterward.
    if (!map.getLayer('operator-lines-active')) {
      map.addLayer({
        id: 'operator-lines-active', type: 'line', source: 'operator-vector', 'source-layer': 'operators',
        filter: NO_OPERATOR_FILTER,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': rc.railwayMain, // placeholder, applyOperatorHighlightPaint() below sets the real color before anything can match the filter
          'line-width': operatorLineWidthExpression(ROUTE_ACTIVE_WIDTH_MULTIPLIER),
          'line-offset': operatorLineOffsetExpression(),
          // Same zero-duration override as operator-lines-hover-glow above,
          // same reason — this is the layer that actually showed the stale-
          // color flash on hover, since it's the crisp on-top line.
          'line-color-transition': { duration: 0 },
        },
      });
    }
    // Re-applies grey-default-or-highlighted paint on every addMapLayers()
    // run (first load AND every theme toggle, since setStyle wipes and
    // re-adds these layers) — reads currentTheme()/themeColors() fresh each
    // time, and re-asserts whatever's currently hovered/locked (Phase 2
    // highlight state lives in JS vars, not the wiped-per-toggle style, so
    // it survives a theme switch unlike the old feature-state approach).
    applyOperatorHighlightPaint();
    // Invisible, generously-wide hit layer over the exact same (offset)
    // geometry as the visible line above — hover/click are wired against
    // THIS layer, not 'operator-lines-*' itself, since the real line only
    // renders a few px wide (see operatorLineWidthExpression) and MapLibre
    // hit-tests against actual rendered width, not some built-in tolerance.
    // A precise cursor sitting a couple of px off the thin line otherwise
    // never registers as a hover at all, which is what was producing the
    // "grab cursor even directly over a route" symptom. Same source +
    // source-layer + promoteId as 'operator-lines-*', so feature-state set
    // via a feature id read from THIS layer still correctly drives the
    // visible layer's own hover-based paint — feature-state is keyed by
    // source/id, not by which layer queried it. One per route tier too, and
    // with the SAME minzoom as its matching grey layer — otherwise a
    // not-yet-revealed regional/hyperlocal line would still register clicks
    // in empty-looking space, which is worse than just not being visible.
    ROUTE_TIERS.forEach(function (t) {
      addLayerOnce({
        id: 'operator-lines-hit-' + t.id, type: 'line', source: 'operator-vector', 'source-layer': 'operators',
        filter: routeTierFilterById[t.id],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#000000',
          'line-opacity': 0,
          // WIDER FOR HERITAGE (2026-08-04). 18 px is right for a National Rail
          // route that runs for miles across the viewport; it is not enough for
          // a preserved line. Measured at each band's own first-visible zoom,
          // the MEDIAN heritage railway is 6 px long (micro), 10 px (local) or
          // 12 px (regional) — Tanat Valley Light Railway, the reported case, is
          // 11 px at z9 and its longest single SEGMENT is 8 px. Reported as
          // "cannot trigger hover tooltip"; the data, filters and tiles are all
          // correct (verified in the tileset: operators="Heritage",
          // heritage_slug and band all present at every zoom) — the target was
          // simply too small to land on.
          //
          // Width helps LENGTH too, which is the binding constraint here: these
          // layers use line-cap round, so the cap extends the hit area by half
          // the width beyond each end. At 18 px an 11 px line is ~29 px of
          // grabbable axis; at 30 px it is ~41 px. Raising the band minzooms
          // instead would have worked too, and was rejected — that would put
          // every micro railway on screen at national zoom, which is the
          // clutter the bands exist to prevent.
          'line-width': t.id.indexOf('heritage-') === 0 ? 30 : 18,
          'line-offset': operatorLineOffsetExpression(),
        },
        // HERITAGE HIT LAYERS IGNORE THEIR BAND'S MINZOOM (2026-08-04).
        //
        // The glow rings and 'operator-lines-active' are added with NO minzoom
        // at all, so a highlighted heritage line renders at every zoom — but its
        // hit layer inherited the band minzoom (local z9, micro z11). Below
        // that, the user sees a glowing heritage line and cannot hover it,
        // which is the "smaller railways still not responding on hover at low
        // level" report. Widening the stroke to 30px last round did not touch
        // this, because the layer was not on the map to be hit at all.
        //
        // Pinned to 7.5 — the lowest heritage band minzoom — so hit coverage
        // starts where the earliest heritage line can appear and is uniform
        // across all four bands.
        //
        // The usual objection to a hit layer outrunning its visible line is
        // "invisible but clickable is worse than absent". It does not apply
        // here: hovering one of these produces a NAMED TOOLTIP for a real
        // railway, so the interaction explains itself rather than being a dead
        // zone. The visible tier minzooms are untouched, so nothing new is
        // drawn and no clutter is added.
      }, t.id.indexOf('heritage-') === 0 ? 7.5 : t.minzoom);
    });
    if (!operatorLineInteractionsWired) { wireOperatorLineInteractions(); operatorLineInteractionsWired = true; }
    if (!bearingIconWired) { wireBearingIcon(); bearingIconWired = true; }
    // History-mode layers go through this same single re-apply path, per this
    // function's own rule above ("anything added at runtime gets its
    // re-add/re-color logic here, in this function, only"). They were the one
    // runtime layer set that broke that rule, which is why they alone did not
    // survive a theme toggle. Only re-added once the user has actually entered
    // History mode, so the historical tileset stays lazy for everyone else.
    // A hovered or LOCKED segment cannot survive a style rebuild — their glow
    // filter refers to layers that no longer exist. Same for a hovered station.
    hoveredHistoryFeature = null;
    lockedHistoryFeature = null;
    lockedHistoryFeatureSpan = null;
    hoveredHistoryStation = null;
    if (historyLayersEverAdded) { historyLayersReady = false; ensureHistoryLayers(); }

    // stationsData is built once by the Promise.all() below (station-list.json
    // + the major-station set both need to resolve first) — if it beat the
    // map to being ready, add it now; if not, that promise handler adds it
    // itself the moment it resolves (it has its own map.isStyleLoaded() guard
    // for the reverse ordering). Either way, this branch never fetches on its
    // own any more — see the comment above stationListPromise.
    if (stationsData) {
      addStationsLayer(stationsData);
    }
    // Nothing heritage-specific is added or re-applied here any more. Dot layers
    // were added at this point until 2026-08-02; a visibility re-apply replaced
    // them until 2026-08-03, when heritage lines became permanently visible.
    // The heritage line tiers are created by the ROUTE_TIERS loop further up this
    // same function like any other tier, and applyOperatorHighlightPaint() at the
    // end of that loop already restores highlight state after a style rebuild.

    // Same setStyle-wipes-runtime-layers issue as railway-vector/stations
    // above — redraw the route highlight (Task 2) if one is currently
    // selected, so it survives a theme toggle. Geometry-only re-apply (no
    // camera fly) — this path also runs on the INITIAL page load
    // (map.on('load', addMapLayers)), which shouldn't move the viewport
    // out from under the user either.
    if (selection.type === 'route' && selection.id) renderRoutePolylineGeometry(selection.id);
    // Phase 6: same re-apply, for a From/To pathfinding result — redraws
    // from the CACHED resolved geometry only (no re-fetch, no re-fly), a
    // no-op if nothing's resolved yet (still loading, or no route found).
    if (selection.type === 'fromto') renderFromToPolylineGeometry();
    renderSelectedStationMarkers();
  }

  // ── Three-tier marker sizing (2026-07-14) ─────────────────────────────────
  // Major (top ~53, curated) / Mid (4+ platforms, stations-content.json) /
  // Minor (everything else, ~2,319) — tiers now differ ONLY by WHEN they
  // appear (zoom-staggered reveal below), not how big they are. Previously
  // had a size gradient (major > mid > minor) on top of the staggered
  // reveal, but user feedback after seeing it live was to unify all three
  // to the mid tier's size (e.g. Tamworth, Salisbury) — mid's radius/stroke
  // is the one shared paint every tier's circle layer now uses.
  //
  // 2026-07-27: this is now THE ONE definition of what a station dot looks
  // like, shared verbatim by Live, Database AND History. History used to carry
  // a parallel paint block of its own (smaller radius ramp, stroke-width 1,
  // and an ERA-TINTED stroke colour) which is how the three tabs drifted into
  // rendering visibly different dots at the same place and zoom — see
  // applyHistoryPaint()'s comment for the stale-band bug that tinting also
  // caused. `hoverExpr` is the ONLY thing a caller may vary, and only because
  // the historical tiles cannot use feature-state the way the live geojson
  // source does (no promoted id — see applyHistoryHighlightPaint()'s note on
  // why this file keys historical highlights off a property instead). History
  // passes a constant `false` here and draws its hover state as a separate
  // filtered overlay layer using this same function with `true`, so the two
  // states still come from one place. Radius/fill/stroke/width are NOT
  // parameterised and must not become so.
  function stationsCirclePaint(hoverExpr) {
    var c = themeColors();
    // Explicit undefined check, not `||` — `false` is a legitimate value here
    // (History's resting layer passes it) and would otherwise fall through to
    // the feature-state default against a source that has no feature state.
    if (hoverExpr === undefined) hoverExpr = ['boolean', ['feature-state', 'hover'], false];
    return {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 7, 2.8, 12, 4.0],
      // 2026-07-18: hover used to be a translucent stationHoverFill wash
      // (rgba turquoise at low opacity) with a thicker turquoise stroke —
      // itself a variant of the same "ring with a barely-there center"
      // look that the selected marker had. Hover now switches to a solid
      // c.accent fill at this layer's own normal (not 200%-enlarged)
      // radius — an unambiguous solid dot on hover, not the old translucent
      // wash. The stroke stays on for hover too (bumped to 2.2, same width
      // as before this pass) — dropping it entirely made the hover dot
      // read as noticeably smaller despite the separate hover-glow halo
      // behind it; since stroke draws OUTSIDE circle-radius (total visual
      // size = radius + stroke-width) and is the same accent color as the
      // fill, it reads as one solid, slightly larger dot rather than a
      // visible ring — same fill/stroke color, just no longer a hollow
      // center underneath it. Resting (non-hover) state is untouched: dark
      // fill + turquoise stroke, per CLAUDE.md's marker spec.
      //
      // ONE colour for every station, CRS or not (2026-08-02 revert). Non-CRS
      // stops (Underground/DLR/tram/metro/subway) briefly had their own
      // "class colour" here — a lavender/indigo pair keyed off the `mode`
      // property — on the reasoning that a marker identical to its neighbours
      // promises departures those stops cannot serve. Reverted: the mode
      // distinction is carried by the panel that opens on tap (which says so
      // in words), not by a second dot colour competing with the operator line
      // colours already on screen at the same zoom. c.accent is the turquoise
      // CRS accent (#40E0D0 dark / #1A9E8F light) and is now unconditional, so
      // the History layers — whose source carries no `mode` property at all —
      // no longer depend on a coalesce default to keep their stroke.
      'circle-color': ['case', hoverExpr, c.accent, c.stationFill],
      'circle-stroke-width': ['case', hoverExpr, 2.2, 1.5],
      'circle-stroke-color': c.accent,
    };
  }
  // Phase 7 — the selected-station marker (SELECTED_STATIONS_LAYER_ID, a
  // separate GeoJSON layer drawn on top of the regular tiered markers,
  // covering both the single-station-select case and each From/To
  // endpoint — see setSelectedStationPoints()) at 200% of the base circle
  // size, same zoom-scaling shape as stationsCirclePaint() so it stays
  // proportionally consistent at every zoom rather than a fixed pixel
  // size that would look right at one zoom and wrong at others. Radius
  // doubled (7,2.8->5.6 / 12,4.0->8.0), same 2x scale as before. Solid
  // turquoise fill (c.accent), no stroke (previous version used the dark
  // stationFill + turquoise stroke combo shared with the regular unselected
  // dots — dropped here so a SELECTED station reads as an unambiguous
  // solid mark, not just "a regular dot with a thicker ring"). 2026-07-18:
  // briefly tried c.stationFill (dark-in-dark-theme/light-in-light-theme
  // neutral) here instead, on the theory that a same-hue dot+ring combo was
  // what made the marker look hollow in a screenshot — reverted immediately
  // after confirming live in dark theme that c.stationFill is
  // rgba(7,9,12,0.9), i.e. nearly the exact color of the dark basemap
  // itself, which made the dot genuinely disappear against the map and
  // reproduced an even more literal version of the same hollow-ring look
  // (just a thin ring outline, near-invisible center) — a real regression,
  // not a fix. c.accent already renders as a solid, fully opaque disc (see
  // this session's own earlier verification screenshots) — whatever caused
  // the hollow look in that report, a same-hue dot+glow wasn't it; the
  // stroke-based old design (before this feature existed at all) is the
  // more likely source of what that screenshot was actually showing.
  // circle-opacity is driven imperatively (see
  // setSelectedStationPoints/syncSelectedMarkerLayers below), not by a
  // feature-state case here — this layer only ever holds 0-2 features, all
  // sharing the same selected/not-yet-visible state at any moment, so a
  // plain constant + `-transition` is all that's needed for a smooth fade
  // rather than an instant pop when a station is selected/deselected. No
  // hover feature-state here (unlike stationsCirclePaint) — this layer
  // isn't wired for mouse hover, so those case branches would just be
  // permanently-dead code.
  function selectedStationCirclePaint() {
    var c = themeColors();
    return {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 7, 5.6, 12, 8.0],
      'circle-color': c.accent,
      'circle-stroke-width': 0,
      'circle-opacity': 0,
      'circle-opacity-transition': { duration: 320 },
    };
  }
  // Ring behind the solid dot above — same source/points, added as its own
  // layer (BELOW the dot in addLayer's stacking order, so the dot renders
  // on top of its own ring) rather than folded into one layer, since it
  // needs its own independent radius/opacity/blur the solid dot doesn't
  // share. circle-blur softens the edge into a genuine glow rather than a
  // hard-edged ring outline. radius/opacity start at 0 here and are driven
  // entirely by tickSelectedMarkerRing's per-frame animation loop below —
  // deliberately NO circle-radius-transition/circle-opacity-transition on
  // this layer (unlike the dot layer just below it): the ring computes an
  // exact value every animation frame itself, and a built-in MapLibre paint
  // transition layered on top of that would fight/lag the deliberately
  // abrupt reset-to-start-of-cycle moment (ring snaps back to the dot's
  // edge at full opacity, then starts expanding again), producing a
  // stutter instead of a clean repeating ripple. The dot layer's own
  // opacity transition already carries the "smooth, not instant" select/
  // deselect feel on its own — the ring is a separate ambient effect on
  // top of that, so its own instantaneous start/stop isn't relied on for
  // that requirement.
  function selectedStationGlowPaint() {
    var c = themeColors();
    return {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 7, 5.6, 12, 8.0],
      'circle-color': c.accent,
      // 2026-07-18: was 0.55 — read as too faint/washed-out to notice live
      // once the ring's own radius growth was widened to 2.5x (more blur
      // spread over a bigger area reads as even softer, not stronger).
      // Lower blur keeps the expanding band's edge crisp enough to actually
      // register as "a ring," not just a vague halo.
      'circle-blur': 0.2,
      'circle-opacity': 0,
    };
  }
  // 2026-07-22 rewrite (was 3 tiers: major/mid/minor by platform count only)
  // — see computeStationTiers() below for why platform count alone isn't a
  // great proxy for "should this reveal early." STATION_TIERS is the single
  // ordered source of truth every station-layer-adding loop reads from:
  // earliest-revealing tier first, 'major' always has minzoom undefined
  // (always visible, unchanged from before).
  var STATION_TIERS = [
    { id: 'major', minzoom: undefined },
    { id: 'large', minzoom: 6 },
    { id: 'medium', minzoom: 7.5 },
    { id: 'small', minzoom: 9 },
    // 2026-07-27: was 11. Lowered to 10 so the densest tier reveals one zoom
    // step earlier. This array is the SINGLE definition of the station tiers —
    // Live and Database read it directly, and History derives
    // HISTORY_STATION_TIERS from it by concat — so this one number moves the
    // dot layer, the hit layer AND the label layer in all three tabs at once.
    { id: 'dense', minzoom: 10 },
    // Phase 3 — non-CRS stations are tiered by MODE, not by the platform/density
    // ranking below, and each mode is pinned to the zoom its own network's LINES
    // already appear at (ROUTE_TIERS: regional 7.5, hyperlocal 10) so a line and
    // its stops reveal together instead of the line arriving first and running
    // empty.
    //
    // 2026-08-04: mode-regional was 7.5, pinned to its LINES' reveal zoom on the
    // reasoning that a line and its stops should arrive together. Reverted to 10
    // after seeing it live — reported as light-rail/metro stops showing at
    // national zoom. The line-parity argument was the wrong one: a tram network
    // is geographically tiny and very dense, so at z7.5 its stops collapse into
    // an unreadable blob over one city while the surrounding National Rail
    // network is still showing only its majors. Density, not line parity, is
    // what should set a station tier's zoom — which is the rule the CRS tiers
    // already follow. Both mode tiers now sit with 'dense'.
    //
    // The two tiers are deliberately NOT merged even though they now share a
    // zoom: they still carry the mode split (MODE_STATION_TIER), and keeping
    // them separate means a future change to one network family does not need
    // the tier structure rebuilt.
    { id: 'mode-regional', minzoom: 10 },
    { id: 'mode-hyperlocal', minzoom: 10 },
  ];
  // mode -> station tier, mirroring how computeRouteTierFilters() buckets the
  // same networks' lines. Glasgow Subway rides with the Underground because
  // HYPERLOCAL_METRO_EXTRA puts its LINES in the hyperlocal tier too.
  var MODE_STATION_TIER = {
    underground: 'mode-hyperlocal',
    subway: 'mode-hyperlocal',
    dlr: 'mode-regional',
    tram: 'mode-regional',
    metro: 'mode-regional',
    // Heritage railway stations (183 added 2026-08-04 from NaPTAN's MET stops,
    // which register them alongside tram/metro). Tiered with the other small
    // dense networks: a preserved line is a handful of stations over a few
    // miles, which is exactly why mode-regional moved to z10.
    heritage: 'mode-regional',
  };
  function stationTierFilter(tierId) { return ['==', ['get', 'tier'], tierId]; }
  // Shared by both the station tiers and the route category tiers below —
  // conditionally includes minzoom only when defined (MapLibre treats an
  // explicit minzoom:undefined the same as omitting it, but building the
  // object without the key at all is clearer to read than relying on that).
  function addLayerOnce(def, minzoom, beforeId) {
    if (map.getLayer(def.id)) return;
    if (minzoom !== undefined) def.minzoom = minzoom;
    map.addLayer(def, beforeId);
  }
  // Invisible, generously-sized hit circle sitting on top of each visible
  // tier's real dot (2.8-4.0px radius, see stationsCirclePaint) — same
  // "too small to hit-test precisely" problem as the thin route lines
  // above, same fix shape. Hover/click are wired against these three
  // layers instead of the visible stations-circle-* ones (see
  // wireStationInteractions) — feature-state is still set against the
  // shared 'stations' source/id, so it correctly drives the visible dot's
  // own hover paint regardless of which layer the pointer actually hit.
  function stationsHitPaint() {
    return { 'circle-radius': 14, 'circle-color': '#000000', 'circle-opacity': 0, 'circle-stroke-width': 0 };
  }
  // Plain static hover glow — NOT the selected-marker's animated ring above,
  // and independent of it: this fires from feature-state 'hover' on the
  // regular (possibly unselected) station dots, so hovering some OTHER
  // station while a different one is selected shows this static halo on
  // the hovered dot while the selected dot keeps its own separate ripple
  // untouched. A quick opacity transition (160ms) just smooths the
  // appear/disappear snap — it is not a loop/pulse, the value is a single
  // constant while hovering, unlike the ring's continuous per-frame drive.
  // Same one-definition rule as stationsCirclePaint above: History reuses this
  // with a constant `true` on a layer filtered down to the single hovered
  // station, rather than owning a second glow spec.
  function stationsHoverGlowPaint(hoverExpr) {
    var c = themeColors();
    if (hoverExpr === undefined) hoverExpr = ['boolean', ['feature-state', 'hover'], false];
    return {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 7, 7, 12, 9.5],
      'circle-color': c.accent,
      'circle-blur': 0.6,
      'circle-opacity': ['case', hoverExpr, 0.4, 0],
      'circle-opacity-transition': { duration: 160 },
    };
  }

  // ── Heritage railway identity + selection ────────────────────────────────
  // 2026-08-03: heritage lines are now ALWAYS visible — there is no
  // show/hide state and no applyHeritageLineVisibility() any more. What used to
  // live here (heritageLineLayerIds/applyHeritageLineVisibility, driven by a
  // heritageLinesVisible flag off #heritage-btn) is gone; the button became a
  // highlight-all toggle, see setHeritageHighlightAll(). History still hides the
  // heritage tiers along with every other ROUTE_TIERS layer while it is active,
