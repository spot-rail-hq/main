          var totalS = MARQUEE_HOLD_S * 2 + scrollS;
          var holdEndPct = (MARQUEE_HOLD_S / totalS * 100).toFixed(3);
          var scrollEndPct = ((MARQUEE_HOLD_S + scrollS) / totalS * 100).toFixed(3);
          var name = 'marquee-' + (marqueeUid++);
          marqueeRuleText[name] = '@keyframes ' + name + ' { 0%, ' + holdEndPct + '% { transform: translateX(0); } ' +
            scrollEndPct + '%, 100% { transform: translateX(-50%); } }';
          names.push(name);
          track.style.setProperty('--marquee-name', name);
          track.style.setProperty('--marquee-duration', totalS.toFixed(2) + 's');
        });
      }
      marqueeGroupNames[groupKey] = names;
      marqueeStylesheet().textContent = Object.keys(marqueeRuleText).map(function (n) { return marqueeRuleText[n]; }).join('\n');
    });
  }
  function renderDepartureRows(rows) {
    var container = document.getElementById('sb-dep-rows');
    if (!container) return;
    container.innerHTML = departureRowsHtml(rows);
    applyMarquee('dep-board', container.querySelectorAll('.dep-dest, .dep-plat, .dep-status'));
  }

  // ── Sidebar selection state (station / from-to / saved-list / none) ──────
  var sidebarEl = document.getElementById('sidebar');
  var selTitleEl = document.getElementById('sb-selection-title');
  var starBtn = document.getElementById('sb-star-btn');
  var savedToggleBtn = document.getElementById('sb-saved-toggle');

  // 'station' isn't a `selection.type` any more — it's implied by
  // selectedStationCrs whenever `selection` itself is 'none', so the shared
  // station survives a tab switch without living inside the mode-specific
  // `selection` object at all.
  function effectiveSelectionType() {
    if (selection.type !== 'none') return selection.type;
    return selectedStationId ? 'station' : 'none';
  }

  function renderSelectionChrome() {
    // Tablet/mobile only — auto-snap the sheet to peek on a FRESH selection
    // (maximises map visibility once you've picked something) and back to
    // half when it's cleared, matching desktop's always-visible sidebar
    // default. Compared against the class's state before this call (not
    // just "type !== 'none'") so a re-render of the SAME still-open
    // selection — departure-board polling, background JSON arriving late —
    // never yanks the sheet back to peek out from under someone who
    // deliberately dragged it to half/full to read something.
    var hadSelectionForSheet = sidebarEl.classList.contains('has-selection');
    savedToggleBtn.setAttribute('aria-pressed', String(selection.type === 'saved'));
    // Task 2, extended Phase 6, extended Section 5 (2026-08-05): the shared
    // magenta highlight layer serves a named-route selection, a live
    // from/to panel, AND — now — a from/to route LOCKED after navigating
    // away to a station via its path list (activeFromToPath(), see its
    // comment). Only clear it when none of the three applies.
    if (selection.type !== 'route' && !activeFromToPath()) clearRoutePolyline();
    var type = effectiveSelectionType();
    if (type === 'none') {
      sidebarEl.classList.remove('has-selection');
      selTitleEl.textContent = '';
      starBtn.style.display = 'none';
      if (window.innerWidth <= 768 && hadSelectionForSheet && typeof setSheetState === 'function') setSheetState('half');
      // Search panel becomes the sheet's resting-state content (2026-08-07) —
      // shown by default whenever nothing's selected, desktop and mobile
      // alike, rather than requiring a click to reveal it. Always resets to
      // the Station tab on the way back in, same as a fresh page load — see
      // setSearchMode/searchMode's own comment for why referencing them here
      // (declared later in this same script) is safe. skipFocus: this fires
      // on every return to the resting state, not just an explicit tap — see
      // setSearchMode()'s own comment for why forcing focus here popped the
      // keyboard over the map with no user action involved.
      searchPanel.classList.add('open');
      setSearchMode('station', { skipFocus: true });
      return;
    }
    sidebarEl.classList.add('has-selection');
    // A real selection gets the sheet to itself — the search panel closes so
    // it doesn't sit above the entity content competing for space. Reopening
    // it (searchBtn) still works while a selection is showing; see that
    // handler's own comment.
    searchPanel.classList.remove('open');
    if (window.innerWidth <= 768 && !hadSelectionForSheet && typeof setSheetState === 'function') setSheetState('peek');
    if (type === 'station') {
      selTitleEl.textContent = selectedStationName;
      starBtn.style.display = '';
      starBtn.classList.toggle('starred', isStarred(selectedStationId));
    } else if (type === 'fromto') {
      selTitleEl.textContent = selection.fromName + ' → ' + selection.toName;
      // Saved routes are single-station records — a from/to pair doesn't map
      // onto that shape, so the star toggle is hidden in this mode.
      starBtn.style.display = 'none';
    } else if (type === 'saved') {
      selTitleEl.textContent = 'Saved stations';
      // The per-selection star (favorite the CURRENT station) doesn't apply
      // while browsing the saved list itself — that's what sb-saved-toggle,
      // up in the top bar, is for.
      starBtn.style.display = 'none';
    } else if (type === 'route') {
      var r = routesContent[selection.id];
      selTitleEl.textContent = (r && r.name) || selection.fallbackName || 'Route';
      starBtn.style.display = 'none';
    } else if (type === 'operator') {
      var o = selection.code && operatorsContent[selection.code];
      selTitleEl.textContent = (o && o.name) || selection.fallbackName || 'Operator';
      starBtn.style.display = 'none';
    } else if (type === 'heritage') {
      // Title comes from heritageDisplayName() rather than the content file
      // directly, so it still names the railway when heritage-content.json has
      // no entry (or has not loaded) — the generated lookup and the slug itself
      // are both better fallbacks than the word "Operator".
      selTitleEl.textContent = heritageDisplayName(selection.slug);
      // No star: favourites saves stations, and a heritage railway is not one.
      starBtn.style.display = 'none';
    } else if (type === 'histop') {
      var ho = historicalOperators[selection.slug];
      selTitleEl.textContent = (ho && ho.display_name) || selection.fallbackName || 'Operator';
      // History-mode entity panels have NO star for now — share and close
      // only. The favourites feature saves stations and is untouched here.
      starBtn.style.display = 'none';
    } else if (type === 'histline') {
      selTitleEl.textContent = selection.fallbackName || UNNAMED_LINE_LABEL;
      starBtn.style.display = 'none';
    } else if (type === 'histstation') {
      selTitleEl.textContent = (selection.station && selection.station.name) || 'Station';
      starBtn.style.display = 'none';
    }
    // History mode's title deliberately WRAPS instead of truncating (see
    // body.mode-history .sb-selection-title's CSS) — marqueeing would fight
    // that, and every type reachable while mode==='history' (histop/
    // histline/histstation) already gets that treatment, so this is a mode
    // check, not a per-type one.
    if (mode !== 'history') applyMarquee('sb-title', [selTitleEl]);
  }

  // ── Sidebar content build + animated transition (#14) ────────────────────
  // Whole-block fade-out, then a per-row staggered fade+rise entrance, on
  // every selection change. Content is rebuilt from scratch each cycle (not
  // persistent nodes with toggled classes) so an interrupted cycle can never
  // leave stale rows or a stale departure-board label behind. `selectionSeq`
  // both cancels an in-flight animation (a newer call always wins — no
  // queueing) and guards against a slow, superseded departures fetch writing
  // its result into the wrong (newer) board.
  var EXIT_MS = 110;
  var ROW_MS = 200;
  var STAGGER_MS = 30;
  var ENTRANCE_EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
  var contentBlock = document.getElementById('sb-content-block');
  var selectionSeq = 0;

  // ── Live-mode content (unchanged behaviour — station board / from-to board
  // / the live news feed default — just split into named pieces so the
  // Database-mode branches below can sit alongside them cleanly). ─────────
  function depBoardHtml(label) {
    return '<div id="sb-dep-board" data-anim-row style="display:block;">' +
      '<div class="db-head"><span class="db-label">' + label + '</span>' +
      '<button type="button" class="ghost-btn db-refresh-btn" id="sb-dep-refresh" aria-label="Refresh departures"><i class="ti ti-refresh"></i></button></div>' +
      '<div class="dep-cols"><span>Sched.</span><span>Destination</span><span>Plat.</span><span>Status</span></div>' +
      '<div id="sb-dep-rows"><div class="dep-empty">Loading departures…</div></div>' +
      '</div>';
  }
  function emptyDepBoardHtml() {
    return '<div id="sb-dep-board" style="display:none;"><div id="sb-dep-rows"></div></div>';
  }
  function liveNewsBlockHtml() {
    return '<div class="sb-sticky" data-anim-row>' +
      '<div class="sb-sticky-title-row"><span class="sb-sticky-title">Live updates</span><span class="sb-sticky-time" id="sb-updates-time">--:--</span></div>' +
      '<div class="scroll-fade"><div class="filter-row" id="filter-row"></div></div>' +
      '</div>' +
      '<div id="news-items"></div>' +
      '<div class="rebook-cta" id="rebook-cta" data-anim-row>Disrupted? Find alternatives →</div>' +
      '<div class="sb-footer-inline" data-anim-row>' +
      '<span id="sb-count">0 of 0</span>' +
      '</div>';
  }
  // Wraps the departures-side and news-side markup in the two hard-50/50
  // scroll panes (see .sb-dep-pane/.sb-news-pane CSS) — every Live-mode
  // skeleton function below goes through this, so the split is never
  // accidentally skipped for one state (station selected / from-to / empty).
  function liveSplitPanesHtml(depHtml, newsHtml) {
    return '<div class="sb-dep-pane" id="sb-dep-pane">' + depHtml + '</div>' +
      '<div class="sb-news-pane" id="sb-news-pane">' + newsHtml + '</div>';
  }
  // The currently-selected station's row when it has NO CRS, else null. The
  // single test both panel modes branch on.
  function selectedNonCrsRow() {
    if (selectedStationCrs || !selectedStationId) return null;
    var row = stationRowById(selectedStationId);
    return (row && !row.crs) ? row : null;
  }
  var MODE_LABELS = {
    underground: 'Underground', dlr: 'Light rail', tram: 'Tram',
    metro: 'Metro', subway: 'Subway', rail: 'National Rail',
    heritage: 'Heritage railway',
  };
  // Phrased as a fixed property of the data, not a pending feature: no amount of
  // waiting will produce a Darwin feed for a tram stop, and "coming soon" would
  // be a promise this map cannot keep.
  function nonCrsLiveNoticeHtml(row) {
    return '<div class="db-hint" data-anim-row>Live departures aren\'t available for ' +
      escapeAttr(row.network) + ' — this map covers National Rail departures only.</div>';
  }
  function stationLiveSkeletonHtml() {
    var nonCrs = selectedNonCrsRow();
    // The departure board is OMITTED entirely rather than rendered empty.
    // loadDepartureBoard() is (correctly) never called for these stations, so a
    // rendered board would sit in its resting state permanently and read as
    // broken rather than as out of scope.
    if (nonCrs) return liveSplitPanesHtml(nonCrsLiveNoticeHtml(nonCrs), liveNewsBlockHtml());
    return liveSplitPanesHtml(depBoardHtml('Departures'), liveNewsBlockHtml());
  }
  // Phase 6: this used to check selection.directRouteId (a CURATED named-
  // route lookup against routes-content.json, which is empty bar its
  // _notes placeholder — meaning this message showed for literally every
  // From/To pair, regardless of whether a real route existed, an open item
  // flagged when the map bugs were first scoped). Now reflects the real
  // segment-graph pathfinding result instead — a meaningfully different,
  // much more useful signal.
  function fromToNoRouteNoteHtml() {
    var p = selection.fromToPath;
    if (!p || p.found) return '';
    if (p.reason === 'loading') return '<div class="dep-empty" data-anim-row>Finding route…</div>';
    if (p.reason === 'not-national-rail') return '<div class="dep-empty" data-anim-row>Journey planning covers National Rail stations only — one of these is a tram, metro or Underground stop.</div>';
    if (p.reason === 'unsnapped') return '<div class="dep-empty" data-anim-row>No direct route found — one of these stations isn\'t on the mapped rail network yet.</div>';
    return '<div class="dep-empty" data-anim-row>No direct route found between these stations.</div>'; // 'disconnected' (e.g. an isolated metro system vs. the mainline) or any other reason
  }
  function fromToSkeletonHtml() {
    // Next-trains data above comes live from Darwin/Huxley2 and is
    // independent of the graph pathfinding result, so it still renders
    // normally even when there's no connected route for this pair — this
    // note is purely about the map's route highlight, not whether live
    // services exist.
    return liveSplitPanesHtml(depBoardHtml('Next trains') + fromToNoRouteNoteHtml(), liveNewsBlockHtml());
  }
  function liveDefaultSkeletonHtml() {
    return liveSplitPanesHtml(emptyDepBoardHtml(), liveNewsBlockHtml());
  }

  // ── Database-mode content (Task 3) ────────────────────────────────────────
  // .db-label is the same mono/uppercase/turquoise section-label style
  // "DEPARTURES"/"Next trains" already use, just no longer scoped under
  // #sb-dep-board so it's reusable here too — same visual language, per the
  // instruction to keep the existing look.
  function dbFieldHtml(label, valueHtml) {
    if (valueHtml === null || valueHtml === undefined || valueHtml === '') return '';
    return '<div class="db-field" data-anim-row><div class="db-label">' + label + '</div><div class="db-value">' + valueHtml + '</div></div>';
  }
  // "Always show the label, placeholder text if empty" variant (2026-07-17)
  // — used for Managed by/Location (and Photo's own label, see
  // dbPhotoBlockHtml()) so a stub-tier station's panel visibly shows what
  // COULD be there rather than silently omitting the field, distinct from
  // dbFieldHtml() above which still hides entirely when empty (Platforms/
  // Opened/Listed status/Notable features etc. — unchanged for now).
  function dbFieldOrPlaceholderHtml(label, valueHtml) {
    var value = (valueHtml === null || valueHtml === undefined || valueHtml === '') ? 'Not available' : valueHtml;
    return '<div class="db-field" data-anim-row><div class="db-label">' + label + '</div><div class="db-value">' + value + '</div></div>';
  }
  function dbComingSoonHtml(title) {
    return '<div class="db-empty" data-anim-row><div class="db-label">' + escapeAttr(title || '') + '</div>' +
      '<p>No database entry yet — content coming soon.</p></div>';
  }

  // headline is a punchy 8-12 word sentence from scripts/fetch-wikipedia-
  // facts.mjs (replaced an earlier full-paragraph "synopsis" field) — see
  // that script's header for the OSM/Wikipedia field-ownership split.
  //
  // 2026-07-18: reverted back to hide-entirely-when-absent (briefly tried
  // an always-shown "no headline available" placeholder the same day —
  // decided against it per direct feedback: a one-sentence headline should
  // be extractable from nearly any article with real prose (confirmed by
  // the full-article-length research literally the same day — see
  // scripts/output/full-article-length-research.json), so a genuinely
  // missing headline is the rare real exception, not a routine gap worth
  // permanently occupying panel space for. "Not available" placeholders
  // are reserved for core single-value database fields (Location, Managed
  // by) — headline/Notable features are narrative content, not a fact
  // slot, and skip silently when extraction has nothing.
  function dbHeadlineHtml(headline) {
    return headline ? '<p class="db-headline" data-anim-row>' + escapeAttr(headline) + '</p>' : '';
  }
  // CC BY-SA requires attribution alongside the content it covers — distinct
  // from the map layer's own OSM/ODbL attribution (AttributionControl,
  // top-right of the map). Gated on entry._wikipedia (only ever set by
  // fetch-wikipedia-facts.mjs after it actually pulled content), not on
  // wikipedia_title alone, which can be set by a curator before any fetch
  // has run — that shouldn't imply Wikipedia content is showing yet.
  //
  // 2026-07-17: plain "Source: Wikipedia" now, no article-title/CC-BY-SA
  // suffix — was inconsistent across operators, since the suffix used the
  // MATCHED ARTICLE'S title (entry._wikipedia.title), not the entity's own
  // curated name, and those diverge for some operators (e.g. West Midlands
  // Railway's matched article is literally titled "West Midlands Trains" —
  // confirmed live this is exactly why that one operator alone rendered
  // "Source: Wikipedia — West Midlands Trains (CC BY-SA) →" while most
  // others, where article title happens to equal the entity name, looked
  // plain). Returns a bare fragment now (no wrapping div/data-anim-row of
  // its own) — see dbBottomLinksHtml() below, which wraps it together with
  // the Google Map link in one row.
  //
  // sourceType: 'settlement-article' (2026-07-16 station panel rework) —
  // set by fetch-wikipedia-facts.mjs's NO_DEEP_LINK_KEYS handling for a
  // geo-confidence match whose article turned out to be about the town/
  // village the station sits in, not a dedicated station page (see
  // scripts/output/wikipedia-coverage-report.json's geoMatchTownArticleDetail
  // — the bucket is empty as of the 2026-07-16 matching-bug fix, but the
  // mechanism stays live for any future genuine case). Renders as plain,
  // non-linked text — no deep-link to a page that isn't really about the
  // station. Deliberately KEEPS the place-name qualifier here (unlike the
  // plain-link case above) — the whole point of this branch is to disclose
  // which place the source actually covers, since it isn't the station
  // itself; dropping that would defeat the reason it exists.
  // 2026-07-19: dropped the "Source: " prefix — link text is now just
  // "Wikipedia" (see the approved link-row mockup), matching the plain
  // "Wikipedia" label the settlement-article branch below also now uses.
  function dbWikipediaAttributionHtml(entry) {
    var wiki = entry && entry._wikipedia;
    if (!wiki || !wiki.url) return '';
    if (wiki.sourceType === 'settlement-article') {
      return '<span class="db-source-plain">Wikipedia (' + escapeAttr(wiki.title || '') + ')</span>';
    }
    return '<a href="' + escapeAttr(wiki.url) + '" target="_blank" rel="noopener">Wikipedia</a>';
  }

  // Leftmost link + Wikipedia, paired on one row at the bottom of the panel
  // (2026-07-17, per the approved mockup — Google Map alone used to render
  // near the top, a leftover pre-Phase-D position; extended 2026-07-19 to
  // add Official website as operators' leftmost link). Shared by the
  // station panel, operator panel, and route panel.
  //
  // Which leftmost link renders is keyed off `coords`, not entity kind
  // directly — coords is only ever passed for the station panel (routes and
  // operators always pass null, per their call sites below), so "coords
  // truthy" IS "this is the station panel" here. That's deliberate: stations
  // now also have a `website` field (scripts/fetch-official-websites.mjs,
  // 2026-07-19 — usually a generic National Rail station-details page), but
  // per the approved mockup stations keep Google Map as their leftmost link
  // unconditionally — entry.website is simply never consulted when coords is
  // present, so a station's website value (if any) doesn't leak into this
  // row. Only the operator/route path (coords null) shows Official website.
  //
  // Google Map prefers entry._google.placeId (scripts/fetch-station-place-
  // ids.mjs, added 2026-07-17 — a Places API Text Search match, deep-links
  // straight to the correct map entry) over the plain lat/lon query link,
  // since a raw coordinate search can land on the wrong nearby POI when
  // several places share a location (station forecourt shops, adjacent bus
  // stops). Falls back to the coords query link when no placeId has been
  // fetched yet, so the link never disappears mid-rollout.
  function dbBottomLinksHtml(entry, coords) {
    var leftLink;
    if (coords) {
      var placeId = entry && entry._google && entry._google.placeId;
      leftLink = placeId
        ? '<a href="https://www.google.com/maps/place/?q=place_id:' + encodeURIComponent(placeId) + '" target="_blank" rel="noopener">Google Map</a>'
        : '<a href="https://www.google.com/maps/search/?api=1&query=' + coords[1] + ',' + coords[0] + '" target="_blank" rel="noopener">Google Map</a>';
    } else {
      var website = entry && entry.website;
      leftLink = website ? '<a href="' + escapeAttr(website) + '" target="_blank" rel="noopener">Official website</a>' : '';
    }
    var wikiLink = dbWikipediaAttributionHtml(entry);
    var parts = [leftLink, wikiLink].filter(function (p) { return !!p; });
    if (!parts.length) return '';
    return '<div class="db-field" data-anim-row><div class="db-links">' + parts.join('<span class="db-link-sep">|</span>') + '</div></div>';
  }

  // Exact-attribution photo credit — see .db-photo-credit's CSS comment for
  // why this is built from three separate stored fields rather than one
  // free-typed string. Whole line links to photo.sourceUrl when present
  // (good CC-license practice, and matches the reference example's implicit
  // "credit links back to the source" pattern), plain text otherwise.
  function dbPhotoCreditHtml(photo) {
    if (!photo || !photo.photographer || !photo.source || !photo.license) return '';
    var text = escapeAttr(photo.photographer) + ' – ' + escapeAttr(photo.source) + ' – ' + escapeAttr(photo.license);
    if (photo.sourceUrl) {
      return '<div class="db-photo-credit"><a href="' + escapeAttr(photo.sourceUrl) + '" target="_blank" rel="noopener">' + text + '</a></div>';
    }
    return '<div class="db-photo-credit">' + text + '</div>';
  }

  // Always-shown Photo block (2026-07-17) — frame renders unconditionally
  // now, same "always show something" principle as dbFieldOrPlaceholderHtml()
  // above, instead of the whole block vanishing when there's no photo.url.
  // The "no image available" placeholder state mirrors database.html's
  // TrainImage() component exactly — see .db-photo-placeholder's CSS
  // comment. No "Photo" label above it (2026-07-19 feedback — redundant,
  // the image is self-evidently a photo) — credit renders as its own line
  // BELOW the frame (2026-07-19: briefly tried overlaying it on the image
  // like database.html's TrainImage(), reverted — read as messy at this
  // sidebar's narrower width, see .db-photo-credit's CSS comment).
  function dbPhotoBlockHtml(photo, altName) {
    var frame = (photo && photo.url)
      ? '<img src="' + escapeAttr(photo.url) + '" alt="' + escapeAttr(altName || '') + '" loading="lazy" />'
      : '<div class="db-photo-placeholder">no image available</div>';
    var credit = (photo && photo.url) ? dbPhotoCreditHtml(photo) : '';
    return '<div class="db-photo" data-anim-row><div class="db-photo-frame">' + frame + '</div>' + credit + '</div>';
  }

  // Bulleted notable-features list — shared by stations and operators (both
  // populate the same notable_features shape from scripts/fetch-wikipedia-
  // facts.mjs). Reverted to hide-entirely-when-absent 2026-07-18 — same
  // reasoning as dbHeadlineHtml() above (narrative content, not a fact
  // slot; "Not available" reserved for core single-value fields like
  // Location/Managed by).
  function notableFeaturesHtml(features) {
    if (!features || !features.length) return '';
    return '<div class="db-field" data-anim-row><div class="db-label">Notable features</div><ul class="db-notable-list">' +
      features.map(function (f) { return '<li>' + escapeAttr(f) + '</li>'; }).join('') + '</ul></div>';
  }

  // ── schema.org JSON-LD injection ──────────────────────────────────────────
  // schema_jsonld is precomputed by scripts/build-schema-jsonld.mjs — this
  // just puts that object, verbatim, into a <script type="application/
  // ld+json"> tag in <head> for whichever entity's detail view is currently
  // showing (called from rebuildSidebarContent() below, the one place that
  // already knows which of those three views — if any — is on screen).
  // Reuses a single tag id, replacing/removing it each call, so switching
  // selections or clearing one never leaves stale/duplicate tags behind.
  //
  // COVERAGE CAVEAT (investigated for this task, not solved by it): this
  // only helps crawlers that execute JavaScript and re-inspect the DOM
  // after it runs — Googlebot does, but not every crawler/AI answer engine
  // does this reliably, and none of them see this tag in the page's initial
  // HTML response (map.html ships with an empty <head> for this purpose;
  // the tag only exists after a user/crawler actually selects an entity in
  // a running page). A crawler that only fetches raw HTML, or that renders
  // JS but never simulates the click/search interactions needed to reach a
  // given station/route/operator, will never see that entity's JSON-LD at
  // all. Full coverage would need either static per-entity pages or
  // server-side rendering that bakes the relevant JSON-LD into the initial
  // HTML response for a given URL — a genuinely bigger architecture change
  // (the site currently has no per-entity URLs/routing at all), flagged
  // here as a candidate future task rather than attempted in this one.
  var SCHEMA_JSONLD_ID = 'db-schema-jsonld';
  function injectSchemaJsonLd(jsonld) {
    var existing = document.getElementById(SCHEMA_JSONLD_ID);
    if (existing) existing.remove();
    if (!jsonld) return;
    var tag = document.createElement('script');
    tag.type = 'application/ld+json';
    tag.id = SCHEMA_JSONLD_ID;
    tag.textContent = JSON.stringify(jsonld);
    document.head.appendChild(tag);
  }

  // Accessibility field removed (2026-07-16 station panel rework, per the
  // approved mockup) — wheelchair data is still fetched/stored by
  // scripts/fetch-osm-facts.mjs (s.wheelchair), just no longer rendered
  // here. wheelchairLabel()/WHEELCHAIR_LABELS removed with it — this was
  // their only caller.
  // `opts` (2026-07-27) exists so History mode can render this exact panel for
  // a still-open station WITHOUT going through selectStation() — i.e. without
  // touching selectedStationCrs/selectedStationName, without a departure-board
  // fetch, and without the mode flag moving. Called with no argument this is
  // byte-for-byte the Database-tab behaviour it always had.
  //   opts.crs / opts.name  — render this station instead of the live selection
  //   opts.omitBottomLinks  — caller supplies its own link row (History uses a
  //                           lat/lon Google Map link, not a Place ID — closed
  //                           stations have no Place ID and the panel should
  //                           not switch link styles depending on the station)
  // CRS, platforms and managed-by are OMITTED rather than printed as "Not
  // available" three times over — none of them can ever be populated for a
  // station that has no CRS to key stations-content.json by (managed_by is
  // also just out of scope for this pass — see the 2026-08 non-CRS pass
  // notes), so a placeholder would advertise a permanent gap as a temporary
  // one. Location is the same story, so it's never rendered here either.
  //
  // 2026-08 non-CRS content pass: stationsContent is now ALSO keyed by ATCO
  // code for these 632 stations (headline/notable_features/photo/
  // wikipedia_title/_google.placeId — see stations-content.json's own
  // notes) — every row has a seeded {name, mode} entry at minimum, so `s` is
  // never itself falsy here, unlike the CRS path's `if (!s) return
  // dbComingSoonHtml(...)`. hasContent gates between the two visual states:
  // a station with real enrichment gets the same headline/photo/notable-
  // features/links treatment as a CRS station (same helpers, same order —
  // dbHeadlineHtml/dbPhotoBlockHtml/notableFeaturesHtml/dbBottomLinksHtml
  // are all shared, unmodified); one with none (Wikipedia coverage sweep
  // found real per-stop articles for ~72% of these 632 — the rest is
  // genuine source-material absence, not a bug, see project notes) falls
  // back to exactly the original bare Network/Mode/Coordinates-only fields,
  // unchanged — never a photo placeholder or empty sections for a station
  // that has nothing to show.
  function nonCrsDatabaseHtml(row) {
    var s = stationsContent[row.atco] || {};
    var baseFields = dbFieldHtml('Network', escapeAttr(row.network)) +
      dbFieldHtml('Mode', escapeAttr(MODE_LABELS[row.mode] || row.mode)) +
      dbFieldHtml('Coordinates', escapeAttr(row.lat.toFixed(5) + ', ' + row.lon.toFixed(5)));
    var hasContent = !!(s.headline || s.photo || s.wikipedia_title || (s._google && s._google.placeId));
    if (!hasContent) return baseFields;
    var html = dbHeadlineHtml(s.headline);
    html += dbPhotoBlockHtml(s.photo, s.name || row.name);
    html += baseFields;
    html += dbFieldHtml('Year opened', s.opened_year);
    html += notableFeaturesHtml(s.notable_features);
    html += dbBottomLinksHtml(s, [row.lon, row.lat]);
    return html;
  }
  function stationDatabaseSkeletonHtml(opts) {
    opts = opts || {};
    // opts.crs is set by History mode to render a specific closed station; only
    // the LIVE selection can be a non-CRS stop.
    if (!opts.crs) {
      var nonCrs = selectedNonCrsRow();
      if (nonCrs) return nonCrsDatabaseHtml(nonCrs);
    }
    var crs = (opts.crs || selectedStationCrs || '').toUpperCase();
    var s = stationsContent[crs];
    if (!s) return dbComingSoonHtml(opts.name || selectedStationName || crs);
    var html = '';
    // Headline now renders BEFORE the photo (2026-07-19 feedback — directly
    // under the title, ahead of the image). Photo (2026-07-17: always shown
    // now, "no image available" placeholder when absent — see
    // dbPhotoBlockHtml() and its CSS comment for the database.html
    // TrainImage() parity this mirrors). photo is populated by
    // scripts/fetch-station-photos.mjs when available (deterministic
    // Wikipedia/Commons lookup, requires wikipedia_title already set —
    // never guesses one) or set manually; either way this renders the
    // placeholder until one exists, most stations (stub-tier, no-article-
    // tier, and the pending disambiguation-only bucket) won't have one yet.
    html += dbHeadlineHtml(s.headline);
    html += dbPhotoBlockHtml(s.photo, s.name);
    // Location/Managed by (2026-07-17: always shown now, "Not available"
    // placeholder when absent — see dbFieldOrPlaceholderHtml()). Managed by
    // is the organisation managing the station itself, distinct from
    // Services below (the TOCs whose trains call there) — e.g. Manchester
    // Piccadilly: Managed by = Network Rail, Services = Avanti West Coast/
    // CrossCountry/etc. Both are Wikipedia-infobox-tier-dependent, same as
    // Opened — see scripts/fetch-wikipedia-facts.mjs's STATION_FIELD_SPECS.
    html += dbFieldOrPlaceholderHtml('Location', s.location);
    // Managed by/Platforms/Station code/Year opened — standardized into one
    // 2-column grid, this exact order, across every station regardless of
    // tier (2026-07-19). All four now use the "always show the label,
    // 'Not available' placeholder if empty" treatment Managed by/Location
    // already had — Platforms/Opened used to hide entirely when empty
    // (dbFieldHtml), which meant a stub-tier station could silently drop to
    // a lopsided 1 or 3-field grid instead of a consistent 2x2. Station
    // code (the CRS itself, already in scope as `crs`) never actually needs
    // the placeholder in practice — it's available for all 2,637 stations
    // regardless of Wikipedia tier — but uses the same helper for a
    // consistent grid cell regardless.
    html += '<div class="db-field-grid">' +
      dbFieldOrPlaceholderHtml('Managed by', s.managed_by) +
      dbFieldOrPlaceholderHtml('Platforms', s.platforms) +
      dbFieldOrPlaceholderHtml('Station code', crs) +
      dbFieldOrPlaceholderHtml('Year opened', s.opened_year) +
      '</div>';
    html += dbFieldHtml('Listed status', s.listed_status);
    if (s.operators && s.operators.length) {
      html += '<div class="db-field" data-anim-row><div class="db-label">Services</div><div class="db-chip-row" id="db-operator-chips">' +
        s.operators.map(function (name) { return '<button type="button" class="filter-chip db-op-chip" data-op="' + escapeAttr(name) + '">' + name + '</button>'; }).join('') +
        '</div></div>';
    }
    html += notableFeaturesHtml(s.notable_features);
    // Google Map + Wikipedia, bottom of panel, paired on one row — moved
    // 2026-07-17, see dbBottomLinksHtml(). Google Map prefers the stored
    // _google.placeId (scripts/fetch-station-place-ids.mjs), falling back to
    // a lat/lon-constructed link when no placeId is set yet. Street View
    // link removed (2026-07-16, per the approved mockup).
    if (!opts.omitBottomLinks) html += dbBottomLinksHtml(s, coordsForCrs(crs));
    return html || dbComingSoonHtml(s.name);
  }
  function wireStationDatabaseDetail() {
    var chipsEl = document.getElementById('db-operator-chips');
    if (!chipsEl) return;
    Array.prototype.forEach.call(chipsEl.querySelectorAll('.db-op-chip'), function (btn) {

  // ── Database-mode From/To panel ──────────────────────────────────────────
  // A From/To search run from the Database tab used to fall through to the
  // LIVE skeleton — departure board, "Live updates" heading, filter chips,
  // news feed and all — because sidebarSkeletonHtml() matched
  // selection.type === 'fromto' before it ever looked at the mode (reported
  // 2026-07-26: "when I search from database tab, it always shows the live
  // updates which supposed to be under Live tab"). Database mode gets the
  // database view of the same thing instead: what the resolved path IS,
  // rather than what's running on it right now.
  // A path node's id is 'S:' + either a real CRS ('S:BHM') or, since the
  // 2026-08-05 S:null/ATCO fix, 'A:'+atco for a station with no CRS
  // ('S:A:9400ZZLUNDN' — a tram/metro/Underground stop). Strips the graph
  // prefix down to the bare id stationRowById()/stationNameForId() expect
  // (CRS as-is, or the ATCO with its 'A:' marker removed).
  function pathNodeToStationId(rawNodeId) {
    var s = String(rawNodeId);
    if (s.slice(0, 2) !== 'S:') return null; // not a station node (a plain OSM way-node mid-segment)
    s = s.slice(2);
    return s.slice(0, 2) === 'A:' ? s.slice(2) : s;
  }
  // A From/To search's endpoints are always real National Rail stations —
  // computeFromToPath() only ever resolves fromCrs/toCrs through
  // routingGraph.station_node, which build-routing-graph.mjs builds CRS-only
  // (see its comment: a tram/metro/Underground stop "has no node in it and
  // never can have one"). So this is 'rail' for every search possible
  // through the UI today. Written as a real per-row check rather than a
  // hardcoded constant so it stays correct if a non-CRS endpoint is ever
  // wired up later.
  function stationNetworkMode(row) {
    return (row && row.crs) ? 'rail' : 'other';
  }
  // "Stations along this path" is every station whose position the ROUTE'S
  // TRACK physically passes — not the same thing as calling points, and the
  // panel already says so. But Phase 3's station-to-segment snapping
  // (build-station-graph-links.mjs) attaches by nearest-segment proximity
  // with no mode filter at all, so ~125 tram/metro/Underground stops
  // nationwide ended up attached to a purely National-Rail-operated segment
  // just because they sit physically close to it (verified: none of them
  // are actually served by the rail operator running that track — e.g.
  // Neasden/Dollis Hill/Willesden Green/Kilburn/Finchley Road/Swiss Cottage/
  // St John's Wood on the Chiltern main line, which runs immediately
  // parallel to the Metropolitan/Jubilee line there but never touches it).
  // For a single-mode search (both ends the same network — currently always
  // National Rail, see stationNetworkMode() above), a path node from a
  // DIFFERENT network is filtered out unless it's a genuine interchange.
  //
  // Investigated two candidate signals for "genuine interchange" before
  // deciding what to ship, rather than guessing:
  //  (a) Does the attached segment carry a REAL rail + non-rail operator
  //      pairing (genuine shared running, not just proximity)? Checked
  //      every segment in the current graph: only 3 non-CRS stations
  //      nationwide attach to one. Two are real (Fellgate and Stadium Of
  //      Light, Tyne & Wear Metro trains running on Northern-operated
  //      track at Sunderland) — but the third, Chalk Farm, is tagged
  //      ['Lioness', 'WMR'], and WMR (West Midlands Railway) has no service
  //      anywhere near London. That's a pre-existing operator-
  //      canonicalisation data bug upstream of this fix, not a real
  //      interchange — trusting the tag as-is would surface a station on
  //      bad data. n=3 with one confirmed wrong is too small and too
  //      unreliable to safely automate.
  //  (b) Coordinate proximity to a real CRS station? No clean threshold
  //      exists: genuine interchanges range from ~150m (Victoria) to ~290m
  //      (Tottenham Court Road) apart, which overlaps the distance between
  //      pairs of stations that are NOT the same interchange at all
  //      (Kilburn Underground / Brondesbury Rail, ~220m apart, are two
  //      unrelated stations).
  // Neither held up as an accurate automated override, so this ships the
  // mode-match filter alone — the reliable half of the two signals actually
  // checked — rather than trade the current wrong list for a differently-
  // wrong one. A hand-curated interchange allow-list is possible future
  // work if this turns out to matter in practice.
  function pathStationIds() {
    var p = selection.fromToPath;
    if (!p || !p.found) return [];
    var searchMode = stationNetworkMode(stationRowById(selection.fromCrs)); // === toCrs's mode, always, today
    // selection.fromCrs is already a bare CRS (not a graph node id) — the
    // starting point of the walk, everything after it comes from edges[].to.
    var ids = [selection.fromCrs];
    for (var i = 0; i < p.edges.length; i++) {
      var id = pathNodeToStationId(p.edges[i].to);
      if (id) ids.push(id); // omits a plain way-node between stations, not a station itself
    }
    var out = [];
    for (var j = 0; j < ids.length; j++) {
      var row = stationRowById(ids[j]);
      if (stationNetworkMode(row) !== searchMode) continue;
      out.push(ids[j]);
    }
    return out;
  }
  function fromToDatabaseSkeletonHtml() {
    var p = selection.fromToPath;
    if (!p || !p.found) return fromToNoRouteNoteHtml() || dbComingSoonHtml(selection.fromName + ' → ' + selection.toName);
    var html = '';
    var km = p.totalLength_m / 1000;
    // Miles alongside km: British railway distances are quoted in miles, and
    // the rest of the database panels use plain units with no jargon.
    html += dbFieldHtml('Distance', km.toFixed(1) + ' km (' + (km * 0.621371).toFixed(1) + ' miles)');
    var stationIds = pathStationIds();
    if (stationIds.length) {
      // Every station this path physically runs through, which is not the
      // same as a given train's calling points — worth saying plainly rather
      // than implying a timetable this panel doesn't have.
      html += '<div class="db-field" data-anim-row><div class="db-label">Stations along this path (' + stationIds.length + ')</div>' +
        '<div class="sv-list" id="db-path-stations">' +
        stationIds.map(function (id, i) {
          return '<div class="sv-item" data-id="' + escapeAttr(id) + '">' +
            '<span class="sv-name">' + (i + 1) + '. ' + escapeAttr(stationNameForId(id)) + '</span></div>';
        }).join('') + '</div></div>';
    }
    return html;
  }
  function wireFromToDatabaseDetail() {

  // Franchises render as an always-visible name/date-range list (mockup-

  // Shown only when the tileset metadata has positively told us this operator

  function operatorNoTrackNoticeHtml(code) {
    if (!code || operatorNoTrackCode !== code) return '';

  function operatorDetailSkeletonHtml() {

  function heritageDetailSkeletonHtml() {
    var slug = selection.slug;
    var r = heritageRailways[slug] || {};
    var c = heritageContent[slug] || {};
    var notice = heritageNoMapNoticeHtml(slug);
    var hasContent = !!(c.intro || c.website || c.length_km || c._wikipedia);
    if (!hasContent && !r.type) return notice || dbComingSoonHtml(heritageDisplayName(slug));
    var html = notice;
    html += dbHeadlineHtml(c.intro);
    // type_secondary exists on 6 railways that genuinely span two categories
    // (e.g. a preserved line that also runs a miniature railway) — joined rather
    // than dropped, since picking one would misdescribe them.
    var types = [c.type || r.type, r.type_secondary].filter(Boolean).map(heritageTypeLabel);
    html += dbFieldHtml('Type', types.join(' · '));
    // length_km (editorial) and km (generated, measured off the segment graph)
    // are the same quantity from two sources; prefer the editorial one. Suppress
    // 0 entirely — a "0.0 km" row on a no_line railway would contradict the
    // notice directly above it.
    var km = c.length_km || r.km;
    html += dbFieldHtml('Length', km ? (Math.round(km * 10) / 10) + ' km' : '');
    html += dbFieldHtml('Principal station', r.principal_station);
    html += dbBottomLinksHtml(c, null);
    return html;
  }

  function sidebarSkeletonHtml() {
    if (selection.type === 'saved') return '<div class="sv-list" id="sv-list" data-anim-row>' + savedListRowsHtml() + '</div>';
    if (selection.type === 'histop') return historicalOperatorSkeletonHtml();
    if (selection.type === 'histline') return historicalLineSkeletonHtml();
    if (selection.type === 'histstation') return historicalStationSkeletonHtml(selection.station || {}, selection.stationCoords);
    if (selection.type === 'route') return routeDetailSkeletonHtml();
    if (selection.type === 'operator') return operatorDetailSkeletonHtml();
    if (selection.type === 'heritage') return heritageDetailSkeletonHtml();
    if (selection.type === 'fromto') return mode === 'database' ? fromToDatabaseSkeletonHtml() : fromToSkeletonHtml();
    // HISTORY IS CHECKED BEFORE selectedStationId (2026-08-04), and the order is
    // the whole fix. selectedStationId is SHARED STATE across all three tabs, so
    // a station picked in Live or Database is still set after switching to
    // History — and this line used to render stationLiveSkeletonHtml() for it,
    // putting a live departure board and the Live-updates feed inside the
    // History tab. Reported from a screenshot showing "DEPARTURES / Loading
    // departures…" under History for Four Oaks.
    //
    // History's own station panel is the `histstation` branch above, which still
    // takes precedence — this only catches a station carried IN from another
    // tab, which History has nothing meaningful to say about, so it falls
    // through to the slider's default view.
    if (mode === 'history') return historyDefaultSkeletonHtml();
    if (selectedStationId) return mode === 'database' ? stationDatabaseSkeletonHtml() : stationLiveSkeletonHtml();
    return mode === 'database' ? databaseDefaultSkeletonHtml() : liveDefaultSkeletonHtml();
  }
  function historyDefaultSkeletonHtml() {
    // A missing/unreachable tileset used to present as a silently blank map,
    // which is indistinguishable from "there was no railway in 1850". Say so
    // instead — the source error is caught below in wireHistoryMapInteraction.
    if (historyTilesFailed) {
      return '<div class="db-hint" data-anim-row>The historical map layer could not be loaded, so no lines or stations will appear before 1994. ' +
        'The rest of History mode still works.</div>';
    }
    return '<div class="db-hint" data-anim-row>Drag the year slider, or tap a line or station on the map to see its history.</div>';
  }

  // Rebuilds #sb-content-block for the current state and re-wires whatever's
  // inside it. Shared by the animated transition below and by the very
  // first (unanimated) render on page load, and by background JSON arriving
  // late (see loadJsonContent above).
  function rebuildSidebarContent() {
    contentBlock.innerHTML = sidebarSkeletonHtml();
    if (selection.type === 'histop' || selection.type === 'histline' || selection.type === 'histstation') {
      wireHistoryPanel();
      // A still-open History station panel now embeds the Database reference
      // block, which carries the Services operator chips — wire them with the
      // same handler the Database tab uses. No-ops for closed-only stations
      // and for the operator/line panels, which have no such element.
      wireStationDatabaseDetail();
      // No schema.org JSON-LD for history entities yet — the stub content set
      // is too small for structured data to be meaningful, and emitting a
      // half-populated Organization record would be worse than none.
      injectSchemaJsonLd(null);
    } else if (selection.type === 'saved') {
      wireSavedListRows();
      injectSchemaJsonLd(null);
    } else if (selection.type === 'route') {
      wireRouteDetail();
      var routeEntry = routesContent[selection.id];
      injectSchemaJsonLd(routeEntry && routeEntry.schema_jsonld);
    } else if (selection.type === 'operator') {
      wireOperatorDetail();
      var operatorEntry = selection.code && operatorsContent[selection.code];
      injectSchemaJsonLd(operatorEntry && operatorEntry.schema_jsonld);
    } else if (selection.type === 'heritage') {
      // Nothing to wire — the heritage panel is static content plus the shared
      // .db-links anchors, no region chips or expandable rows. The explicit
      // branch still matters: without it this falls through to a later one and
      // leaves the PREVIOUS selection's JSON-LD in the document head.
      // heritage-content.json carries no schema_jsonld today, hence null.
      injectSchemaJsonLd(null);
    } else if (mode === 'database' && selection.type === 'fromto') {
      wireFromToDatabaseDetail();
      injectSchemaJsonLd(null); // a From/To path isn't a single catalogued entity
    } else if (mode === 'database' && selectedStationId) {
      wireStationDatabaseDetail();
      var stationEntry = selectedStationCrs ? stationsContent[selectedStationCrs.toUpperCase()] : null;
      injectSchemaJsonLd(stationEntry && stationEntry.schema_jsonld);
    } else if (mode === 'database' && !selectedStationId) {
      wireDatabaseDefault();
      injectSchemaJsonLd(null);
    } else if (mode === 'history') {
      // EXPLICIT HISTORY BRANCH (2026-08-04). Without it History fell into the
      // `else` below and wired the LIVE furniture — the departure-board refresh,
      // the news filter row and the Live-updates feed — into the History tab.
      // That is the other half of the same bug as sidebarSkeletonHtml()'s
      // ordering: the skeleton stopped RENDERING the live panel, and this stops
      // it being WIRED. History's own panels wire themselves in the histop /
      // histline / histstation branches above; its default view has nothing to
      // wire.
      injectSchemaJsonLd(null);
    } else {
      wireDepartureBoardRefresh(); // no-ops if this cycle has no dep-board (plain live-default view)
      renderFilterRow('filter-row', renderNews);
      renderNews();
      injectSchemaJsonLd(null); // departure board / from-to / live-default views describe no single entity
    }
    // .sv-name covers every station-name list this panel can show — saved
    // stations, a route's stopping stations, and "stations along this
    // path" — one call regardless of which branch above actually rendered
    // it, rather than repeating this at each call site.
    applyMarquee('sv-list', contentBlock.querySelectorAll('.sv-name'));
    updateSheetPeekSummary();
  }

  // Tablet/mobile only — the sheet's peek state (see CSS) shows just a
  // title + one-line teaser instead of the full content block. The content
  // model here is a bullet/field list per selection type (db-field, db-hint,
  // news-item, sv-name…), not a single teaser sentence anywhere, so this is
  // a best-effort scrape of whatever just got rendered rather than a proper
  // per-type teaser string — flagged in the report as a first-pass hack, not
  // a content-model fix. Selector order is priority, not markup order:
  // .news-title (live default), .db-hint (route/operator/heritage panels
  // with no fields yet, and the history/database defaults), .db-value (the
  // common station/route/operator field case), .sv-name (saved/stopping-
  // station lists) — first match wins.
  function deriveSheetTeaser() {
    var row = contentBlock.querySelector('.news-title, .db-hint, .db-value, .sv-name');
    var text = row ? row.textContent.replace(/\s+/g, ' ').trim() : '';
    if (!text) text = 'Tap to view details';
    if (text.length > 88) text = text.slice(0, 85).replace(/\s+\S*$/, '') + '…';
    return text;
  }
  function updateSheetPeekSummary() {
    var titleEl = document.getElementById('sb-peek-title');
    var teaserEl = document.getElementById('sb-peek-teaser');
    if (!titleEl || !teaserEl) return;
    var hasSelection = sidebarEl.classList.contains('has-selection');
    titleEl.textContent = hasSelection ? selTitleEl.textContent :
      (mode === 'database' ? 'Database' : (mode === 'history' ? 'History' : 'Live updates'));
    teaserEl.textContent = deriveSheetTeaser();
  }

  function playEntranceStagger(mySeq) {
    var rows = contentBlock.querySelectorAll('[data-anim-row]');
    Array.prototype.forEach.call(rows, function (row) {
      row.style.transition = 'none';
      row.style.opacity = '0';
      row.style.transform = 'translateY(8px)';
    });
    // Force layout so the 0/translateY(8px) start state is committed before
    // the delayed transitions below kick in — otherwise the browser can
    // coalesce it with the final state and skip the animation entirely.
    void contentBlock.offsetHeight;
    Array.prototype.forEach.call(rows, function (row, i) {
      setTimeout(function () {
        if (mySeq !== selectionSeq) return; // superseded — abandon this cycle
        row.style.transition = 'opacity ' + ROW_MS + 'ms ' + ENTRANCE_EASE + ', transform ' + ROW_MS + 'ms ' + ENTRANCE_EASE;
        row.style.opacity = '1';
        row.style.transform = 'translateY(0)';
      }, i * STAGGER_MS);
    });
  }

  function animateSidebarTransition() {
    var mySeq = selectionSeq;
    contentBlock.style.transition = 'opacity ' + EXIT_MS + 'ms ease-out';
    contentBlock.style.opacity = '0';
    setTimeout(function () {
      if (mySeq !== selectionSeq) return; // a newer selection cancelled this cycle
      rebuildSidebarContent();
      contentBlock.style.transition = 'none';
      contentBlock.style.opacity = '1';
      playEntranceStagger(mySeq);
    }, EXIT_MS);
  }

  function expandSidebarIfCollapsed() {
    sidebarEl.classList.remove('collapsed');
  }

  function departuresUrl(crs, toCrs, bust) {
    var url = '/api/map-departures?crs=' + encodeURIComponent(crs);
    if (toCrs) url += '&to=' + encodeURIComponent(toCrs);
    // Manual refresh (refreshDepartureBoard() below) needs to bypass
    // api/map-departures.js's Cache-Control: s-maxage=30 — a cache-busting
    // query param plus fetch's own no-store guarantees the request reaches
    // the origin instead of a 30s-old edge-cached response.
    if (bust) url += '&_=' + Date.now();
    return url;
  }

  // Shared by selectStation()/selectFromTo() and setMode() (Task 4 —
  // switching into Live with a station already selected needs a fresh
  // board, same as tapping the station directly would have given you).
  function loadDepartureBoard(crs, mySeq, toCrs) {
    fetch(departuresUrl(crs, toCrs)).then(function (r) { return r.json(); }).then(function (rows) {
      if (mySeq !== selectionSeq) return; // a newer selection replaced this board already
      renderDepartureRows(rows);
    }).catch(function () { if (mySeq === selectionSeq) renderDepartureRows([]); });
  }

  // Refresh icon in the departure board's header — force-refetches the
  // currently shown board without re-running the whole select/fade cycle.
  // This calls the exact same endpoint every station/from-to selection
  // already calls (just with a cache-buster), so there's no new backend
  // surface and no conflict with the RTT-backed api/map-departures.js: the
  // serverless function's own access-token cache is keyed on the refresh
  // token, not the request, so an on-demand refresh here reuses it exactly
  // like any other departures request would.
  function refreshDepartureBoard() {
    var crs = selection.type === 'fromto' ? selection.fromCrs : selectedStationCrs;
    if (!crs) return;
    var toCrs = selection.type === 'fromto' ? selection.toCrs : undefined;
    var btn = document.getElementById('sb-dep-refresh');
    if (btn) btn.classList.add('spinning');
    fetch(departuresUrl(crs, toCrs, true), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (rows) { renderDepartureRows(rows); })
      .catch(function () { renderDepartureRows([]); })
      .finally(function () { if (btn) btn.classList.remove('spinning'); });
  }
  function wireDepartureBoardRefresh() {
    var btn = document.getElementById('sb-dep-refresh');
    if (btn) btn.addEventListener('click', refreshDepartureBoard);
  }

  // ── Navigation history (back/forward + shareable links) ──────────────────
  // One history entry per meaningful entity change (station/route/operator/
  // from-to selection, or a Live<->Database tab switch) — NOT for
  // micro-interactions like typing in search or hovering, which never call
  // any of this at all (there's simply nothing here for them to trigger).
  // suppressHistoryPush guards the one case that legitimately calls these
  // same selection functions WITHOUT wanting a new entry: restoring state
  // from the URL on load or in response to a popstate (back/forward, native
  // OR the visible sb-back-btn/sb-forward-btn below) — those already ARE
  // the navigation, re-pushing would corrupt the stack (every back tap
  // would re-push the entry you just navigated to, making forward
  // impossible). buildStateUrl() covers exactly the four selectable entity
  // types (station/route/operator/fromto) — 'saved' is a browse view, not
  // a specific entity, and deliberately left out (falls through to "no
  // entity" instead, same as `selection.type === 'none'` with nothing
  // selected).
  var suppressHistoryPush = false;
  function buildStateUrl() {
    var params = new URLSearchParams();
    // Database is the default mode (no ?mode= param round-trips to it) — Live
    // is the one that now needs writing out explicitly, the reverse of when
    // Live was the default.
    if (mode === 'live') params.set('mode', 'live');
    // A shared historical view MUST restore both mode and year — one without
    // the other loads the wrong map. The year is always written while in
    // History mode, including when the slider-follow rules moved it as a side
    // effect of opening an entity.
    if (mode === 'history') {
      params.set('mode', 'history');
      params.set('year', String(historyYear));
    }
    if (selection.type === 'histop' && selection.slug) {
      params.set('histop', selection.slug);
    } else if (selection.type === 'route' && selection.id) {
      params.set('route', selection.id);
    } else if (selection.type === 'operator' && selection.code) {
      params.set('operator', selection.code);
    } else if (selection.type === 'heritage' && selection.slug) {
      params.set('heritage', selection.slug);
    } else if (selection.type === 'fromto') {
      // Only linkable when BOTH ends have a CRS — restoreStateFromUrl resolves
      // ?from/?to by CRS, and writing the string "null" into the URL would
      // produce a link that restores to a broken pair.
      if (selection.fromCrs && selection.toCrs) {
        params.set('from', selection.fromCrs);
        params.set('to', selection.toCrs);
      }
    } else if (selection.type === 'none' && selectedStationId) {
      // ?station= keeps its existing CRS meaning so every link already out in
      // the world still resolves; ?stop= is the new ATCO-carrying parameter for
      // the stations that have no CRS to put in ?station=.
      if (selectedStationCrs) params.set('station', selectedStationCrs);
      else params.set('stop', selectedStationId);
    }
    var qs = params.toString();
    return location.pathname + (qs ? '?' + qs : '');
  }
  function pushHistoryForCurrentState() {
    if (suppressHistoryPush) return;
    history.pushState({ srhq: true }, '', buildStateUrl());
  }
  // The slider year is NOT an entity-level change and must not push a history
  // entry — a single drag across the range would otherwise bury the user's
  // real navigation under a hundred back-button steps. replaceState keeps the
  // year shareable (it stays in the address bar, so copy/share picks it up)
  // without touching the stack.
  function replaceHistoryYearInUrl() {
    if (suppressHistoryPush || mode !== 'history') return;
    history.replaceState({ srhq: true }, '', buildStateUrl());
  }
  // Parses the current URL and drives the same selection functions used for
  // real interaction — so restoring a link and clicking your way there by
  // hand produce identical state. Only called once station-list.json and
  // routes/operators-content.json have all resolved (see the Promise.all
  // below) and the map itself has fired 'load', so CRS/route-id/operator-
  // code lookups and any map-dependent drawing (route polyline, selected-
  // marker points) all have real data to work with instead of racing it.
  function restoreStateFromUrl() {
    suppressHistoryPush = true;
    try {
      var params = new URLSearchParams(location.search);
      var rawMode = params.get('mode');
      // Database is the default (a missing/unrecognised ?mode= resolves to
      // it) — mirrors buildStateUrl()'s Database-is-implicit convention.
      var urlMode = rawMode === 'live' ? 'live' : (rawMode === 'history' ? 'history' : 'database');
      if (urlMode !== mode) setMode(urlMode);
      // Year is restored BEFORE any entity selection, so the slider-follow
      // rules see the shared year as the user's current position — Rule 1
      // then correctly leaves it alone if it is already inside the entity's
      // span, instead of overriding the exact year that was shared.
      if (urlMode === 'history') {
        var yr = parseInt(params.get('year'), 10);
        if (!isNaN(yr)) setHistoryYear(yr, { silent: true });
      }
      var histOp = params.get('histop');
      if (histOp) { selectHistoricalOperator(histOp, histOp); return; }
      var routeId = params.get('route');
      var operatorCode = params.get('operator');
      var heritageSlug = params.get('heritage');
      var fromCrs = params.get('from'), toCrs = params.get('to');
      var stationCrs = params.get('station');
      var stopId = params.get('stop');
      if (routeId && routesContent[routeId]) {
        selectRoute(routeId);
      } else if (heritageSlug) {
        // Same "restore the MAP too, not just the panel" rule the operator
        // branch below documents: selectHeritageRailway() re-locks the
        // highlight and re-runs the camera, so back/forward through heritage
        // picks behaves like the original click. Not gated on the slug existing
        // in heritageRailways — that file may not have loaded yet, and the panel
        // degrades to a slug-derived name rather than silently dropping the
        // selection.
        selectHeritageRailway(heritageSlug, true); // URL restore: fly, same as the operator branch below
      } else if (operatorCode) {
        // 2026-07-29: this used to call selectOperator() alone, which rebuilds
        // the SIDEBAR and nothing else — so going back/forward through operator
        // selections restored the panel while the map kept whatever highlight
        // and camera position it happened to have. Reported as "can the map
        // also go back/forward and re-fly?".
        //
        // Routed through the same helper the search pick uses, so a restored
        // operator gets the identical treatment: the tileset pre-check (no
        // camera movement for an operator with no track), the folded-operator
        // parent substitution, the highlight paint and the fly-to-network.
        selectOperator(operatorCode);
        highlightAndFlyToOperator(operatorCode, selectionSeq);
      } else if (fromCrs && toCrs) {
        var list = getStationList();
        var from = list.filter(function (s) { return s.crs === fromCrs; })[0];
        var to = list.filter(function (s) { return s.crs === toCrs; })[0];
        if (from && to) selectFromTo(from, to); else clearSelection();
      } else if (stopId) {
        selectStation(stationNameForId(stopId), stopId);
      } else if (stationCrs) {
        // Resolve the CRS to the row's identity before selecting, so a legacy
        // ?station= link lands in exactly the same state a click would.
        var stationRow = getStationList().filter(function (s) { return s.crs === stationCrs; })[0];
        var stationId = stationRow ? stationIdOf(stationRow) : stationCrs;
        selectStation(stationNameForId(stationId), stationId);
      } else {
        clearSelection();
      }
    } finally {
      suppressHistoryPush = false;
    }
  }
  window.addEventListener('popstate', restoreStateFromUrl);
  Promise.all([stationListPromise, routesContentPromise, operatorsContentPromise]).then(function () {
    if (map && map.loaded()) restoreStateFromUrl();
    else if (map) map.once('load', restoreStateFromUrl);
  });
  // Visible back/forward — wired to the browser's own session-history
  // stack (same one popstate above listens to), not a separate parallel
  // mechanism, so they stay correct alongside native browser back/forward,
  // swipe gestures, etc. This just gives that same mechanism an always-
  // visible affordance instead of relying solely on the browser chrome.
  document.getElementById('sb-back-btn').addEventListener('click', function () { history.back(); });
  document.getElementById('sb-forward-btn').addEventListener('click', function () { history.forward(); });
  // Share — copies (or hands off to the OS share sheet, where available)
  // a link built from the exact same buildStateUrl() used for history, so
  // "share this" and "the URL you'd get by navigating here yourself" are
  // always identical.
  var shareBtn = document.getElementById('sb-share-btn');
  function shareCurrentSelection() {
    var url = location.origin + buildStateUrl();
    var title = (selTitleEl && selTitleEl.textContent) || 'SpotRail HQ';
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(function () {}); // user-cancelled share sheet — not an error
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { flashShareCopied(); });
      return;
    }
    window.prompt('Copy this link:', url); // last-resort fallback, no Clipboard API available
  }
  function flashShareCopied() {
    if (!shareBtn) return;
    var icon = shareBtn.querySelector('i');
    var original = icon.className;
    icon.className = 'ti ti-check';
    shareBtn.classList.add('copied');
    setTimeout(function () { icon.className = original; shareBtn.classList.remove('copied'); }, 1400);
  }
  if (shareBtn) shareBtn.addEventListener('click', shareCurrentSelection);

  // Sets the ONE shared "selected station" (Task 4) — both Live and Database
  // rendering read selectedStationCrs/Name directly, so this single call is
  // enough for either tab to show it, now or after a later tab switch.
  // Takes an IDENTITY (see stationIdOf), not a CRS. The CRS is derived from the
  // matched row and is null for a tram/metro/underground stop — which is what
  // makes the Darwin guard below correct rather than merely careful.
  function selectStation(name, id) {
    var mySeq = ++selectionSeq;
    var row = stationRowById(id);
    // Normalised to the row's canonical id so a CRS-keyed caller (a route
    // stopping-station row, an old ?station= link) ends up in exactly the same
    // state as a marker click, and matches the `sid` on the map features.
    selectedStationId = row ? stationIdOf(row) : (id || null);
    // Fallback for an id that resolves to no row: a 3-character id can only be
    // a CRS (ATCO codes are far longer), so an old ?station=BHM link still
    // works even if station-list.json has not resolved yet.
    selectedStationCrs = row ? (row.crs || null) : (id && id.length === 3 ? id : null);
    selectedStationName = name;
    selection = { type: 'none' };
    renderSelectionChrome();
    expandSidebarIfCollapsed();
    animateSidebarTransition();
    // GUARDED on the CRS, not on the mode alone. Without this a non-CRS
    // station fires GET /api/departures?crs=null on every click — a request
    // that can never succeed, for a station that can never have departures.
    if (mode === 'live' && selectedStationCrs) loadDepartureBoard(selectedStationCrs, mySeq);
    var coords = coordsForId(id);
    setSelectedStationPoints(coords ? [{ lon: coords[0], lat: coords[1] }] : []);
    clearOperatorHighlight();
    pushHistoryForCurrentState();
  }

  // Does any curated route in routes-content.json cover this station pair
  // directly (both CRS codes in the same route's stopping_stations)? A plain
  // containment check — deliberately NOT multi-leg/interchange pathfinding
  // across different routes, which is out of scope (planned separately as
  // Phase 3 journey planning). routes-content.json is empty bar its _notes
  // placeholder right now, so this always returns null until routes are
  // actually curated — that's a content gap, not a bug.
  function findDirectRoute(fromCrs, toCrs) {
    var ids = Object.keys(routesContent);
    for (var i = 0; i < ids.length; i++) {
      var r = routesContent[ids[i]];
      if (r && r.stopping_stations && r.stopping_stations.indexOf(fromCrs) !== -1 && r.stopping_stations.indexOf(toCrs) !== -1) {
        return ids[i];
      }
    }
    return null;
  }

  // from/to are plain {name, crs, lat, lon} objects (station-list.json shape)
  function selectFromTo(from, to) {
    var mySeq = ++selectionSeq;
    selection = {
      type: 'fromto',
      fromCrs: from.crs, fromName: from.name,
      toCrs: to.crs, toName: to.name,
      directRouteId: findDirectRoute(from.crs, to.crs),
      // Phase 6: real graph-based pathfinding result, resolved async below
      // (routing-graph.json may still be loading, and finding the path's
      // actual line geometry needs the relevant map tiles loaded, which
      // needs a camera move first) — starts as 'loading' so the sidebar can
      // show something sensible before the real found/no-route result is
      // known, rather than a stale default.
      fromToPath: { found: false, reason: 'loading' },
    };
    renderSelectionChrome();
    // Bugfix: renderSelectionChrome()'s clearRoutePolyline() call only fires
    // when selection.type is NEITHER 'route' NOR 'fromto' — correct for not
    // wiping an in-progress fromto's highlight on every re-render, but that
    // also means switching from one fromto PAIR to a different one left the
    // OLD pair's magenta line on screen (found via a headless check: the
    // layer stayed visible:true after selecting a second, disconnected
    // pair). A fresh selection should always start with a clean highlight —
    // either the new pair's real path replaces it once resolved, or (no
    // route found) it just stays hidden, never a stale previous route.
    // Same reasoning extends to lockedFromToPath (Section 5): a fresh
    // search drops whatever the PREVIOUS search left locked, even though
    // activeFromToPath() would already prefer selection.fromToPath the
    // instant selection.type flips to 'fromto' a few lines up — explicit
    // here rather than relying on that precedence alone.
    clearRoutePolyline();
    lockedFromToPath = null;

    animateSidebarTransition();

    // guarded against.

    // fetched once, up front — usually already resolved by the time a user

      // 93 edges): a single map.once('idle', ...) is NOT reliable here.
      // MapLibre's 'idle' only fires on a TRANSITION into the idle state —
      // if the map happens to already be idle at the moment this is
      // registered (a real, observed race), it never fires again and the
      // geometry lookup never even gets attempted. A bounded settle loop
      // (settleFromToGeometry) sidesteps 'idle' semantics entirely instead —
      // simpler to reason about, and immune to the "already idle" pitfall.
      // Draws a first pass (real geometry where tiles are already loaded,
      // straight-line placeholders elsewhere — see the redesign note above
      // resolveOneFromToEdgeGeometry) then polls a few more times as more
      // tiles come in; scheduleFromToGeometryRefine picks up anything still
      // outstanding once the user zooms in further.
      setTimeout(function () {

  function clearSelection() {
    ++selectionSeq;

    selectedStationId = null;
    selectedStationName = null;

    // this, renderSelectionChrome()'s clearRoutePolyline() guard would see
    // activeFromToPath() still return the lock and skip clearing, so the
    // Clear button would silently fail to clear a route reached via a
    // station's path list.
    lockedFromToPath = null;

  // ── Route/operator selection (Task 1) ─────────────────────────────────────

  // (Task 1's graceful-missing-data requirement) rather than erroring.

    // below overwrites the visible line immediately either way, but without

    // and redraw the OLD from/to path over this one.
    lockedFromToPath = null;

  function selectHeritagePanel(slug) {

    expandSidebarIfCollapsed();
    animateSidebarTransition();

    pushHistoryForCurrentState();
  }

  // ── Route highlight polyline (Task 2) ─────────────────────────────────────
  // stopping_stations is an ordered list of CRS codes — coordinates are
  // resolved against station-list.json (the "naptan_stations… lat/lon" the
  // schema's own _notes point at isn't a file in this repo; station-list.json
  // is the closest equivalent already loaded client-side), NOT map-data.jsx's
  // orphaned hand-traced geometry, which is intentionally left untouched.
  // A station's stable identity: its ATCO code where NaPTAN gave it one, else
  // its CRS. 3,253 of 3,260 rows have an ATCO; the 7 that don't are the
  // Elizabeth-line/Overground rows NaPTAN files under an Underground/DLR
  // identity instead, which keep CRS as their id (see
  // scripts/migrate-station-list.mjs).
  function stationIdOf(s) {

  // lists are still everywhere — routes-content.json's stopping_stations, the
  // saved records written before this change, ?station= links — and they all
  // reach selection through here. A 3-character CRS can never collide with a
  // 9-to-12-character ATCO, so one lookup can serve both without ambiguity.
  function stationRowById(id) {
    if (!id) return null;
    var list = getStationList();
    for (var i = 0; i < list.length; i++) {
      if (list[i].atco === id || (list[i].crs && list[i].crs === id)) return list[i];

    var e = stationRowById(id);

  // CRS-keyed lookups are kept for the things that are genuinely CRS lists —
  // routes-content.json's stopping_stations, saved records written before this
  // change. The `if (!crs) return` guards are load-bearing, NOT defensive
  // tidying: without them `s.crs === crs` with crs == null matches all 632
  // non-CRS rows and [0] silently returns whichever happens to be first in the
  // file, so the selected-station marker landed on an unrelated tram stop.

  // ── Selected-station marker(s) ─────────────────────────────────────────────

  // STATION_TIERS/the map station marker tiering pass). Kept as its own
  // always-on-top source/layer because it still solves a real, separate
  // problem: a non-major station only renders once the map is zoomed past

  // fitBounds()-equivalent (flyToBoundsZoomedOut(), below) can easily land

  // silently no-op right after a theme toggle, leaving the selected-
  // station marker (now Phase 7's 200%-enlarged highlight) missing until
  // some unrelated later action happened to call this again. Dropped to
  // match the rest of the file's pattern.
  // Real bug found 2026-07-18 (reported as the selected dot still looking
  // "hollow" after the fill-color fix): renderSelectedStationMarkers() runs
  // unconditionally inside the very first addMapLayers() call, but
  // addStationsLayer() only runs there too IF stationsData has already
  // arrived by then (see the `if (stationsData)` guard around its call) —
  // otherwise the regular per-tier station dots get added LATER, from the
  // Promise.all(...).then() handler, as fresh map.addLayer() calls with no

  // already exists, so on that (very common — station data is a network
  // fetch, it essentially never beats the map's own 'load' event) timing
  // path, the regular dot for the selected station itself — dark fill,
  // turquoise STROKE (stationsCirclePaint) — ends up drawn OVER the
  // selected marker's solid turquoise fill, which is exactly a "turquoise
  // ring with a dark hollow center": not a symptom of the glow/blur at
  // all, a real z-order race. Same class of race applies to the magenta
  // route-highlight layer (drawMagentaHighlightGeometry), which can be
  // created even later still (only once pathfinding/route geometry
  // resolves). Fixed generally, not just patched for this one ordering, by
  // re-asserting the selected marker's on-top position from three places
  // any of these can legitimately run after it: here, at the end of
  // addStationsLayer(), and at the end of drawMagentaHighlightGeometry().
  function ensureSelectedMarkersOnTop() {
    if (!map) return;
    // Order matters: moving glow first, then dot, leaves the dot as the
    // final (truly topmost) layer — glow directly beneath it, same
    // relationship as when they're first created.
    if (map.getLayer(SELECTED_STATIONS_GLOW_LAYER_ID)) map.moveLayer(SELECTED_STATIONS_GLOW_LAYER_ID);

  var selectedMarkerRingRaf = null;

  // DIFFERENT station while already visible" as a quick fade-out, silent

    //

    });

    GLOW_RINGS.forEach(function (ring, i) { modernLineLayers.push('operator-lines-hover-glow-' + i); });
    modernLineLayers.forEach(function (id) {
      if (!map.getLayer(id)) return;
      if (mode === 'history') map.setLayoutProperty(id, 'visibility', showModern ? 'visible' : 'none');
    });

    // LIVE STATION MARKERS. These are a separate geojson source from the
    // historical station tiles and were not being touched at all, so the

    // "all stations remain unchanged throughout the timeline". In History mode

    STATION_TIERS.forEach(function (t) {

        'stations-circle-' + t.id,
        'stations-circle-' + t.id + '-hit',
        'stations-hover-glow-' + t.id,
        'stations-label-' + t.id,
      );
    });
    // THE SELECTED-STATION OVERLAY IS NO LONGER HIDDEN HERE (2026-08-04).
    //
    // It used to be. The 2026-07-27 reason was real: a station selected in
    // Live/Database left its large turquoise dot and animated ring floating
    // over the historical map — a ghost marker. Hiding the two layers killed

    // station produced no selection animation at all, because these are the
    // very layers that draw it.

    // overlay's POINTS on both History transitions (see its clearing calls), so

    // selectHistoricalStation() can set its own marker and get the same
    // solid-fill-plus-ping treatment as the other two tabs.
    //

    liveStationLayers.push(ROUTE_LAYER_ID, ROUTE_HIT_LAYER_ID);
